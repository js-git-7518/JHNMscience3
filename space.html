<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>중3 과학 혼자 공부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: 한 번에 레슨 하나. 넓은 화면은 왼쪽 목차 + 오른쪽 레슨, 휴대폰은 위쪽 목차 버튼 + 레슨 */
:root{
  --bg:#F3F6EF; --surface:#FFFFFF; --surface2:#E8EFE2; --ink:#1E2A20; --muted:#58685A; --line:#CFDAC8;
  --accent:#2F7A47; --accent-ink:#FFFFFF; --pea-y:#E6BF35; --pea-g:#77AD4C;
  --dom:#B4530C; --rec:#3F55B5; --ok:#2E7D32; --bad:#C62828; --hl:#FFE59A;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121813; --surface:#1A231C; --surface2:#233026; --ink:#E5EEE3; --muted:#A3B4A3; --line:#33433A;
  --accent:#6BC08B; --accent-ink:#0F1A12; --dom:#F2A04A; --rec:#93A6F2; --ok:#6CC070; --bad:#EF6A6A; --hl:#5B4C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1A231C; --surface2:#233026; --ink:#E5EEE3; --muted:#A3B4A3; --line:#33433A;
  --accent:#6BC08B; --accent-ink:#0F1A12; --dom:#F2A04A; --rec:#93A6F2; --ok:#6CC070; --bad:#EF6A6A; --hl:#5B4C12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:20px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcfoot{margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.prog{flex:0 0 120px;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.progtxt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tocbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:24px;
  padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.toc h3{font-size:16px;margin:10px 4px 6px;color:var(--accent)}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.45}
.toc a:hover{background:var(--surface2)}
.toc a.cur{background:var(--accent);color:var(--accent-ink)}
.toc a .n{font-family:var(--mono);font-size:12px;min-width:34px;opacity:.8;padding-top:1px}
.toc a .st{margin-left:auto;font-size:12px;opacity:.9}
.toc .closer{display:none}
main{min-width:0}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 26px}
.crumb{font-size:13px;color:var(--muted);font-family:var(--mono)}
.lesson h2{font-size:30px;margin:4px 0 14px}
.lesson p{margin:10px 0;max-width:68ch}
.easy{background:var(--surface2);border-radius:12px;padding:12px 16px;margin:14px 0}
.easy b.lbl,.book b.lbl,.warn b.lbl{display:block;font-family:var(--display);font-weight:400;font-size:17px;margin-bottom:2px}
.book{border:2px solid var(--accent);border-radius:12px;padding:12px 16px;margin:14px 0}
.book b.lbl{color:var(--accent)}
.warn{border-left:5px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface));border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0}
.warn b.lbl{color:var(--bad)}
.vis{border:1px dashed var(--line);border-radius:12px;padding:14px;margin:16px 0;overflow-x:auto;text-align:center}
.vis svg{max-width:100%;height:auto}
.vis .cap{font-size:13px;color:var(--muted);margin-top:6px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.dom{color:var(--dom);font-family:var(--mono);font-weight:700}
.rec{color:var(--rec);font-family:var(--mono);font-weight:700}
.g{font-family:var(--mono);font-weight:700;white-space:nowrap}
.key{background:var(--hl);border-radius:4px;padding:0 3px}
table.t{border-collapse:collapse;margin:10px auto;font-size:15px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.t th{background:var(--surface2)}
.tablewrap{overflow-x:auto}
/* quiz */
.quiz{margin-top:22px;border-top:2px solid var(--line);padding-top:14px}
.quiz h3{font-size:20px;color:var(--accent)}
.qitem{margin:14px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.qitem .qq{font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 14px;text-align:left}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb{margin-top:8px;font-size:15px;display:none}
.fb.show{display:block}
.fb .r{color:var(--ok);font-weight:700}.fb .w{color:var(--bad);font-weight:700}
.can{margin-top:20px;background:var(--surface2);border-radius:12px;padding:12px 16px}
.can h3{font-size:18px}
.can label{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
.can input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager .btn{min-width:130px}
/* punnett */
.pun{gap:4px}
.pun .h,.pun .c{min-width:70px;min-height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700}
.pun .h{background:var(--surface2);border:1px solid var(--line);font-size:17px}
.pun .h.corner{background:transparent;border:0;font-family:var(--body);font-weight:500;color:var(--muted);line-height:1.3}
.pun .c{background:var(--surface);border:1.5px dashed var(--line);font-size:16px}
.pun .c.on{border-style:solid;border-color:var(--accent);animation:pop .45s ease-out}
.pun .c small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.pun .h.lit{background:var(--hl)}
.pun.small .h,.pun.small .c{min-width:58px;min-height:58px;font-size:13px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.punleg{display:inline-block;text-align:left;font-size:14px;margin:0 auto 8px;line-height:1.6}
.punleg .sw{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px;border:1px solid var(--line)}
.punleg .hint{font-size:13px;color:var(--muted)}
.sw-top,.pun .h.htop{background:color-mix(in srgb,var(--rec) 18%,var(--surface))}
.sw-left,.pun .h.hleft{background:color-mix(in srgb,var(--dom) 18%,var(--surface))}
.pun .h.lit{background:var(--hl)!important}
.pun{display:grid;width:max-content;margin:6px auto}
.pun .h.corner{font-size:18px}
.vis > svg{width:100%;max-width:600px}
.sumbox{margin-top:10px;font-size:15px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;background:var(--surface2);border:1px solid var(--line);margin:2px;font-size:14px}
/* coins */
.coins{display:flex;gap:26px;justify-content:center;margin:8px 0}
.coin{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:30px;font-weight:700;
  background:radial-gradient(circle at 35% 30%,#F7E3A1,#D9AE3C);color:#4A3505;border:3px solid #B98E22}
.coin.flip{animation:flip .6s ease-in-out}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(540deg) scale(1.15)}100%{transform:rotateY(1080deg)}}
.bars{max-width:420px;margin:10px auto;text-align:left}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar .lab{width:48px;font-family:var(--mono);font-weight:700}
.bar .tr{flex:1;height:18px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.bar .num{width:84px;font-variant-numeric:tabular-nums;color:var(--muted)}
/* steps */
.stepbox{min-height:3.4em;font-size:15px;background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px;text-align:left}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);text-align:center;min-width:0}
.card b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.card button{margin-top:6px}
.fade-in{animation:fadeIn .5s ease-out both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mt0{margin-top:0}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.home-grid a{display:block;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.home-grid a b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--accent)}
.svgtxt{font-family:var(--body);fill:var(--ink)}
.svgmono{font-family:var(--mono);font-weight:700}
@media (max-width: 900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.toc{display:none;position:fixed;inset:0;max-height:none;border-radius:0;z-index:20;
    padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  nav.toc.open{display:block}
  .toc .closer{display:block;margin-left:auto}
  .lesson{padding:16px 14px 20px}
  .lesson h2{font-size:25px}
  .prog{flex-basis:70px}
  .pun.small .h,.pun.small .c{min-width:46px;min-height:50px;font-size:12px}
  .pun.small .c svg{width:26px;height:26px}
}
@media (min-width: 901px){.tocbtn{display:none}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

html[data-unit="space"]{
  --bg:#F1F3FA; --surface:#FFFFFF; --surface2:#E4E8F5; --ink:#1B2033; --muted:#566080; --line:#CBD2E6;

  --accent:#8C9BFF; --accent-ink:#0E1222; --dom:#F2A04A; --rec:#7FB6F2; --ok:#6CC070; --bad:#EF6A6A; --hl:#5B4C12; color-scheme:dark}}

  --accent:#8C9BFF; --accent-ink:#0E1222; --dom:#F2A04A; --rec:#7FB6F2; --ok:#6CC070; --bad:#EF6A6A; --hl:#5B4C12; color-scheme:dark}
/* 단원 전환 */
.unitsw{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;flex:0 0 auto}

@media (max-width: 900px){.top{flex-wrap:wrap;row-gap:8px} .unitsw{order:9;width:100%;justify-content:center} .unitsw a{flex:1;text-align:center;font-size:14px}}

<script>window.__UNITS={};</script>
<script>window.__UNITS.gen=function(){

(function(){
"use strict";
/* ================= 저장 ================= */
/* ===== 출처: 학교명·교사명은 여기 한 곳만 바꾸면 전체에 반영 ===== */
const SRC={school:"진해남중학교", teacher:"KJS", year:"2026"};
const SRC_SHORT=`${SRC.school} 과학 ${SRC.teacher}`;
const SRC_FULL=`ⓒ ${SRC.year} ${SRC.school} 과학 ${SRC.teacher} · ${SRC.school} 학생 학습용 자료입니다. 다른 학교·학원 등에서의 무단 사용, 복제, 수정, 재배포를 금지합니다.`;
const KEY="gen-study-v1";
let S={done:{},quiz:{},can:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ================= 작은 도우미 ================= */
const $=(s,r=document)=>r.querySelector(s);
const NS="http://www.w3.org/2000/svg";
function g(t){ // 유전자형 글자 색칠: 대문자=우성(주황), 소문자=열성(파랑)
  return '<span class="g">'+t.replace(/X′|X'|[A-Za-z]/g,ch=>{
    if(ch==="X′"||ch==="X'") return '<span class="rec">X′</span>';
    if(/[A-Z]/.test(ch)) return '<span class="dom">'+ch+'</span>';
    return '<span class="rec">'+ch+'</span>';})+'</span>';
}
function pea(shape,color,r){ // 완두 그림 SVG 문자열
  r=r||16; const fill=color==="y"?"var(--pea-y)":"var(--pea-g)";
  if(shape==="round") return `<svg viewBox="0 0 ${2*r+4} ${2*r+4}" width="${2*r+4}" height="${2*r+4}" aria-hidden="true"><circle cx="${r+2}" cy="${r+2}" r="${r}" fill="${fill}" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.5"/><circle cx="${r*0.7}" cy="${r*0.7}" r="${r*0.25}" fill="#fff" opacity=".45"/></svg>`;
  let d=""; const n=9;
  for(let i=0;i<=n;i++){const a=i/n*Math.PI*2, rr=r*(i%2?0.78:1), x=r+2+rr*Math.cos(a), y=r+2+rr*Math.sin(a); d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}
  return `<svg viewBox="0 0 ${2*r+4} ${2*r+4}" width="${2*r+4}" height="${2*r+4}" aria-hidden="true"><path d="${d}Z" fill="${fill}" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.5" stroke-linejoin="round"/><path d="M${r-2} ${r-4} q4 4 8 0 M${r-4} ${r+6} q5 -3 10 1" stroke="var(--ink)" stroke-opacity=".35" fill="none"/></svg>`;
}
function peaFromGeno(gt){ // R/r, Y/y 로 완두 모양·색 정하기
  const shape=/R/.test(gt)?"round":(/r/.test(gt)?"wrinkled":"round");
  const color=/Y/.test(gt)?"y":(/y/.test(gt)?"g":"y");
  return pea(shape,color,15);
}
function sortPair(a,b){ // 대문자 먼저
  if(a===b) return a+b;
  const up=x=>x===x.toUpperCase();
  if(up(a)&&!up(b)) return a+b; if(up(b)&&!up(a)) return b+a; return a<b?a+b:b+a;
}
function combineGenes(m,f){ // "RY" + "ry" → "RrYy"
  let out=""; for(let i=0;i<m.length;i++) out+=sortPair(m[i],f[i]); return out;
}
function el(html){const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild;}

/* ================= 결합 표(퍼넷) 애니메이터 ================= */
function punnett(box,o){
  // o: {left:[], top:[], leftName, topName, cell:(a,b)=>({t:html, sub:html, key}), summary:(cells)=>html, small}
  box.innerHTML="";
  const n=o.top.length, m=o.left.length;
  const grid=el(`<div class="pun ${o.small?"small":""}" style="grid-template-columns:repeat(${n+1},auto)"></div>`);
  grid.appendChild(el(`<div class="h corner" aria-hidden="true"></div>`));
  const heads=[];
  o.top.forEach(t=>{const h=el(`<div class="h htop">${o.fmt?o.fmt(t):g(t)}</div>`); heads.push(h); grid.appendChild(h);});
  const cells=[], lh=[];
  o.left.forEach((l,i)=>{const h=el(`<div class="h hleft">${o.fmt?o.fmt(l):g(l)}</div>`); lh.push(h); grid.appendChild(h);
    o.top.forEach((t,j)=>{const c=el(`<div class="c" aria-label="빈칸"></div>`); cells.push({c,i,j,l,t}); grid.appendChild(c);});});
  const wrap=el(`<div></div>`);
  const leg=el(`<div class="punleg"><div><span class="sw sw-top"></span><b>위쪽 가로줄</b> = ${o.topName||"아버지의 생식세포"}</div><div><span class="sw sw-left"></span><b>왼쪽 세로줄</b> = ${o.leftName||"어머니의 생식세포"}</div><div class="hint">가운데 칸 = 같은 가로줄의 왼쪽 글자 + 같은 세로줄의 위쪽 글자</div></div>`);
  wrap.appendChild(leg); wrap.appendChild(grid);
  const sum=el(`<div class="sumbox"></div>`); wrap.appendChild(sum);
  const ctrl=el(`<div class="ctrl"><button class="btn">▶ 결합해 보기</button><button class="btn ghost">한 번에 채우기</button><button class="btn ghost">지우기</button></div>`);
  wrap.appendChild(ctrl); box.appendChild(wrap);
  let timer=null;
  function clear(){clearTimeout(timer); cells.forEach(x=>{x.c.className="c"; x.c.innerHTML=""; x.res=null;}); sum.innerHTML=""; heads.concat(lh).forEach(h=>h.classList.remove("lit"));}
  function fill(x){const r=o.cell(x.l,x.t); x.res=r; x.c.className="c on"; x.c.innerHTML=(r.icon||"")+`<span>${r.t}</span>`+(r.sub?`<small>${r.sub}</small>`:"");}
  function done(){sum.innerHTML=o.summary?o.summary(cells.map(x=>x.res)):""; heads.concat(lh).forEach(h=>h.classList.remove("lit"));}
  function play(){clear(); let k=0; const step=()=>{ heads.concat(lh).forEach(h=>h.classList.remove("lit"));
      if(k>=cells.length){done();return;} const x=cells[k]; heads[x.j].classList.add("lit"); lh[x.i].classList.add("lit"); fill(x); k++; timer=setTimeout(step, cells.length>8?260:650);}; step();}
  const [b1,b2,b3]=ctrl.querySelectorAll("button");
  b1.onclick=play; b2.onclick=()=>{clear(); cells.forEach(fill); done();}; b3.onclick=clear;
}
function countBy(arr,f){const m=new Map(); arr.forEach(x=>{const k=f(x); m.set(k,(m.get(k)||0)+1);}); return m;}
function ratioLine(map,order){const keys=order||[...map.keys()]; return keys.filter(k=>map.has(k)).map(k=>`<span class="chip">${k} ${map.get(k)}칸</span>`).join(" ");}

add({id:"l1-2",part:"1. 유전의 기초",no:"1-2",title:"대립 형질: 완두의 7가지",html:`

init(box){const T=[["씨 모양",["둥글다",pea("round","y",18)],["주름지다",pea("wrinkled","y",18)]],["씨 색깔",["노란색",pea("round","y",18)],["초록색",pea("round","g",18)]],
 ["꽃잎 색깔",["보라색",flower("#8E5BC2")],["흰색",flower("#F4F4F4")]],["꼬투리 모양",["볼록하다",pod(false,"var(--pea-g)")],["잘록하다",pod(true,"var(--pea-g)")]],
 ["꼬투리 색깔",["초록색",pod(false,"var(--pea-g)")],["노란색",pod(false,"var(--pea-y)")]],["꽃이 피는 위치",["잎겨드랑이",stem("axil")],["줄기 끝",stem("tip")]],["줄기의 키",["크다",stem("tall")],["작다",stem("short")]]];

function stem(k){const h=k==="tall"?56:k==="short"?24:46; const y0=62-h;
 let s=`<svg viewBox="0 0 60 64" width="56" height="60" aria-hidden="true"><line x1="30" y1="62" x2="30" y2="${y0}" stroke="var(--pea-g)" stroke-width="4"/>`;
 [0.35,0.7].forEach((f,i)=>{const y=62-h*f; if(y>y0+4) s+=`<ellipse cx="${i?18:42}" cy="${y}" rx="10" ry="5" fill="var(--pea-g)"/>`;});

 if(k==="tip") s+=`<circle cx="30" cy="${y0-4}" r="7" fill="#8E5BC2"/>`;
 return s+"</svg>";}

 const draw=()=>{sv.innerHTML=`<g class="fade-in">${F[k]()}</g>`; tx.innerHTML=T[k]; $("#zn",box).textContent=k<F.length-1?"확대하기 ▶":"처음부터 ↺";};
 $("#zn",box).onclick=()=>{k=k<F.length-1?k+1:0; draw();}; $("#zp",box).onclick=()=>{k=Math.max(0,k-1); draw();}; draw();},
quiz:[{q:"형질을 결정하는 유전자가 들어 있는 곳은?",o:["세포막","염색체","세포 밖"],a:1,why:"유전자는 핵 속의 염색체에 들어 있어요."},
      {q:"상동 염색체에 대한 설명으로 옳은 것은?",o:["모양과 크기가 같은 염색체 쌍이다","모두 아빠에게서 받은 것이다","유전자가 들어 있지 않다"],a:0,why:"상동 염색체는 모양과 크기가 같은 염색체 쌍이고, 하나는 엄마, 하나는 아빠에게서 받아요."}]});

add({id:"l1-4",part:"1. 유전의 기초",no:"1-4",title:"대립유전자와 알파벳 약속",html:`
<p class="mt0">씨 모양을 정하는 유전자에는 '둥글게 만드는 것'과 '주름지게 만드는 것' 두 종류가 있어요. 이렇게 대립 형질을 정하는 서로 다른 유전자를 <b>대립유전자</b>라고 해요.</p>
<div class="book"><b class="lbl">교과서 말로는</b><b>대립유전자</b>: 한 형질에 대한 서로 다른 대립 형질을 결정하는 유전자로, 상동 염색체의 같은 위치에 있다.</div>
<div class="vis"><svg viewBox="0 0 520 170" role="img" aria-label="대립유전자 세 가지 쌍">
${[["R","R",80,"둥근 완두"],["R","r",260,"둥근 완두"],["r","r",440,"주름진 완두"]].map(([a,b,x,t])=>`<g><rect x="${x-34}" y="20" width="24" height="96" rx="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/><rect x="${x+10}" y="20" width="24" height="96" rx="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/><rect x="${x-34}" y="58" width="24" height="18" fill="var(--hl)" stroke="var(--ink)"/><rect x="${x+10}" y="58" width="24" height="18" fill="var(--hl)" stroke="var(--ink)"/><text x="${x-22}" y="72" text-anchor="middle" class="svgmono" font-size="14" fill="${a==="R"?"var(--dom)":"var(--rec)"}">${a}</text><text x="${x+22}" y="72" text-anchor="middle" class="svgmono" font-size="14" fill="${b==="R"?"var(--dom)":"var(--rec)"}">${b}</text><text x="${x}" y="142" text-anchor="middle" class="svgmono" font-size="18" fill="var(--ink)">${a}${b}</text><text x="${x}" y="162" text-anchor="middle" class="svgtxt" font-size="13">${t}</text></g>`).join("")}
</svg><div class="cap">유전자는 쌍으로 있으니 알파벳도 2개씩 써요. R와 r가 함께 있으면 둥근 씨가 돼요(이유는 2-3 레슨에서!).</div></div>
<div class="easy"><b class="lbl">알파벳 약속</b>
• 같은 형질은 <b>같은 알파벳</b>을 써요. 씨 모양은 R(r), 씨 색깔은 Y(y)처럼요.<br>
• <b>우성</b>(겉으로 잘 드러나는 쪽) 대립유전자는 <b>대문자</b> ${g("R")}, <b>열성</b> 대립유전자는 <b>소문자</b> ${g("r")}로 써요.<br>
• 우성·열성의 뜻은 2-3 레슨에서 자세히 배워요.</div>`,
quiz:[{q:"대립유전자는 상동 염색체의 어디에 있을까요?",o:["같은 위치","서로 다른 위치","염색체 밖"],a:0,why:"대립유전자는 상동 염색체의 같은 위치에 있어요."},
      {q:"우성 대립유전자를 나타내는 방법은?",o:["알파벳 대문자","알파벳 소문자","숫자"],a:0,why:"우성 대립유전자는 대문자, 열성 대립유전자는 소문자로 나타내요."}]});

add({id:"l1-5",part:"1. 유전의 기초",no:"1-5",title:"생식세포와 수정: 반씩 받아요",html:`
<p class="mt0">몸의 세포에는 대립유전자가 <b>2개(한 쌍)</b> 있어요. 그런데 자손을 만들 때 쓰는 <b>생식세포</b>(난세포, 정자, 꽃가루)에는 그중 <b>1개만</b> 들어가요. 그리고 엄마 쪽 1개와 아빠 쪽 1개가 만나(<b>수정</b>) 다시 2개가 돼요.</p>
<div class="vis"><svg id="gam" viewBox="0 0 540 250" role="img" aria-label="생식세포 형성과 수정"></svg>
<div class="stepbox" id="gamtxt"></div><div class="ctrl"><button class="btn" id="gamn">다음 ▶</button><button class="btn ghost" id="gamr">처음부터</button></div></div>
<div class="easy"><b class="lbl">왜 반만 넣을까?</b>만약 생식세포에 2개를 다 넣으면, 수정할 때마다 4개, 8개로 늘어나겠죠? 반씩 넣고 합치니까 자손도 늘 <b>2개(한 쌍)</b>를 가져요.</div>`,
init(box){const sv=$("#gam",box), tx=$("#gamtxt",box); let k=0;
 const cell=(x,y,r,a,b,lab)=>`<g class="fade-in"><circle cx="${x}" cy="${y}" r="${r}" fill="var(--surface2)" stroke="var(--ink)" stroke-width="1.8"/>${a?`<text x="${b?x-9:x}" y="${y+7}" text-anchor="middle" class="svgmono" font-size="20" fill="${a==="R"?"var(--dom)":"var(--rec)"}">${a}</text>`:""}${b?`<text x="${x+11}" y="${y+7}" text-anchor="middle" class="svgmono" font-size="20" fill="${b==="R"?"var(--dom)":"var(--rec)"}">${b}</text>`:""}<text x="${x}" y="${y+r+18}" text-anchor="middle" class="svgtxt" font-size="13">${lab}</text></g>`;
 const ar=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--accent)" stroke-width="2" marker-end="url(#ah)" class="fade-in"/>`;
 const defs=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>`;
 const F=[()=>cell(110,60,36,"R","R","엄마 쪽 몸세포 (RR)")+cell(430,60,36,"r","r","아빠 쪽 몸세포 (rr)"),
  ()=>F[0]()+ar(110,116,110,150)+ar(430,116,430,150)+cell(110,180,22,"R","","난세포 (R)")+cell(430,180,22,"r","","꽃가루 (r)"),
  ()=>F[1]()+ar(136,182,232,192)+ar(404,182,308,192)+cell(270,196,30,"R","r","수정란 (Rr)")];
 const T=["① 엄마 쪽 몸세포는 R를 2개, 아빠 쪽 몸세포는 r를 2개 가지고 있어요.","② 생식세포를 만들 때 한 쌍이 <b>나뉘어</b> 1개씩만 들어가요. 그래서 난세포에는 R 하나, 꽃가루에는 r 하나가 있어요.","③ 난세포와 꽃가루가 만나 <b>수정</b>되면 다시 2개(Rr)가 돼요. 자손은 엄마와 아빠에게서 대립유전자를 <b>하나씩</b> 받아요."];
 const draw=()=>{sv.innerHTML=defs+F[k](); tx.innerHTML=T[k]; $("#gamn",box).disabled=k===2; $("#gamn",box).style.opacity=k===2?.5:1;};
 $("#gamn",box).onclick=()=>{if(k<2){k++; draw();}}; $("#gamr",box).onclick=()=>{k=0; draw();}; draw();},
quiz:[{q:"몸세포의 대립유전자가 Rr일 때, 생식세포에 들어가는 대립유전자는?",o:["R와 r 둘 다","R 또는 r 중 하나","아무것도 없다"],a:1,why:"생식세포에는 한 쌍 중 하나만 들어가요. 그래서 R를 가진 생식세포 또는 r를 가진 생식세포가 만들어져요."},
      {q:"자손은 대립유전자를 어떻게 받을까요?",o:["엄마에게서만 2개","아빠에게서만 2개","엄마와 아빠에게서 하나씩"],a:2,why:"엄마의 생식세포 1개, 아빠의 생식세포 1개가 수정되므로 하나씩 받아요."}]});

/* ---------- 2. 멘델의 실험 ---------- */
add({id:"l2-1",part:"2. 멘델의 실험",no:"2-1",title:"자가 수분과 타가 수분",html:`
<p class="mt0">식물은 꽃가루가 암술머리에 붙어야(<b>수분</b>) 씨를 만들 수 있어요. 꽃가루가 <b>어디에서</b> 왔는지에 따라 두 가지로 나눠요.</p>
<div class="vis"><svg id="pol" viewBox="0 0 540 230" role="img" aria-label="자가 수분과 타가 수분 애니메이션"></svg>
<div class="stepbox" id="poltxt">버튼을 눌러 꽃가루(노란 점)가 어디로 가는지 보세요.</div>
<div class="ctrl"><button class="btn" id="self">자가 수분 보기</button><button class="btn" id="cross">타가 수분 보기</button></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>
<b>자가 수분</b>: 수술의 꽃가루가 <b>같은 그루</b>의 꽃에 있는 암술머리에 붙는 현상<br>
<b>타가 수분</b>: 수술의 꽃가루가 <b>다른 그루</b>의 꽃에 있는 암술머리에 붙는 현상</div>
<div class="easy"><b class="lbl">멘델의 꾀</b>멘델은 원하는 두 완두를 교배하려고, 한 꽃의 <b>수술을 미리 잘라</b> 자가 수분을 막고, 다른 그루의 꽃가루를 붓으로 묻혔어요(타가 수분).</div>`,
init(box){const sv=$("#pol",box);
 const plant=(x,lab)=>`<g><line x1="${x}" y1="220" x2="${x}" y2="110" stroke="var(--pea-g)" stroke-width="5"/><ellipse cx="${x-22}" cy="170" rx="18" ry="8" fill="var(--pea-g)"/><ellipse cx="${x+22}" cy="150" rx="18" ry="8" fill="var(--pea-g)"/>
  <path d="M${x-40} 100 Q${x} 150 ${x+40} 100 Z" fill="#B48AD9" stroke="var(--ink)" stroke-opacity=".5"/><line x1="${x}" y1="108" x2="${x}" y2="60" stroke="var(--accent)" stroke-width="4"/><circle cx="${x}" cy="56" r="7" fill="var(--accent)"/>
  <line x1="${x-18}" y1="108" x2="${x-26}" y2="70" stroke="var(--ink)" stroke-width="2"/><ellipse cx="${x-27}" cy="66" rx="6" ry="4" fill="var(--pea-y)" stroke="var(--ink)"/><line x1="${x+18}" y1="108" x2="${x+26}" y2="70" stroke="var(--ink)" stroke-width="2"/><ellipse cx="${x+27}" cy="66" rx="6" ry="4" fill="var(--pea-y)" stroke="var(--ink)"/>
  <text x="${x}" y="30" text-anchor="middle" class="svgtxt" font-size="14">${lab}</text></g>`;
 sv.innerHTML=plant(140,"그루 A")+plant(400,"그루 B")+`<text x="140" y="46" text-anchor="middle" class="svgtxt" font-size="11">암술머리</text><text x="80" y="84" class="svgtxt" font-size="11">수술</text><circle id="pdot" r="5" fill="#F2C230" stroke="var(--ink)" cx="0" cy="0" opacity="0"/>`;
 const dot=$("#pdot",sv);
 function go(from,to,msg){dot.setAttribute("opacity","1"); const mid=[(from[0]+to[0])/2,Math.min(from[1],to[1])-60];
  const kf=[]; for(let i=0;i<=20;i++){const t=i/20; const x=(1-t)*(1-t)*from[0]+2*(1-t)*t*mid[0]+t*t*to[0]; const y=(1-t)*(1-t)*from[1]+2*(1-t)*t*mid[1]+t*t*to[1]; kf.push({transform:`translate(${x}px,${y}px)`});}
  dot.animate(kf,{duration:1600,easing:"ease-in-out",fill:"forwards"}); $("#poltxt",box).innerHTML=msg;}
 $("#self",box).onclick=()=>go([113,66],[140,56],"<b>자가 수분</b>: 그루 A의 꽃가루가 <b>같은 그루 A</b>의 암술머리에 붙었어요.");
 $("#cross",box).onclick=()=>go([427,66],[140,56],"<b>타가 수분</b>: 그루 B의 꽃가루가 <b>다른 그루 A</b>의 암술머리에 붙었어요.");},
quiz:[{q:"꽃가루가 다른 그루의 꽃에 있는 암술머리에 붙는 것은?",o:["자가 수분","타가 수분"],a:1,why:"'다른(他) 그루'이므로 타가 수분이에요. '자기(自) 그루'면 자가 수분이에요."},
      {q:"멘델이 교배 실험에서 한 꽃의 수술을 미리 자른 까닭은?",o:["자가 수분을 막기 위해","꽃을 크게 키우기 위해","타가 수분을 막기 위해"],a:0,why:"수술을 자르면 자기 꽃가루가 암술머리에 붙지 않아요. 그래서 원하는 꽃가루로만 타가 수분할 수 있어요."}]});

add({id:"l2-2",part:"2. 멘델의 실험",no:"2-2",title:"순종과 잡종",html:`
<p class="mt0">둥근 완두를 계속 자가 수분했을 때 몇 세대가 지나도 <b>둥근 완두만</b> 나오면 그 완두는 <b>순종</b>이에요.</p>
<div class="vis"><svg id="pure" viewBox="0 0 540 200" role="img" aria-label="순종 자가 수분 세대 애니메이션"></svg>
<div class="ctrl"><button class="btn" id="purego">세대를 이어 보기</button></div><div class="cap">순종 RR는 자가 수분해도 계속 RR, 둥근 완두만 나와요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>
<b>순종</b>: 여러 세대를 자가 수분하여도 계속 같은 형질의 자손만 나오는 개체<br>
<b>잡종</b>: 대립 형질이 다른 두 순종 개체를 타가 수분하여 얻은 자손</div>
<div class="easy"><b class="lbl">유전자형으로 구별하기</b>
• 같은 대립유전자 2개: ${g("RR")}, ${g("rr")} → <b>순종</b><br>
• 서로 다른 대립유전자 2개: ${g("Rr")} → <b>잡종</b></div>`,
init(box){const sv=$("#pure",box);
 const draw=(n)=>{let s=""; for(let i=0;i<n;i++){const x=60+i*140; s+=`<g class="fade-in" style="animation-delay:${i*0.25}s"><foreignObject x="${x-22}" y="50" width="44" height="44"><div xmlns="http://www.w3.org/1999/xhtml">${pea("round","y",18)}</div></foreignObject><text x="${x}" y="118" text-anchor="middle" class="svgmono" font-size="16" fill="var(--dom)">RR</text><text x="${x}" y="140" text-anchor="middle" class="svgtxt" font-size="13">${i+1}세대</text>${i<n-1?`<text x="${x+70}" y="78" text-anchor="middle" class="svgtxt" font-size="12">자가 수분 →</text>`:""}</g>`;} sv.innerHTML=s;};
 draw(1); $("#purego",box).onclick=()=>{let n=1; draw(1); const t=setInterval(()=>{n++; draw(n); if(n>=4) clearInterval(t);},700);};},
quiz:[{q:"다음 중 순종인 것을 모두 고르면?",o:["RR와 rr","Rr만","RR만"],a:0,why:"같은 대립유전자로만 이루어진 RR와 rr가 순종이에요. Rr는 잡종이에요."},
      {q:"순종인 둥근 완두와 순종인 주름진 완두를 타가 수분하여 얻은 자손은?",o:["순종","잡종"],a:1,why:"대립 형질이 다른 두 순종 개체를 타가 수분하여 얻은 자손은 잡종이에요."}]});

add({id:"l2-3",part:"2. 멘델의 실험",no:"2-3",title:"잡종 1대와 우성·열성",html:`
<p class="mt0">멘델은 순종의 둥근 완두(${g("RR")})와 순종의 주름진 완두(${g("rr")})를 교배했어요. 자손(<b>잡종 1대</b>)은 어떻게 나왔을까요?</p>
<div class="vis" id="f1box"></div>
<div class="book"><b class="lbl">교과서 말로는</b>
대립 형질이 다른 두 순종 개체를 교배하여 얻은 잡종 1대에서 <b>표현되는 형질을 우성</b>, <b>표현되지 않는 형질을 열성</b>이라고 한다(<b>우열의 원리</b>).</div>
<div class="easy"><b class="lbl">쉽게 말하면</b>R와 r가 함께 있으면 R의 특징(둥근 모양)만 겉으로 보여요. 이긴 쪽이 <b>우성</b>(둥근 모양), 숨은 쪽이 <b>열성</b>(주름진 모양)이에요. 숨은 r는 사라진 게 아니라 <b>숨어 있을 뿐</b>이에요.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>우성은 '더 좋은 것'이나 '더 많은 것'이 아니에요. 잡종 1대에서 겉으로 나타나는 형질일 뿐이에요.</div>`,
init(box){punnett($("#f1box",box),{left:["R","R"],top:["r","r"],leftName:"둥근 RR의 생식세포",topName:"주름진 rr의 생식세포",cell:PEA_CELL,
 summary:c=>`네 칸 모두 ${g("Rr")}, 모두 <b>둥근 완두</b>예요. 주름진 대립유전자 r가 있는데도 둥글게 보이니 <b>둥근 모양이 우성</b>이에요.`});},
quiz:[{q:"순종 둥근 완두(RR) × 순종 주름진 완두(rr)의 잡종 1대는?",o:["모두 둥근 완두","모두 주름진 완두","반은 둥글고 반은 주름짐"],a:0,why:"잡종 1대는 모두 Rr이고, R가 우성이라 모두 둥근 완두예요."},
      {q:"'우성 형질은 열성 형질보다 생존에 유리하다.' 맞을까요?",o:["맞다","틀리다"],a:1,why:"우성은 잡종 1대에서 겉으로 나타나는 형질이라는 뜻일 뿐, 유리하다는 뜻이 아니에요."}]});

add({id:"l2-4",part:"2. 멘델의 실험",no:"2-4",title:"표현형과 유전자형",html:`
<p class="mt0">눈으로 볼 수 있는 모습과, 그 속에 숨어 있는 유전자를 구별해서 불러요.</p>
<div class="book"><b class="lbl">교과서 말로는</b>
<b>표현형</b>: 둥근 것, 주름진 것과 같이 겉으로 드러나는 형질<br>
<b>유전자형</b>: 표현형을 결정하는 대립유전자 구성을 RR, rr와 같이 알파벳 기호로 나타낸 것</div>
<div class="vis"><div id="gtpick" class="ctrl"></div><div id="gtshow" style="margin-top:12px;min-height:130px"></div>
<div class="cap">유전자형을 골라 보세요. 표현형(모습)이 어떻게 되는지 바로 보여 줘요.</div></div>
<div class="easy"><b class="lbl">꼭 기억할 것</b>${g("RR")}와 ${g("Rr")}는 유전자형은 다르지만 표현형은 <b>똑같이 둥근 완두</b>예요. 그래서 둥근 완두만 보고는 순종인지 잡종인지 알 수 없어요.</div>
<div class="tablewrap"><table class="t"><tr><th>형질</th><th>표현형</th><th>유전자형</th></tr>
<tr><td rowspan="2">씨 모양</td><td>둥글다</td><td>${g("RR")}(순종), ${g("Rr")}(잡종)</td></tr><tr><td>주름지다</td><td>${g("rr")}(순종)</td></tr>
<tr><td rowspan="2">씨 색깔</td><td>노란색</td><td>${g("YY")}(순종), ${g("Yy")}(잡종)</td></tr><tr><td>초록색</td><td>${g("yy")}(순종)</td></tr></table></div>`,
init(box){const pk=$("#gtpick",box), sh=$("#gtshow",box);
 ["RR","Rr","rr","YY","Yy","yy"].forEach(gt=>{const b=el(`<button class="btn ghost">${g(gt)}</button>`); b.onclick=()=>{
  const isR=/r/i.test(gt); const ph=isR?(/R/.test(gt)?"둥근 완두":"주름진 완두"):(/Y/.test(gt)?"노란색 완두":"초록색 완두");
  const icon=isR?pea(/R/.test(gt)?"round":"wrinkled","y",30):pea("round",/Y/.test(gt)?"y":"g",30);
  const kind=gt[0]===gt[1]?"순종":"잡종";
  sh.innerHTML=`<div class="fade-in"><div>${icon}</div><div style="font-size:18px">유전자형 ${g(gt)} → 표현형 <b>${ph}</b> <span class="chip">${kind}</span></div></div>`;}; pk.appendChild(b);});
 pk.firstChild.click();},
quiz:[{q:"표현형이 둥근 완두일 수 있는 유전자형을 모두 고르면?",o:["RR와 Rr","RR만","rr"],a:0,why:"R가 하나라도 있으면 둥근 완두예요. 그래서 RR와 Rr 모두 둥근 완두예요."},
      {q:"주름진 완두의 유전자형은?",o:["Rr","rr","RR"],a:1,why:"열성 형질(주름진 모양)은 열성 대립유전자만 2개 있을 때 나타나요."}]});

/* ---------- 3. 분리의 법칙 ---------- */
add({id:"l3-1",part:"3. 분리의 법칙",no:"3-1",title:"잡종 1대를 자가 수분하면?",html:`
<p class="mt0">잡종 1대 둥근 완두(${g("Rr")})를 자가 수분하면 자손(<b>잡종 2대</b>)에 둥근 완두만 나올까요? 놀랍게도 <b>주름진 완두가 다시</b> 나타났어요!</p>
<div class="vis"><svg viewBox="0 0 540 180" role="img" aria-label="멘델 실험 결과">
<text x="270" y="22" text-anchor="middle" class="svgtxt" font-size="14">멘델의 실험 결과 (씨 모양)</text>
<g transform="translate(80,40)"><foreignObject width="50" height="50"><div xmlns="http://www.w3.org/1999/xhtml">${pea("round","y",20)}</div></foreignObject><text x="24" y="70" text-anchor="middle" class="svgtxt" font-size="13">잡종 1대 Rr</text></g>
<text x="200" y="70" class="svgtxt" font-size="13">자가 수분 →</text>
<g transform="translate(300,40)"><foreignObject width="50" height="50"><div xmlns="http://www.w3.org/1999/xhtml">${pea("round","y",20)}</div></foreignObject><text x="24" y="70" text-anchor="middle" class="svgtxt" font-size="13">둥근 5474개</text></g>
<g transform="translate(420,40)"><foreignObject width="50" height="50"><div xmlns="http://www.w3.org/1999/xhtml">${pea("wrinkled","y",20)}</div></foreignObject><text x="24" y="70" text-anchor="middle" class="svgtxt" font-size="13">주름진 1850개</text></g>
<text x="370" y="150" text-anchor="middle" class="svgtxt" font-size="15">둥근 : 주름진 ≒ <tspan class="svgmono" fill="var(--accent)">3 : 1</tspan></text>
</svg><div class="cap">숫자는 멘델이 실제로 얻은 결과로 널리 알려진 값이에요. 약 3 : 1이에요.</div></div>
<div class="easy"><b class="lbl">왜 주름진 완두가 다시 나왔을까?</b>잡종 1대(Rr) 속에 숨어 있던 <b>r</b>가 사라지지 않았기 때문이에요. 다음 레슨에서 r가 어떻게 다시 나타나는지 직접 보세요.</div>`,
quiz:[{q:"잡종 1대(Rr)를 자가 수분한 잡종 2대에서 둥근 완두와 주름진 완두의 비는?",o:["1 : 1","약 3 : 1","모두 둥근 완두"],a:1,why:"멘델의 실험 결과 잡종 2대에서 둥근 : 주름진 ≒ 3 : 1로 나타났어요."}]});

add({id:"l3-2",part:"3. 분리의 법칙",no:"3-2",title:"분리의 법칙: 쌍이 나뉘어요",html:`
<p class="mt0">잡종(${g("Rr")})이 생식세포를 만들 때 R와 r가 <b>나뉘어</b> 서로 다른 생식세포로 하나씩 들어가요. 버튼을 눌러 보세요.</p>
<div class="vis"><svg id="sep" viewBox="0 0 520 220" role="img" aria-label="대립유전자 분리 애니메이션"></svg>
<div class="ctrl"><button class="btn" id="sepgo">생식세포 만들기</button><button class="btn ghost" id="seprs">되돌리기</button></div>
<div class="stepbox" id="septxt">R와 r가 한 세포 안에 쌍으로 있어요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b><b>분리의 법칙</b>: 생식세포가 만들어질 때 쌍으로 존재하던 대립유전자가 분리되어 서로 다른 생식세포로 하나씩 나뉘어 들어가는 현상</div>
<div class="easy"><b class="lbl">결과</b>Rr는 <b>R를 가진 생식세포</b>와 <b>r를 가진 생식세포</b>를 <b>1 : 1</b>로 만들어요.</div>`,
init(box){const sv=$("#sep",box);
 sv.innerHTML=`<circle id="mom" cx="260" cy="80" r="56" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2"/>
 <g id="cR" style="transition:transform 1s ease-in-out"><rect x="232" y="46" width="22" height="68" rx="11" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/><text x="243" y="87" text-anchor="middle" class="svgmono" font-size="16" fill="var(--dom)">R</text></g>
 <g id="cr" style="transition:transform 1s ease-in-out"><rect x="266" y="46" width="22" height="68" rx="11" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/><text x="277" y="87" text-anchor="middle" class="svgmono" font-size="16" fill="var(--rec)">r</text></g>
 <g id="gcells" opacity="0" style="transition:opacity .6s .8s"><circle cx="120" cy="170" r="34" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="400" cy="170" r="34" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="120" y="216" text-anchor="middle" class="svgtxt" font-size="13">생식세포</text><text x="400" y="216" text-anchor="middle" class="svgtxt" font-size="13">생식세포</text></g>
 <text x="260" y="16" text-anchor="middle" class="svgtxt" font-size="13">잡종 Rr의 세포</text>`;
 const R=$("#cR",sv), r=$("#cr",sv), gc=$("#gcells",sv);
 $("#sepgo",box).onclick=()=>{R.style.transform="translate(-123px,90px)"; r.style.transform="translate(123px,90px)"; gc.setAttribute("opacity","1"); $("#septxt",box).innerHTML="R와 r가 <b>분리</b>되어 서로 다른 생식세포로 하나씩 들어갔어요. R : r = <b>1 : 1</b>";};
 $("#seprs",box).onclick=()=>{R.style.transform=""; r.style.transform=""; gc.setAttribute("opacity","0"); $("#septxt",box).innerHTML="R와 r가 한 세포 안에 쌍으로 있어요.";};},
quiz:[{q:"잡종(Rr)이 만드는 생식세포의 비율은?",o:["R : r = 1 : 1","R : r = 3 : 1","R만 만든다"],a:0,why:"분리의 법칙에 따라 R와 r가 나뉘어 R를 가진 것과 r를 가진 것이 1 : 1로 만들어져요."},
      {q:"분리의 법칙에서 '분리'되는 것은?",o:["쌍으로 존재하던 대립유전자","서로 다른 형질","세포막"],a:0,why:"쌍으로 있던 대립유전자(R와 r)가 분리되어 서로 다른 생식세포로 들어가요."}]});

add({id:"l3-3",part:"3. 분리의 법칙",no:"3-3",title:"결합 표로 잡종 2대 만들기",html:`
<p class="mt0">잡종 1대(${g("Rr")})끼리 자가 수분하면 생식세포 R, r가 서로 만날 수 있는 경우는 <b>4가지</b>예요. 표로 정리해 볼까요?</p>
<div class="vis" id="f2box"></div>
<div class="easy"><b class="lbl">결과 정리</b>
• 유전자형: ${g("RR")} : ${g("Rr")} : ${g("rr")} = <b>1 : 2 : 1</b><br>
• 표현형: 둥근 완두(${g("RR")}, ${g("Rr")}) : 주름진 완두(${g("rr")}) = <b>3 : 1</b></div>
<div class="easy"><b class="lbl">결합 표 그리는 순서</b>① 맨 윗줄에 아빠 쪽 생식세포, 왼쪽 줄에 엄마 쪽 생식세포를 써요. ② 각 칸에 가로·세로 글자를 하나씩 모아 써요. ③ 대문자를 앞에 써요(rR가 아니라 Rr).</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>답을 '1 : 2 : 1'처럼 숫자만 쓰면 안 돼요. 꼭 <b>${g("RR")} : ${g("Rr")} : ${g("rr")} = 1 : 2 : 1</b>처럼 유전자형과 비를 함께 쓰세요.</div>`,
init(box){punnett($("#f2box",box),{left:["R","r"],top:["R","r"],leftName:"Rr의 난세포",topName:"Rr의 꽃가루",cell:PEA_CELL,
 summary:c=>{const m=countBy(c,x=>x.key), p=countBy(c,x=>x.ph); return `유전자형: ${ratioLine(new Map([...m].map(([k,v])=>[g(k),v])))}<br>표현형: ${ratioLine(p)}<br>→ ${g("RR")} : ${g("Rr")} : ${g("rr")} = <b>1 : 2 : 1</b>, 둥근 : 주름진 = <b>3 : 1</b>`;}});},
quiz:[{q:"Rr를 자가 수분한 자손의 유전자형 비는?",o:["RR : Rr : rr = 1 : 2 : 1","RR : rr = 1 : 1","Rr만 나온다"],a:0,why:"결합 표 4칸이 RR 1칸, Rr 2칸, rr 1칸이에요."},
      {q:"Rr를 자가 수분한 자손 중 둥근 완두에서 순종(RR)의 비율은?",o:["1/3","1/4","1/2"],a:0,why:"둥근 완두는 RR 1칸 + Rr 2칸 = 3칸이고, 그중 순종 RR는 1칸이니 1/3이에요. 전체 중 RR는 1/4인 것과 헷갈리지 마세요!"}]});

add({id:"l3-4",part:"3. 분리의 법칙",no:"3-4",title:"동전으로 확률 실험하기",html:`
<p class="mt0">생식세포가 R를 받을지 r를 받을지는 <b>동전 던지기</b>와 같아요. 앞면 = R, 뒷면 = r. 동전 2개를 던져 짝을 지으면 자손의 유전자형이 돼요.</p>
<div class="vis"><div class="coins"><div class="coin" id="c1">?</div><div class="coin" id="c2">?</div></div>
<div id="cres" style="min-height:28px;font-size:18px"></div>
<div class="ctrl"><button class="btn" id="t1">1번 던지기</button><button class="btn ghost" id="t10">10번</button><button class="btn ghost" id="t100">100번</button><button class="btn ghost" id="t1000">1000번</button><button class="btn ghost" id="t0">초기화</button></div>
<div class="bars" id="cbars"></div></div>
<div class="easy"><b class="lbl">알게 된 것</b>몇 번만 던지면 비율이 들쭉날쭉해요. 하지만 <b>많이 던질수록</b> RR : Rr : rr가 <b>1 : 2 : 1</b>에 가까워져요. 3 : 1이나 1 : 2 : 1은 자손이 <b>많을 때</b> 나타나는 비율이에요.</div>
<div class="book"><b class="lbl">확률 계산</b>R가 나올 확률 1/2, r가 나올 확률 1/2<br>RR = 1/2 × 1/2 = <b>1/4</b>, rr = <b>1/4</b>, Rr = 1/4 + 1/4 = <b>1/2</b> (R·r 와 r·R 두 경우)</div>`,
init(box){let cnt={RR:0,Rr:0,rr:0}; const bars=$("#cbars",box);
 const draw=()=>{const tot=cnt.RR+cnt.Rr+cnt.rr||1; bars.innerHTML=["RR","Rr","rr"].map(k=>`<div class="bar"><span class="lab">${g(k)}</span><span class="tr"><i style="width:${(cnt[k]/tot*100).toFixed(1)}%"></i></span><span class="num">${cnt[k]}번 (${(cnt[k]/tot*100).toFixed(0)}%)</span></div>`).join("")+`<div style="font-size:13px;color:var(--muted);text-align:center">이론값: RR 25% · Rr 50% · rr 25%</div>`;};
 const once=()=>{const a=Math.random()<.5?"R":"r", b=Math.random()<.5?"R":"r"; const k=sortPair(a,b); cnt[k]++; return [a,b,k];};
 const show=([a,b,k])=>{const c1=$("#c1",box), c2=$("#c2",box); [c1,c2].forEach(c=>{c.classList.remove("flip"); void c.offsetWidth; c.classList.add("flip");});
  setTimeout(()=>{c1.innerHTML=g(a); c2.innerHTML=g(b); $("#cres",box).innerHTML=`→ 자손 ${g(k)}`;},300);};
 $("#t1",box).onclick=()=>{show(once()); setTimeout(draw,350);};
 [["#t10",10],["#t100",100],["#t1000",1000]].forEach(([id,n])=>$(id,box).onclick=()=>{let last; for(let i=0;i<n;i++) last=once(); show(last); setTimeout(draw,350);});
 $("#t0",box).onclick=()=>{cnt={RR:0,Rr:0,rr:0}; $("#c1",box).textContent="?"; $("#c2",box).textContent="?"; $("#cres",box).innerHTML=""; draw();}; draw();},
quiz:[{q:"Rr를 자가 수분할 때 자손이 rr일 확률은?",o:["1/2","1/4","3/4"],a:1,why:"r가 올 확률 1/2 × r가 올 확률 1/2 = 1/4이에요."},
      {q:"Rr를 자가 수분해서 자손을 4개만 얻었어요. 반드시 둥근 3개, 주름진 1개가 나올까요?",o:["반드시 그렇다","아니다, 자손이 많을 때 3 : 1에 가까워진다"],a:1,why:"3 : 1은 확률이에요. 자손이 적으면 달라질 수 있고, 많을수록 3 : 1에 가까워져요."}]});

add({id:"l3-5",part:"3. 분리의 법칙",no:"3-5",title:"개수 구하기 (시험 단골!)",html:`
<p class="mt0">"잡종 2대 400개 중 주름진 완두는 몇 개일까?" 같은 문제는 <b>3단계</b>로 풀어요.</p>
<div class="vis" style="text-align:left"><div id="calc"></div></div>
<div class="easy"><b class="lbl">3단계 풀이법</b>
<b>1단계</b> 부모의 유전자형을 쓴다 (예: Rr × Rr)<br>
<b>2단계</b> 결합 표로 자손의 비를 구한다 (RR : Rr : rr = 1 : 2 : 1)<br>
<b>3단계</b> 전체 개수 × 비율 (예: 400 × 1/4 = 100)</div>
<div class="tablewrap"><table class="t"><tr><th>무엇을 구할까?</th><th>Rr × Rr에서의 비율</th></tr>
<tr><td>둥근 완두 (RR + Rr)</td><td>3/4</td></tr><tr><td>주름진 완두 (rr)</td><td>1/4</td></tr><tr><td>순종 (RR + rr)</td><td>2/4 = 1/2</td></tr><tr><td>잡종 (Rr)</td><td>2/4 = 1/2</td></tr><tr><td>RR만</td><td>1/4</td></tr></table></div>
<div class="tablewrap"><table class="t"><tr><th>다른 교배</th><th>자손</th></tr>
<tr><td>Rr × rr (검정 교배)</td><td>Rr : rr = 1 : 1 → 둥근 : 주름진 = 1 : 1</td></tr>
<tr><td>RR × rr</td><td>모두 Rr (둥근 완두)</td></tr><tr><td>RR × Rr</td><td>RR : Rr = 1 : 1 → 모두 둥근 완두</td></tr></table></div>`,
init(box){const c=$("#calc",box);
 c.innerHTML=`<b>직접 계산해 보기</b><div style="margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
 <label>교배: <select id="cx"><option value="Rr*Rr">Rr × Rr</option><option value="Rr*rr">Rr × rr</option><option value="RR*rr">RR × rr</option></select></label>
 <label>전체: <input id="cn" type="number" value="400" min="4" step="4" style="width:90px"></label>
 <label>구할 것: <select id="cw"><option value="round">둥근 완두</option><option value="wr">주름진 완두</option><option value="pure">순종</option><option value="RR">RR</option><option value="Rr">Rr</option></select></label>
 <button class="btn" id="cgo">계산</button></div><div id="cout" class="stepbox"></div>`;
 $("#cgo",box).onclick=()=>{const [a,b]=$("#cx",box).value.split("*"); const n=+$("#cn",box).value||0; const w=$("#cw",box).value;
  const kids=[]; for(const x of a) for(const y of b) kids.push(sortPair(x,y));
  const ok=k=>w==="round"?/R/.test(k):w==="wr"?k==="rr":w==="pure"?k[0]===k[1]:k===w;
  const hit=kids.filter(ok).length; const map=countBy(kids,k=>k);
  $("#cout",box).innerHTML=`1단계: ${g(a)} × ${g(b)}<br>2단계: 결합 표 4칸 → ${[...map].map(([k,v])=>g(k)+" "+v+"칸").join(", ")}<br>3단계: 구하는 것은 4칸 중 ${hit}칸 → ${n} × ${hit}/4 = <b>${n*hit/4}개</b>`;};
 $("#cgo",box).click();},
quiz:[{q:"Rr를 자가 수분해 자손 800개를 얻었어요. 이론적으로 둥근 완두는 몇 개?",o:["200개","400개","600개"],a:2,why:"둥근 완두는 3/4이므로 800 × 3/4 = 600개예요."},
      {q:"Rr × rr로 자손 300개를 얻었어요. 주름진 완두는 몇 개?",o:["75개","150개","225개"],a:1,why:"Rr × rr는 Rr : rr = 1 : 1이므로 300 × 1/2 = 150개예요."}]});

/* ---------- 4. 독립의 법칙 ---------- */
add({id:"l4-1",part:"4. 독립의 법칙",no:"4-1",title:"두 가지 형질을 한꺼번에",html:`
<p class="mt0">이번에는 <b>씨 모양</b>과 <b>씨 색깔</b>을 한꺼번에 봐요. 멘델은 순종의 둥글고 노란색인 완두(${g("RRYY")})와 순종의 주름지고 초록색인 완두(${g("rryy")})를 교배했어요.</p>
<div class="vis"><svg viewBox="0 0 540 250" role="img" aria-label="두 쌍의 대립 형질 교배 과정">
<g class="fade-in"><foreignObject x="70" y="10" width="44" height="44"><div xmlns="http://www.w3.org/1999/xhtml">${pea("round","y",18)}</div></foreignObject><text x="92" y="70" text-anchor="middle" class="svgmono" font-size="14" fill="var(--ink)">RRYY</text>
<foreignObject x="420" y="10" width="44" height="44"><div xmlns="http://www.w3.org/1999/xhtml">${pea("wrinkled","g",18)}</div></foreignObject><text x="442" y="70" text-anchor="middle" class="svgmono" font-size="14" fill="var(--ink)">rryy</text></g>
<g class="fade-in" style="animation-delay:.5s"><text x="92" y="100" text-anchor="middle" class="svgtxt" font-size="12">생식세포</text><text x="92" y="118" text-anchor="middle" class="svgmono" font-size="15" fill="var(--dom)">RY</text><text x="442" y="100" text-anchor="middle" class="svgtxt" font-size="12">생식세포</text><text x="442" y="118" text-anchor="middle" class="svgmono" font-size="15" fill="var(--rec)">ry</text></g>
<g class="fade-in" style="animation-delay:1s"><line x1="110" y1="126" x2="250" y2="160" stroke="var(--accent)" stroke-width="2"/><line x1="424" y1="126" x2="290" y2="160" stroke="var(--accent)" stroke-width="2"/><foreignObject x="248" y="156" width="44" height="44"><div xmlns="http://www.w3.org/1999/xhtml">${pea("round","y",18)}</div></foreignObject><text x="270" y="216" text-anchor="middle" class="svgmono" font-size="15" fill="var(--ink)">RrYy</text><text x="270" y="238" text-anchor="middle" class="svgtxt" font-size="13">잡종 1대: 모두 둥글고 노란색</text></g>
</svg><div class="cap">잡종 1대는 R와 Y가 우성이라 모두 둥글고 노란색이에요.</div></div>
<div class="easy"><b class="lbl">알파벳 읽는 법</b>${g("RrYy")}는 '씨 모양 쌍 ${g("Rr")}' + '씨 색깔 쌍 ${g("Yy")}'예요. 두 쌍을 따로따로 보면 쉬워요.</div>`,
quiz:[{q:"순종 RRYY와 rryy를 교배한 잡종 1대의 유전자형은?",o:["RRYY","RrYy","rryy"],a:1,why:"RRYY는 RY, rryy는 ry 생식세포만 만들어서 자손은 모두 RrYy예요."}]});

add({id:"l4-2",part:"4. 독립의 법칙",no:"4-2",title:"RrYy의 생식세포는 4가지",html:`
<p class="mt0">${g("RrYy")}가 생식세포를 만들 때 씨 모양 쌍(R, r)과 씨 색깔 쌍(Y, y)은 <b>서로 상관없이</b> 따로 나뉘어요. 그래서 조합이 4가지가 돼요.</p>
<div class="vis"><svg id="tree" viewBox="0 0 520 252" role="img" aria-label="생식세포 4가지 가지 그림"></svg>
<div class="ctrl"><button class="btn" id="treego">가지 그리기</button></div></div>
<div class="book"><b class="lbl">교과서 말로는</b><b>독립의 법칙</b>: 두 가지 이상의 형질이 함께 유전될 때, 한 형질을 나타내는 대립유전자 쌍은 다른 형질을 나타내는 대립유전자 쌍에 의해 영향을 받지 않고 독립적으로 분리되어 유전된다.</div>
<div class="easy"><b class="lbl">비유: 햄버거 고르기</b>빵이 2가지, 소스가 2가지면 만들 수 있는 햄버거는 2 × 2 = <b>4가지</b>예요. 빵을 고르는 것과 소스를 고르는 것이 서로 상관없는 것처럼, R/r와 Y/y도 서로 상관없이 골라져요.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>생식세포에는 각 쌍에서 <b>하나씩</b> 들어가요. ${g("Rr")}나 ${g("Yy")}처럼 한 쌍이 통째로 들어간 생식세포는 없어요. 생식세포는 RY, Ry, rY, ry처럼 <b>모양 글자 1개 + 색깔 글자 1개</b>예요.</div>`,
init(box){const sv=$("#tree",box);
 const base=`<text x="60" y="126" text-anchor="middle" class="svgmono" font-size="18" fill="var(--ink)">RrYy</text>`;
 const draw=(n)=>{let s=base; const b1=[["R",150,70],["r",150,170]]; const b2=[["Y",-28],["y",28]];
  if(n>=1) b1.forEach(([a,x,y],i)=>{s+=`<g class="fade-in" style="animation-delay:${i*.2}s"><line x1="94" y1="120" x2="${x-14}" y2="${y}" stroke="var(--accent)" stroke-width="2"/><text x="${x}" y="${y+6}" text-anchor="middle" class="svgmono" font-size="18" fill="${a==="R"?"var(--dom)":"var(--rec)"}">${a}</text></g>`;});
  if(n>=2) b1.forEach(([a,x,y],i)=>b2.forEach(([c,dy],j)=>{const yy=y+dy; s+=`<g class="fade-in" style="animation-delay:${.4+(i*2+j)*.2}s"><line x1="${x+14}" y1="${y}" x2="268" y2="${yy}" stroke="var(--accent)" stroke-width="2"/><text x="284" y="${yy+6}" text-anchor="middle" class="svgmono" font-size="18" fill="${c==="Y"?"var(--dom)":"var(--rec)"}">${c}</text><text x="330" y="${yy+6}" class="svgtxt" font-size="15">→</text><text x="370" y="${yy+6}" class="svgmono" font-size="18" fill="var(--ink)">${a}${c}</text><text x="420" y="${yy+6}" class="svgtxt" font-size="13">1/4</text></g>`;}));
  if(n>=2) s+=`<text x="260" y="234" text-anchor="middle" class="svgtxt fade-in" style="animation-delay:1.3s" font-size="14">RY : Ry : rY : ry = 1 : 1 : 1 : 1</text>`;
  sv.innerHTML=s;};
 draw(0); $("#treego",box).onclick=()=>{draw(1); setTimeout(()=>draw(2),600);};},
quiz:[{q:"RrYy가 만드는 생식세포가 아닌 것은?",o:["RY","ry","Rr","rY"],a:2,why:"생식세포에는 R/r 중 하나, Y/y 중 하나가 들어가요. Rr처럼 한 쌍이 통째로 들어간 생식세포는 없어요."},
      {q:"RrYy가 만드는 생식세포 RY : Ry : rY : ry의 비는?",o:["1 : 1 : 1 : 1","9 : 3 : 3 : 1","3 : 1 : 3 : 1"],a:0,why:"네 가지 조합이 똑같은 확률(각 1/4)로 만들어져요."}]});

add({id:"l4-3",part:"4. 독립의 법칙",no:"4-3",title:"9 : 3 : 3 : 1 결합 표",html:`
<p class="mt0">잡종 1대(${g("RrYy")})를 자가 수분하면 생식세포 4가지 × 4가지 = <b>16칸</b>의 결합 표가 나와요.</p>
<div class="vis" id="dibox"></div>
<div class="easy"><b class="lbl">결과 정리</b>둥글고 노란색 : 둥글고 초록색 : 주름지고 노란색 : 주름지고 초록색 = <b>9 : 3 : 3 : 1</b></div>
<div class="easy"><b class="lbl">한 형질씩 떼어 보면</b>16칸을 씨 모양만 보면 둥근 12 : 주름진 4 = <b>3 : 1</b>, 씨 색깔만 보면 노란 12 : 초록 4 = <b>3 : 1</b>이에요. 두 형질이 서로 영향을 주지 않고 각각 3 : 1로 유전되는 것, 이것이 <b>독립의 법칙</b>이에요.</div>`,
init(box){punnett($("#dibox",box),{left:["RY","Ry","rY","ry"],top:["RY","Ry","rY","ry"],leftName:"RrYy의 난세포",topName:"RrYy의 꽃가루",cell:PEA_CELL,small:true,
 summary:c=>{const p=countBy(c,x=>x.ph); return `표현형: ${ratioLine(p,["둥글고 노란색","둥글고 초록색","주름지고 노란색","주름지고 초록색"])}<br>→ <b>9 : 3 : 3 : 1</b>`;}});},
quiz:[{q:"RrYy를 자가 수분한 자손 중 주름지고 노란색인 완두의 비율은?",o:["9/16","3/16","1/16"],a:1,why:"9 : 3 : 3 : 1에서 주름지고 노란색은 3이므로 3/16이에요."},
      {q:"RrYy 자가 수분 결과 16칸 중 둥근 완두(색깔은 상관없이)는 몇 칸?",o:["9칸","12칸","4칸"],a:1,why:"둥글고 노란색 9칸 + 둥글고 초록색 3칸 = 12칸이에요. 12 : 4 = 3 : 1이에요."}]});

add({id:"l4-4",part:"4. 독립의 법칙",no:"4-4",title:"두 형질 계산은 곱하기로",html:`
<p class="mt0">16칸을 다 그리지 않아도 돼요! 두 형질은 독립적이니까 <b>각각의 확률을 곱하면</b> 돼요.</p>
<div class="vis" style="text-align:left"><div id="mul"></div></div>
<div class="easy"><b class="lbl">곱하기 공식 (RrYy × RrYy일 때)</b>
• 둥근 3/4, 주름진 1/4 / 노란색 3/4, 초록색 1/4<br>
• 둥글고 초록색 = 3/4 × 1/4 = <b>3/16</b><br>
• 유전자형 ${g("RrYy")} = Rr일 확률 1/2 × Yy일 확률 1/2 = <b>1/4 (= 4/16)</b><br>
• 유전자형 ${g("RRYY")} = 1/4 × 1/4 = <b>1/16</b><br>
• 순종(RRYY, RRyy, rrYY, rryy) = 1/2 × 1/2 = <b>1/4</b></div>
<div class="warn"><b class="lbl">자주 하는 실수</b>개수를 구할 때 전체 개수에 비율을 곱하는 걸 잊지 마세요. 1600개 중 주름지고 초록색 = 1600 × 1/16 = 100개예요.</div>`,
init(box){const m=$("#mul",box);
 m.innerHTML=`<b>곱하기 계산기 (RrYy × RrYy)</b><div style="margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
 <label>씨 모양: <select id="ms"><option value="둥근">둥근</option><option value="주름진">주름진</option></select></label>
 <label>씨 색깔: <select id="mc"><option value="노란색">노란색</option><option value="초록색">초록색</option></select></label>
 <label>전체 개수: <input id="mn" type="number" value="1600" min="16" step="16" style="width:90px"></label><button class="btn" id="mgo">계산</button></div><div id="mout" class="stepbox"></div>`;
 $("#mgo",box).onclick=()=>{const s=$("#ms",box).value, c=$("#mc",box).value, n=+$("#mn",box).value||0; const ps=s==="둥근"?3:1, pc=c==="노란색"?3:1;
  $("#mout",box).innerHTML=`${s} 확률 ${ps}/4 × ${c} 확률 ${pc}/4 = <b>${ps*pc}/16</b><br>개수: ${n} × ${ps*pc}/16 = <b>${n*ps*pc/16}개</b>`;};
 $("#mgo",box).click();},
quiz:[{q:"RrYy를 자가 수분하여 자손 800개를 얻었어요. 둥글고 초록색인 완두는 이론상 몇 개?",o:["50개","150개","450개"],a:1,why:"둥근 3/4 × 초록색 1/4 = 3/16, 800 × 3/16 = 150개예요."},
      {q:"RrYy를 자가 수분한 자손 중 유전자형이 RrYy일 확률은?",o:["1/16","1/4","9/16"],a:1,why:"Rr일 확률 1/2 × Yy일 확률 1/2 = 1/4이에요. 9/16은 '둥글고 노란색' 표현형의 확률이니 헷갈리지 마세요."}]});

/* ---------- 5. 사람의 유전 ---------- */
add({id:"l5-1",part:"5. 사람의 유전",no:"5-1",title:"사람의 유전 연구가 어려운 까닭",html:`
<p class="mt0">완두로는 멘델처럼 실험할 수 있는데, 사람은 왜 어려울까요?</p>
<div class="cards">
<div class="card fade-in"><b>한 세대가 길어요</b><svg viewBox="0 0 120 60" width="120" height="60" aria-hidden="true"><text x="60" y="36" text-anchor="middle" class="svgtxt" font-size="15">완두 1년</text><text x="60" y="56" text-anchor="middle" class="svgtxt" font-size="13">사람 약 30년</text></svg></div>
<div class="card fade-in" style="animation-delay:.2s"><b>자손 수가 적어요</b><svg viewBox="0 0 120 60" width="120" height="60" aria-hidden="true">${[0,1,2,3,4,5,6,7].map(i=>`<circle cx="${12+i*13}" cy="20" r="5" fill="var(--pea-g)"/>`).join("")}<circle cx="45" cy="46" r="7" fill="var(--surface2)" stroke="var(--ink)"/><circle cx="75" cy="46" r="7" fill="var(--surface2)" stroke="var(--ink)"/></svg></div>
<div class="card fade-in" style="animation-delay:.4s"><b>교배 실험을 할 수 없어요</b><svg viewBox="0 0 120 60" width="120" height="60" aria-hidden="true"><circle cx="60" cy="30" r="22" fill="none" stroke="var(--bad)" stroke-width="4"/><line x1="44" y1="46" x2="76" y2="14" stroke="var(--bad)" stroke-width="4"/></svg></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>사람은 한 번에 낳는 자손의 수가 적고, 한 세대가 길어서 여러 세대에 걸쳐 특정 형질이 유전되는 방식을 관찰하기 어렵다. 또, 사람을 자유롭게 교배하는 실험을 할 수도 없다.</div>
<div class="easy"><b class="lbl">그래서</b>사람의 유전은 실험 대신 <b>간접적인 방법</b>(가계도 조사, 쌍둥이 조사, 집단 조사)으로 연구해요. 다음 레슨에서 알아봐요.</div>`,
quiz:[{q:"사람의 유전 연구가 어려운 까닭이 아닌 것은?",o:["한 세대가 길다","자손의 수가 적다","사람에게는 유전 형질이 없다","자유로운 교배 실험이 불가능하다"],a:2,why:"사람에게도 혀 말기, 보조개, 귓불 모양 같은 유전 형질이 많아요."}]});

add({id:"l5-2",part:"5. 사람의 유전",no:"5-2",title:"연구 방법 3가지",html:`
<p class="mt0">카드를 눌러 각 연구 방법으로 <b>무엇을 알 수 있는지</b> 확인하세요.</p>
<div class="cards" id="meth"></div>
<div class="warn"><b class="lbl">구별하기</b>'한 집안의 여러 세대'를 보면 <b>가계도 조사</b>, '많은 사람을 통계 처리'하면 <b>집단 조사</b>, '1란성과 2란성 쌍둥이 비교'면 <b>쌍둥이 조사</b>예요.</div>`,
init(box){const M=[["가계도 조사","특정 형질을 가진 집안에서 여러 세대에 걸쳐 그 형질이 어떻게 유전되는지 알아보는 방법","형질의 <b>우열 관계</b>, 여러 세대에 걸친 <b>유전자의 전달 경로</b>"],
 ["쌍둥이 조사","1란성 쌍둥이와 2란성 쌍둥이를 대상으로 성장 환경과 특정 형질의 발현이 어느 정도 일치하는지 조사하는 방법","형질의 차이가 <b>유전</b>에 의한 것인지 <b>환경</b>에 의한 것인지"],
 ["집단 조사","한 집단에서 나타나는 유전 형질을 조사하고 자료를 통계 처리하는 방법","유전 형질의 특징, <b>유전자의 분포</b>"]];
 const w=$("#meth",box); M.forEach(([n,d,k])=>{let s=0; const c=el(`<div class="card" style="text-align:left"><b>${n}</b><div class="body" style="font-size:14px;margin-top:4px">${d}</div><button class="btn ghost">알 수 있는 것 보기</button></div>`);
  c.querySelector("button").onclick=()=>{s=1-s; c.querySelector(".body").innerHTML=s?`<span class="fade-in" style="display:block"><b>알 수 있는 것</b>: ${k}</span>`:d; c.querySelector("button").textContent=s?"방법 다시 보기":"알 수 있는 것 보기";}; w.appendChild(c);});},
quiz:[{q:"형질의 차이가 유전 때문인지 환경 때문인지 알아보는 데 알맞은 방법은?",o:["가계도 조사","쌍둥이 조사","집단 조사"],a:1,why:"쌍둥이 조사로 유전과 환경의 영향을 비교할 수 있어요."},
      {q:"형질의 우열 관계와 유전자의 전달 경로를 알 수 있는 방법은?",o:["가계도 조사","집단 조사","쌍둥이 조사"],a:0,why:"가계도를 분석하면 우열 관계와 여러 세대에 걸친 유전자의 전달 경로를 알 수 있어요."}]});

add({id:"l5-3",part:"5. 사람의 유전",no:"5-3",title:"1란성 쌍둥이와 2란성 쌍둥이",html:`
<p class="mt0">쌍둥이 조사를 이해하려면 두 쌍둥이가 어떻게 생기는지 알아야 해요.</p>
<div class="vis"><svg id="twin" viewBox="0 0 540 220" role="img" aria-label="쌍둥이 발생 애니메이션"></svg>
<div class="ctrl"><button class="btn" id="tw1">1란성 쌍둥이</button><button class="btn" id="tw2">2란성 쌍둥이</button></div><div class="stepbox" id="twtxt">버튼을 눌러 보세요.</div></div>
<div class="easy"><b class="lbl">핵심</b>1란성 쌍둥이는 유전 정보가 <b>같아요</b>. 그래서 1란성 쌍둥이가 서로 다르게 자랐다면, 그 차이는 <b>환경</b> 때문이라고 볼 수 있어요.</div>`,
init(box){const sv=$("#twin",box);
 const zyg=(x,y,c,lab,d)=>`<g class="fade-in" style="animation-delay:${d}s"><circle cx="${x}" cy="${y}" r="22" fill="${c}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x}" y="${y+44}" text-anchor="middle" class="svgtxt" font-size="12">${lab}</text></g>`;
 $("#tw1",box).onclick=()=>{sv.innerHTML=`<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>`+zyg(90,90,"#9CC9A6","수정란 1개",0)+
  `<line x1="118" y1="90" x2="220" y2="90" stroke="var(--accent)" stroke-width="2" marker-end="url(#a2)" class="fade-in" style="animation-delay:.5s"/><text x="168" y="80" text-anchor="middle" class="svgtxt fade-in" style="animation-delay:.5s" font-size="12">둘로 나뉨</text>`+
  zyg(260,60,"#9CC9A6","",1)+zyg(260,140,"#9CC9A6","",1)+`<line x1="290" y1="60" x2="380" y2="60" stroke="var(--accent)" stroke-width="2" marker-end="url(#a2)" class="fade-in" style="animation-delay:1.4s"/><line x1="290" y1="140" x2="380" y2="140" stroke="var(--accent)" stroke-width="2" marker-end="url(#a2)" class="fade-in" style="animation-delay:1.4s"/>`+
  zyg(420,60,"#9CC9A6","아기 1",1.8)+zyg(420,140,"#9CC9A6","아기 2",1.8);
  $("#twtxt",box).innerHTML="<b>1란성 쌍둥이</b>: 하나의 수정란이 발생 초기에 둘로 나뉜 후 각각 발생. 두 사람의 유전 정보는 <b>서로 같다</b>(같은 색).";};
 $("#tw2",box).onclick=()=>{sv.innerHTML=`<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>`+zyg(150,60,"#9CC9A6","수정란 1",0)+zyg(150,150,"#C9A6E0","수정란 2",0)+
  `<line x1="180" y1="60" x2="370" y2="60" stroke="var(--accent)" stroke-width="2" marker-end="url(#a3)" class="fade-in" style="animation-delay:.6s"/><line x1="180" y1="150" x2="370" y2="150" stroke="var(--accent)" stroke-width="2" marker-end="url(#a3)" class="fade-in" style="animation-delay:.6s"/>`+
  zyg(410,60,"#9CC9A6","아기 1",1.1)+zyg(410,150,"#C9A6E0","아기 2",1.1);
  $("#twtxt",box).innerHTML="<b>2란성 쌍둥이</b>: 각기 다른 2개의 수정란이 동시에 발생. 두 사람의 유전 정보는 <b>서로 다르다</b>(다른 색).";};},
quiz:[{q:"유전 정보가 서로 같은 쌍둥이는?",o:["1란성 쌍둥이","2란성 쌍둥이"],a:0,why:"1란성 쌍둥이는 하나의 수정란이 둘로 나뉘어 생겨서 유전 정보가 같아요."},
      {q:"1란성 쌍둥이가 자라면서 몸무게가 달라졌다면 그 까닭은 주로?",o:["유전","환경"],a:1,why:"유전 정보가 같으니, 다르게 자란 부분은 주로 환경의 영향이에요."}]});

add({id:"l5-4",part:"5. 사람의 유전",no:"5-4",title:"사람의 유전 형질",html:`
<p class="mt0">사람에게도 대립 형질이 뚜렷해서 우성과 열성으로 구분되는 형질이 있어요. 이 형질의 유전자는 <b>상염색체</b>(성염색체가 아닌 염색체)에 있어요.</p>
<div class="tablewrap"><table class="t"><tr><th>형질</th><th>우성</th><th>열성</th></tr>
<tr><td>혀 말기</td><td>가능</td><td>불가능</td></tr><tr><td>눈꺼풀</td><td>쌍꺼풀</td><td>외까풀</td></tr><tr><td>보조개</td><td>있음</td><td>없음</td></tr>
<tr><td>귓불 모양</td><td>분리형</td><td>부착형</td></tr><tr><td>이마선 모양</td><td>M자형</td><td>일자형</td></tr></table></div>
<div class="vis"><svg viewBox="0 0 440 256" role="img" aria-label="귓불 모양 분리형과 부착형">
<g transform="translate(50,30)">
 <path d="M12 0 L12 150" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><text x="12" y="-10" text-anchor="middle" class="svgtxt" font-size="14" fill="var(--muted)">얼굴 쪽</text>
 <path d="M12 12 C 70 -10, 108 40, 92 84 C 84 104, 72 112, 66 124 C 60 142, 36 146, 30 130 C 27 120, 32 110, 12 104 Z" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>
 <path d="M30 28 C 66 22, 80 54, 66 84" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-opacity=".6"/>
 <path d="M22 118 Q 18 126 14 126" fill="none" stroke="var(--dom)" stroke-width="2"/><circle cx="24" cy="124" r="12" fill="none" stroke="var(--dom)" stroke-width="2" stroke-dasharray="3 3"/>
 <text x="60" y="172" text-anchor="middle" class="svgtxt" font-size="15" fill="var(--dom)">귓불 끝이 얼굴에서</text><text x="60" y="191" text-anchor="middle" class="svgtxt" font-size="15" fill="var(--dom)">떨어져 있음</text>
 <text x="60" y="218" text-anchor="middle" class="svgtxt" font-size="17">분리형 귓불 (우성)</text></g>
<g transform="translate(270,30)">
 <path d="M12 0 L12 150" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><text x="12" y="-10" text-anchor="middle" class="svgtxt" font-size="14" fill="var(--muted)">얼굴 쪽</text>
 <path d="M12 12 C 70 -10, 108 40, 92 84 C 84 104, 66 116, 12 128 Z" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>
 <path d="M30 28 C 66 22, 80 54, 66 84" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-opacity=".6"/>
 <circle cx="20" cy="124" r="12" fill="none" stroke="var(--rec)" stroke-width="2" stroke-dasharray="3 3"/>
 <text x="60" y="172" text-anchor="middle" class="svgtxt" font-size="15" fill="var(--rec)">귓불이 얼굴에</text><text x="60" y="191" text-anchor="middle" class="svgtxt" font-size="15" fill="var(--rec)">바로 붙어 있음</text>
 <text x="60" y="218" text-anchor="middle" class="svgtxt" font-size="17">부착형 귓불 (열성)</text></g>
</svg><div class="cap">귓불이 얼굴에서 떨어져 내려오면 분리형, 얼굴에 붙어 있으면 부착형이에요.</div></div>
<div class="easy"><b class="lbl">상염색체 유전의 특징</b>남자와 여자에게 나타나는 빈도에 <b>차이가 없어요</b>. 완두처럼 멘델의 유전 원리를 따라요.</div>`,
quiz:[{q:"다음 중 우성 형질은?",o:["외까풀","부착형 귓불","혀 말기 가능","일자형 이마선"],a:2,why:"혀 말기 가능, 쌍꺼풀, 보조개 있음, 분리형 귓불, M자형 이마선이 우성이에요."}]});

add({id:"l5-5",part:"5. 사람의 유전",no:"5-5",title:"가계도 읽는 법",html:`
<p class="mt0"><b>가계도</b>는 한 집안에서 특정 형질이 어떻게 유전되는지 <b>기호</b>로 나타낸 그림이에요.</p>
<div class="vis"><svg viewBox="0 0 520 250" role="img" aria-label="가계도 기호 설명">
<rect x="30" y="20" width="30" height="30" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="72" y="41" class="svgtxt" font-size="14">남자</text>
<circle cx="155" cy="35" r="15" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="178" y="41" class="svgtxt" font-size="14">여자</text>
<rect x="250" y="20" width="30" height="30" fill="var(--ink)"/><circle cx="315" cy="35" r="15" fill="var(--ink)"/><text x="340" y="30" class="svgtxt" font-size="14">칠한 기호 =</text><text x="340" y="50" class="svgtxt" font-size="14">특정 형질이 나타난 사람</text>
<g transform="translate(150,90)"><rect x="0" y="0" width="34" height="34" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="17" y="23" text-anchor="middle" class="svgmono" font-size="14" fill="var(--ink)">1</text>
<line x1="34" y1="17" x2="130" y2="17" stroke="var(--ink)" stroke-width="2"/><circle cx="147" cy="17" r="17" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="147" y="23" text-anchor="middle" class="svgmono" font-size="14" fill="var(--ink)">2</text>
<line x1="82" y1="17" x2="82" y2="70" stroke="var(--ink)" stroke-width="2"/><line x1="17" y1="70" x2="147" y2="70" stroke="var(--ink)" stroke-width="2"/><line x1="17" y1="70" x2="17" y2="96" stroke="var(--ink)" stroke-width="2"/><line x1="147" y1="70" x2="147" y2="96" stroke="var(--ink)" stroke-width="2"/>
<rect x="0" y="96" width="34" height="34" fill="var(--ink)"/><text x="17" y="119" text-anchor="middle" class="svgmono" font-size="14" fill="var(--surface)">3</text><circle cx="147" cy="113" r="17" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="147" y="119" text-anchor="middle" class="svgmono" font-size="14" fill="var(--ink)">4</text></g>
<text x="350" y="112" class="svgtxt" font-size="13">← 가로선: 결혼(부부)</text><text x="350" y="165" class="svgtxt" font-size="13">← 세로선: 부모와 자녀</text>
</svg><div class="cap">1과 2는 부부이고, 3(아들)과 4(딸)는 1과 2의 자녀예요. 3만 특정 형질을 가졌어요.</div></div>
<div class="easy"><b class="lbl">가계도에서 가장 먼저 볼 것</b>부모에게 <b>없던 형질</b>이 자녀에게 나타났나요? 그렇다면 그 형질은 <b>열성</b>이에요. 위 그림에서 3의 형질은 부모(1, 2)에게 없으니 열성이에요.</div>`,
quiz:[{q:"가계도에서 동그라미(○)는 누구를 나타낼까요?",o:["남자","여자","특정 형질을 가진 사람"],a:1,why:"□는 남자, ○는 여자, 칠한 기호는 특정 형질을 가진 사람이에요."},
      {q:"부모에게 없던 형질이 자녀에게 나타났다면 그 형질은?",o:["우성","열성"],a:1,why:"부모가 열성 대립유전자를 숨기고 있다가 자녀에게 하나씩 물려준 것이므로 그 형질은 열성이에요."}]});

add({id:"l5-6",part:"5. 사람의 유전",no:"5-6",title:"귓불 가계도 분석하기",html:`
<p class="mt0">아래 가계도를 단계별로 분석해 봐요. <b>다음 단계</b> 버튼을 누를 때마다 설명과 강조 표시가 바뀌어요.</p>
<div class="vis"><svg id="ped1" viewBox="0 0 520 290" role="img" aria-label="귓불 모양 가계도"></svg>
<div class="cap">□ 분리형 남자 · ■ 부착형 남자 · ○ 분리형 여자 · ● 부착형 여자</div><div class="stepbox" id="ped1t"></div><div class="ctrl"><button class="btn ghost" id="ped1p">◀ 이전</button><button class="btn" id="ped1n">다음 단계 ▶</button></div></div>`,
init(box){
 const N={1:{s:"m",x:150,y:40,f:0},2:{s:"f",x:280,y:40,f:0},3:{s:"m",x:110,y:150,f:0},4:{s:"f",x:320,y:150,f:1},5:{s:"f",x:30,y:150,f:0},6:{s:"m",x:60,y:250,f:1},7:{s:"f",x:150,y:250,f:0}};
 const C=[[1,2,[3,4]],[5,3,[6,7]]];
 const steps=[{h:[],t:"칠한 기호 = <b>부착형</b> 귓불, 빈 기호 = <b>분리형</b> 귓불이에요. 대립유전자는 E(분리형), e(부착형)로 나타낼게요.",lab:{}},
  {h:[1,2,4],t:"<b>1단계 우열</b>: 분리형인 1과 2 사이에서 부착형인 4가 태어났어요. 부모에게 없던 형질이 나타났으니 <b>부착형이 열성</b>, 분리형이 우성이에요.",lab:{}},
  {h:[4,6],t:"<b>2단계 열성인 사람</b>: 부착형(열성)인 사람은 열성 대립유전자만 2개 → 4와 6은 <b>ee</b>예요.",lab:{4:"ee",6:"ee"}},
  {h:[1,2],t:"<b>3단계 부모 추론</b>: 4(ee)는 1과 2에게서 e를 하나씩 받았어요. 1과 2는 분리형이니 <b>Ee</b>예요.",lab:{1:"Ee",2:"Ee",4:"ee",6:"ee"}},
  {h:[3,5],t:"<b>4단계</b>: 6(ee)은 3과 5에게서 e를 하나씩 받았어요. 3과 5는 분리형이니 <b>Ee</b>예요.",lab:{1:"Ee",2:"Ee",3:"Ee",5:"Ee",4:"ee",6:"ee"}},
  {h:[7],t:"<b>5단계 알 수 없는 사람</b>: 7은 분리형이에요. Ee × Ee에서 분리형은 <b>EE 또는 Ee</b>라 확실히 알 수 없어요.",lab:{1:"Ee",2:"Ee",3:"Ee",5:"Ee",4:"ee",6:"ee",7:"EE 또는 Ee"}}];
 let k=0; const sv=$("#ped1",box);
 const draw=()=>{sv.innerHTML=drawPed(N,C,steps[k].h,steps[k].lab,[["m",0,"분리형 남자"],["m",1,"부착형 남자"],["f",0,"분리형 여자"],["f",1,"부착형 여자"]],300); $("#ped1t",box).innerHTML=steps[k].t;};
 $("#ped1n",box).onclick=()=>{k=Math.min(steps.length-1,k+1); draw();}; $("#ped1p",box).onclick=()=>{k=Math.max(0,k-1); draw();}; draw();},
quiz:[{q:"위 가계도에서 유전자형을 확실히 알 수 없는 사람은?",o:["1","4","7"],a:2,why:"7은 분리형(우성)인데 부모가 Ee × Ee라서 EE인지 Ee인지 알 수 없어요."},
      {q:"부착형 귓불(열성)인 사람의 유전자형은 항상?",o:["EE","Ee","ee"],a:2,why:"열성 형질은 열성 대립유전자만 2개 있을 때 나타나요."}]});
function drawPed(N,C,hl,lab,leg,H){
 let s=""; const sz=32;
 C.forEach(([a,b,kids])=>{const A=N[a],B=N[b]; s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="var(--ink)" stroke-width="2"/>`;
  if(kids.length){const mx=(A.x+B.x)/2, ky=N[kids[0]].y, sy=ky-46; s+=`<line x1="${mx}" y1="${A.y}" x2="${mx}" y2="${sy}" stroke="var(--ink)" stroke-width="2"/>`;
   const xs=kids.map(k=>N[k].x).concat([mx]); s+=`<line x1="${Math.min(...xs)}" y1="${sy}" x2="${Math.max(...xs)}" y2="${sy}" stroke="var(--ink)" stroke-width="2"/>`;
   kids.forEach(k=>s+=`<line x1="${N[k].x}" y1="${sy}" x2="${N[k].x}" y2="${N[k].y-sz/2}" stroke="var(--ink)" stroke-width="2"/>`);}});
 Object.entries(N).forEach(([id,n])=>{const on=hl.includes(+id); const fill=n.f?"var(--ink)":"var(--surface)"; const tc=n.f?"var(--surface)":"var(--ink)";
  if(on) s+=`<circle cx="${n.x}" cy="${n.y}" r="${sz/2+10}" fill="var(--hl)" opacity=".9"><animate attributeName="r" values="${sz/2+6};${sz/2+12};${sz/2+6}" dur="1.2s" repeatCount="indefinite"/></circle>`;
  s+=n.s==="m"?`<rect x="${n.x-sz/2}" y="${n.y-sz/2}" width="${sz}" height="${sz}" fill="${fill}" stroke="var(--ink)" stroke-width="2"/>`:`<circle cx="${n.x}" cy="${n.y}" r="${sz/2}" fill="${fill}" stroke="var(--ink)" stroke-width="2"/>`;
  s+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" class="svgmono" font-size="16" fill="${tc}">${id}</text>`;
  if(n.u) s+=`<text x="${n.x}" y="${n.y+sz/2+16}" text-anchor="middle" class="svgtxt" font-size="14">${n.u}</text>`;
  if(lab&&lab[id]) s+=`<text x="${n.x}" y="${n.y+sz/2+(n.u?32:17)}" text-anchor="middle" class="svgmono fade-in" font-size="17" fill="var(--accent)">${lab[id]}</text>`;});
 if(false&&leg){leg.forEach(([sx,f,t],i)=>{const x=10+i*128, y=H-14; s+=sx==="m"?`<rect x="${x}" y="${y-12}" width="13" height="13" fill="${f?"var(--ink)":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.5"/>`:`<circle cx="${x+6}" cy="${y-5}" r="7" fill="${f?"var(--ink)":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.5"/>`; s+=`<text x="${x+18}" y="${y}" class="svgtxt" font-size="12">: ${t}</text>`;});}
 return s;}

/* ---------- 6. ABO식 혈액형 ---------- */
add({id:"l6-1",part:"6. ABO식 혈액형",no:"6-1",title:"대립유전자가 3가지!",html:`
<p class="mt0">ABO식 혈액형도 상염색체에 있는 유전자로 정해져요. 다른 형질과 다른 점은 대립유전자가 <b>A, B, O 세 가지</b>라는 거예요. 그래도 한 사람은 그중 <b>2개</b>만 가져요.</p>
<div class="vis"><svg viewBox="0 0 520 150" role="img" aria-label="ABO 대립유전자 우열 관계">
<g transform="translate(70,20)"><circle cx="30" cy="30" r="26" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2"/><text x="30" y="38" text-anchor="middle" class="svgmono" font-size="22" fill="var(--dom)">A</text></g>
<g transform="translate(220,20)"><circle cx="30" cy="30" r="26" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2"/><text x="30" y="38" text-anchor="middle" class="svgmono" font-size="22" fill="var(--dom)">B</text></g>
<g transform="translate(370,20)"><circle cx="30" cy="30" r="26" fill="var(--surface2)" stroke="var(--ink)" stroke-width="2"/><text x="30" y="38" text-anchor="middle" class="svgmono" font-size="22" fill="var(--rec)">O</text></g>
<text x="175" y="56" text-anchor="middle" class="svgmono" font-size="18" fill="var(--ink)">=</text><text x="175" y="80" text-anchor="middle" class="svgtxt" font-size="12">우열 없음</text>
<text x="325" y="56" text-anchor="middle" class="svgmono" font-size="18" fill="var(--ink)">&gt;</text><text x="325" y="80" text-anchor="middle" class="svgtxt" font-size="12">O는 열성</text>
<text x="260" y="128" text-anchor="middle" class="svgtxt" font-size="14">A와 B는 둘 다 O에 대해 우성, A와 B 사이에는 우열이 없어요.</text>
</svg></div>
<div class="tablewrap"><table class="t"><tr><th>표현형</th><th>유전자형</th><th>설명</th></tr>
<tr><td>A형</td><td><span class="g">AA, AO</span></td><td>A가 있고 B가 없으면 A형</td></tr><tr><td>B형</td><td><span class="g">BB, BO</span></td><td>B가 있고 A가 없으면 B형</td></tr>
<tr><td>AB형</td><td><span class="g">AB</span></td><td>A와 B가 함께 있으면 둘 다 나타남</td></tr><tr><td>O형</td><td><span class="g">OO</span></td><td>O만 2개일 때</td></tr></table></div>
<div class="easy"><b class="lbl">시험 단골 생각법</b>• O형 자녀가 있다 → 부모 둘 다 O를 하나씩 가지고 있어요.<br>• O형(OO) 부모는 자녀에게 항상 O를 줘요.<br>• AB형 부모는 자녀에게 A 또는 B를 줘요(O는 못 줘요).</div>`,
quiz:[{q:"A형인 사람의 유전자형이 될 수 있는 것을 모두 고르면?",o:["AA와 AO","AB","OO"],a:0,why:"A형은 AA 또는 AO예요. AB는 AB형, OO는 O형이에요."},
      {q:"A형인 부모 사이에서 O형 자녀가 태어났다면 부모의 유전자형은?",o:["둘 다 AA","둘 다 AO","AA와 AO"],a:1,why:"O형 자녀(OO)는 부모에게서 O를 하나씩 받았어요. 그래서 A형 부모는 둘 다 AO예요."}]});

add({id:"l6-2",part:"6. ABO식 혈액형",no:"6-2",title:"자녀의 혈액형 예측기",html:`
<p class="mt0">부모의 유전자형을 골라 결합 표를 만들어 보세요. 자녀가 가질 수 있는 혈액형과 확률이 나와요.</p>
<div class="vis"><div class="ctrl" style="margin-top:0"><label>어머니 <select id="abom"></select></label><label>아버지 <select id="abof"></select></label><button class="btn ghost" id="abogo">표 만들기</button></div><div id="abobox" style="margin-top:10px"></div></div>
<div class="easy"><b class="lbl">해 보세요</b>① AO × BO를 골라 보세요. 네 가지 혈액형이 모두 나와요!<br>② AB × OO를 골라 보세요. 부모와 같은 혈액형의 자녀가 없어요!</div>`,
init(box){const G=["AA","AO","BB","BO","AB","OO"]; const ph=t=>t.includes("A")&&t.includes("B")?"AB형":t.includes("A")?"A형":t.includes("B")?"B형":"O형";
 const ord=x=>"ABO".indexOf(x);
 ["#abom","#abof"].forEach((id,i)=>{const s=$(id,box); G.forEach(gt=>s.appendChild(el(`<option value="${gt}">${gt} (${ph(gt)})</option>`))); s.value=i?"BO":"AO";});
 const go=()=>{const m=$("#abom",box).value, f=$("#abof",box).value;
  punnett($("#abobox",box),{left:[...m],top:[...f],leftName:"어머니("+m+")의 생식세포",topName:"아버지("+f+")의 생식세포",fmt:x=>`<span class="g">${x}</span>`,
   cell:(a,b)=>{const t=[a,b].sort((x,y)=>ord(x)-ord(y)).join(""); return {t:`<span class="g">${t}</span>`,sub:ph(t),key:t,ph:ph(t)};},
   summary:c=>{const p=countBy(c,x=>x.ph); return "자녀의 혈액형: "+[...p].map(([k,v])=>`<span class="chip">${k} ${v}/4 = ${v*25}%</span>`).join(" ");}});};
 $("#abogo",box).onclick=go; $("#abom",box).onchange=go; $("#abof",box).onchange=go; go();},
quiz:[{q:"AO × BO 부부의 자녀가 O형일 확률은?",o:["0%","25%","50%"],a:1,why:"결합 표 4칸 중 OO가 1칸이므로 1/4 = 25%예요."},
      {q:"AB형 × O형 부부에게서 태어날 수 있는 자녀의 혈액형은?",o:["A형, B형","AB형, O형","네 가지 모두"],a:0,why:"AB × OO → AO(A형), BO(B형)만 나와요."}]});

/* ---------- 7. 반성유전 ---------- */
add({id:"l7-1",part:"7. 반성유전",no:"7-1",title:"성염색체와 성별",html:`
<p class="mt0">사람의 염색체 중 성별을 정하는 한 쌍을 <b>성염색체</b>라고 해요. 여자는 <b>XX</b>, 남자는 <b>XY</b>예요.</p>
<div class="vis" id="sexbox"></div>
<div class="easy"><b class="lbl">꼭 기억할 것</b>• <b>아들</b>: 엄마에게서 <b>X</b>, 아빠에게서 <b>Y</b>를 받아요.<br>• <b>딸</b>: 엄마에게서 X, 아빠에게서 <b>X</b>를 받아요.<br>→ 아빠의 X는 <b>딸에게만</b>, 아빠의 Y는 <b>아들에게만</b> 가요.</div>`,
init(box){punnett($("#sexbox",box),{left:["X","X"],top:["X","Y"],leftName:"어머니(XX)의 난자",topName:"아버지(XY)의 정자",fmt:x=>`<span class="g">${x}</span>`,
 cell:(a,b)=>{const t=a+b; return {t:`<span class="g">${t}</span>`,sub:b==="Y"?"아들":"딸",key:t,ph:b==="Y"?"아들":"딸"};},
 summary:c=>{const p=countBy(c,x=>x.ph); return "아들 : 딸 = "+(p.get("아들")||0)+" : "+(p.get("딸")||0)+" = <b>1 : 1</b>. 아들의 Y는 아버지에게서, 딸의 X 하나는 아버지에게서 왔어요.";}});},
quiz:[{q:"아들은 X 염색체를 누구에게서 받을까요?",o:["아버지","어머니"],a:1,why:"아들은 아버지에게서 Y, 어머니에게서 X를 받아요."}]});

add({id:"l7-2",part:"7. 반성유전",no:"7-2",title:"적록 색맹과 보인자",html:`
<p class="mt0"><b>적록 색맹</b>은 붉은색과 초록색을 잘 구별하지 못하는 유전 형질이에요. 색맹 유전자는 <b>X 염색체</b>에 있고, 색맹 대립유전자(<span class="rec g">X′</span>)는 정상 대립유전자(<span class="g">X</span>)에 대해 <b>열성</b>이에요.</p>
<div class="vis"><svg viewBox="0 0 540 230" role="img" aria-label="색맹 유전자형과 표현형">
${[["XY",40,"정상 남자",0],["X′Y",150,"색맹 남자",1],["XX",290,"정상 여자",0],["XX′",390,"정상 여자 (보인자)",0],["X′X′",490,"색맹 여자",1]].map(([gt,x,t,f],i)=>{
 const ch=gt.match(/X′|X|Y/g); return `<g class="fade-in" style="animation-delay:${i*.2}s">${ch.map((c,j)=>`<rect x="${x-24+j*26}" y="${c==="Y"?44:30}" width="20" height="${c==="Y"?46:60}" rx="10" fill="${c==="X′"?"color-mix(in srgb,var(--rec) 30%,var(--surface))":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x-14+j*26}" y="${c==="Y"?75:66}" text-anchor="middle" class="svgmono" font-size="13" fill="${c==="X′"?"var(--rec)":"var(--ink)"}">${c}</text>`).join("")}<text x="${x}" y="120" text-anchor="middle" class="svgmono" font-size="15" fill="var(--ink)">${gt}</text><text x="${x}" y="142" text-anchor="middle" class="svgtxt" font-size="12" fill="${f?"var(--bad)":"var(--ink)"}">${t}</text></g>`;}).join("")}
<text x="270" y="190" text-anchor="middle" class="svgtxt" font-size="14">남자는 X가 1개 → X′ 하나만 있어도 색맹</text>
<text x="270" y="214" text-anchor="middle" class="svgtxt" font-size="14">여자는 X가 2개 → 둘 다 X′여야 색맹</text>
</svg></div>
<div class="book"><b class="lbl">교과서 말로는</b><b>반성유전</b>: 유전자가 성염색체에 있어 유전 형질이 나타나는 빈도가 남녀에 따라 차이가 나는 유전 현상. 예: 적록 색맹, 혈우병<br><b>보인자</b>: X 염색체 하나에만 색맹 대립유전자가 있는 여자(XX′). 정상인처럼 색을 구별할 수 있다.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>보인자(XX′)의 표현형은 <b>정상</b>이에요. '보인자'는 표현형이 아니라 색맹 대립유전자를 숨기고 있다는 뜻이에요.</div>
<div class="easy"><b class="lbl">왜 남자에게 더 많을까?</b>남자는 X가 하나뿐이라 X′를 하나만 받아도 색맹이 되지만, 여자는 X′를 두 개 받아야 색맹이 되기 때문이에요.</div>`,
quiz:[{q:"XX′인 여자의 표현형은?",o:["색맹","정상(보인자)"],a:1,why:"X′는 열성이라 X가 하나라도 있으면 정상이에요. 이런 여자를 보인자라고 해요."},
      {q:"적록 색맹이 여자보다 남자에게 많이 나타나는 까닭은?",o:["남자는 X 염색체가 1개라서","남자는 X 염색체가 2개라서","색맹 유전자가 Y에 있어서"],a:0,why:"남자는 X가 1개라서 X′ 하나만 있어도 색맹이 돼요. 색맹 유전자는 X 염색체에 있어요."}]});

add({id:"l7-3",part:"7. 반성유전",no:"7-3",title:"색맹 자녀 예측기",html:`
<p class="mt0">부모의 유전자형을 골라 아들과 딸이 색맹일지 예측해 보세요.</p>
<div class="vis"><div class="ctrl" style="margin-top:0"><label>어머니 <select id="cbm"><option value="XX">XX (정상)</option><option value="XX′">XX′ (보인자)</option><option value="X′X′">X′X′ (색맹)</option></select></label>
<label>아버지 <select id="cbf"><option value="XY">XY (정상)</option><option value="X′Y">X′Y (색맹)</option></select></label></div><div id="cbbox" style="margin-top:10px"></div></div>
<div class="easy"><b class="lbl">규칙 찾기</b>• 어머니가 X′X′(색맹)이면 <b>아들은 모두 색맹</b>이에요(아들의 X는 어머니에게서 오니까).<br>• 아버지가 X′Y(색맹)이면 <b>딸은 모두 X′를 가져요</b>(아버지의 X는 딸에게 가니까).<br>• 아버지가 색맹이어도 <b>아들은 아버지에게서 색맹 대립유전자를 받지 않아요</b>.</div>`,
init(box){const split=s=>s.match(/X′|X|Y/g); const ph=t=>{if(t.includes("Y")) return t.startsWith("X′")?"색맹 아들":"정상 아들"; const n=(t.match(/X′/g)||[]).length; return n===2?"색맹 딸":n===1?"보인자 딸":"정상 딸";};
 const go=()=>{const m=$("#cbm",box).value, f=$("#cbf",box).value;
  punnett($("#cbbox",box),{left:split(m),top:split(f),leftName:"어머니("+m+")의 난자",topName:"아버지("+f+")의 정자",fmt:x=>x==="X′"?`<span class="g rec">X′</span>`:`<span class="g">${x}</span>`,
   cell:(a,b)=>{let t; if(b==="Y") t=a+"Y"; else t=(a==="X"||b==="X′")?a+b:b+a; t=t.replace("X′X","XX′"); return {t:`<span class="g">${t.replace(/X′/g,"<span class='rec'>X′</span>")}</span>`,sub:ph(t),key:t,ph:ph(t)};},
   summary:c=>{const p=countBy(c,x=>x.ph); return [...p].map(([k,v])=>`<span class="chip">${k} ${v}칸</span>`).join(" ");}});};
 $("#cbm",box).onchange=go; $("#cbf",box).onchange=go; $("#cbm",box).value="XX′"; go();},
quiz:[{q:"보인자 어머니(XX′)와 정상 아버지(XY)의 아들이 색맹일 확률은?",o:["0%","25%","50%"],a:2,why:"아들은 어머니에게서 X 또는 X′를 1/2씩 받으므로, 아들 중 색맹일 확률은 50%예요. (전체 자녀 중 색맹 아들일 확률은 25%예요. 무엇을 묻는지 잘 보세요!)"},
      {q:"색맹 아버지(X′Y)와 정상 어머니(XX)의 딸은?",o:["모두 색맹","모두 보인자","모두 정상이고 X′가 없다"],a:1,why:"딸은 아버지에게서 반드시 X′를 받고 어머니에게서 X를 받아 XX′(보인자)가 돼요."}]});

add({id:"l7-4",part:"7. 반성유전",no:"7-4",title:"혈우병과 빅토리아 여왕",html:`
<p class="mt0"><b>혈우병</b>은 혈액이 잘 응고되지 않아 상처가 나면 출혈이 잘 멈추지 않는 병이에요. 적록 색맹과 마찬가지로 유전자가 <b>X 염색체</b>에 있고, 혈우병 대립유전자는 <b>열성</b>이에요.</p>
<div class="vis"><svg id="vic" viewBox="0 0 540 335" role="img" aria-label="혈우병 대립유전자 전달 경로"></svg>
<div class="ctrl"><button class="btn" id="vicgo">전달 경로 따라가기</button></div><div class="stepbox" id="victxt">영국의 빅토리아 여왕은 혈우병 대립유전자를 가진 보인자였어요.</div></div>
<div class="easy"><b class="lbl">핵심</b>보인자인 엄마 → 딸(보인자)에게 전달 → 그 딸의 아들에게서 혈우병이 나타날 수 있어요. 혈우병 대립유전자는 <b>여자(보인자)를 통해</b> 다음 세대 남자에게 전달되는 경우가 많아요.</div>`,
init(box){const sv=$("#vic",box);
 const N={1:{s:"f",x:130,y:40,f:0,u:"빅토리아 여왕 (보인자)"},2:{s:"m",x:260,y:40,f:0},3:{s:"f",x:195,y:125,f:0,u:"딸 (보인자)"},4:{s:"m",x:330,y:125,f:0},5:{s:"f",x:262,y:210,f:0,u:"손녀 (보인자)"},7:{s:"m",x:420,y:210,f:0},6:{s:"m",x:341,y:295,f:1,u:"증손자 (혈우병)"}};
 const base=()=>drawPed(N,[[1,2,[3]],[3,4,[5]],[5,7,[6]]],[],{},null,260);
 sv.innerHTML=base();
 $("#vicgo",box).onclick=()=>{const seq=[[1],[1,3],[1,3,5],[1,3,5,6]]; const msg=["① 빅토리아 여왕(XX′)이 X′를 가지고 있었어요.","② 딸에게 X′가 전해졌어요. 딸은 보인자(XX′)예요.","③ 손녀에게도 X′가 전해졌어요. 손녀도 보인자예요.","④ 보인자 어머니에게서 X′를 받은 아들에게 혈우병이 나타났어요(실제 역사: 러시아의 알렉세이 왕자)."];
  let i=0; const step=()=>{sv.innerHTML=drawPed(N,[[1,2,[3]],[3,4,[5]],[5,7,[6]]],seq[i],{},null,260); $("#victxt",box).innerHTML=msg[i]; i++; if(i<seq.length) setTimeout(step,1500);}; step();};},
quiz:[{q:"혈우병 유전자가 있는 염색체는?",o:["상염색체","X 염색체","Y 염색체"],a:1,why:"혈우병도 적록 색맹처럼 X 염색체에 유전자가 있는 반성유전이에요."}]});

/* ---------- 8. 가계도 분석 비법 ---------- */
add({id:"l8-1",part:"8. 가계도 분석 비법",no:"8-1",title:"3단계 비법",html:`
<p class="mt0">어떤 가계도 문제든 이 3단계로 풀 수 있어요.</p>
<div class="cards">
<div class="card fade-in" style="text-align:left"><b>1단계 우열 찾기</b><span style="font-size:14px">부모에게 없던 형질이 자녀에게 나타나면 그 형질은 <b>열성</b>이에요.</span></div>
<div class="card fade-in" style="animation-delay:.2s;text-align:left"><b>2단계 상염색체? X?</b><span style="font-size:14px">X 염색체 유전이라고 가정하고 모순이 있는지 찾아요.<br>• 열성인 <b>딸</b>의 아버지가 우성(정상)이면 → X가 아님<br>• 열성인 <b>어머니</b>의 아들이 우성(정상)이면 → X가 아님</span></div>
<div class="card fade-in" style="animation-delay:.4s;text-align:left"><b>3단계 유전자형 쓰기</b><span style="font-size:14px">• 열성 형질인 사람은 순종(aa)<br>• 열성인 부모나 자녀가 있는 우성인 사람은 잡종(Aa)<br>• 그래도 모르면 '확실히 알 수 없음'</span></div></div>
<div class="easy"><b class="lbl">2단계가 왜 그럴까?</b>X 염색체 유전이라면 딸은 아버지의 X를 <b>반드시</b> 받아요. 딸이 열성(X′X′)이려면 아버지도 X′Y(열성)여야 해요. 그런데 아버지가 정상이면 말이 안 되니까 X 염색체 유전이 아니에요.</div>`,
quiz:[{q:"열성 형질인 딸의 아버지가 정상(우성)이라면, 이 형질의 유전자는?",o:["X 염색체에 있다","상염색체에 있다"],a:1,why:"X 염색체 유전이라면 열성 딸(X′X′)의 아버지는 반드시 X′Y여야 해요. 아버지가 정상이니 상염색체 유전이에요."}]});

add({id:"l8-2",part:"8. 가계도 분석 비법",no:"8-2",title:"연습: 색맹 가계도 풀기",html:`
<p class="mt0">3단계 비법으로 적록 색맹 가계도를 풀어 봐요. 버튼을 누르면 한 단계씩 진행돼요.</p>
<div class="vis"><svg id="ped2" viewBox="0 0 520 300" role="img" aria-label="적록 색맹 가계도"></svg>

init(box){const N={1:{s:"m",x:140,y:40,f:0},2:{s:"f",x:260,y:40,f:0},3:{s:"m",x:90,y:150,f:1},4:{s:"f",x:290,y:150,f:0},5:{s:"m",x:400,y:150,f:1},6:{s:"m",x:270,y:255,f:0},7:{s:"f",x:345,y:255,f:1},8:{s:"f",x:420,y:255,f:0}};
 const C=[[1,2,[3,4]],[4,5,[6,7,8]]];
 const st=[{h:[],t:"칠한 기호는 <b>적록 색맹</b>이에요. 색맹 유전자는 X 염색체에 있다고 알려져 있어요. 정상 X, 색맹 X′로 쓸게요.",lab:{}},
  {h:[3,5,7],t:"<b>색맹인 사람부터</b>: 남자 3과 5는 <b>X′Y</b>, 여자 7은 <b>X′X′</b>예요.",lab:{3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[1,6],t:"<b>정상 남자</b>: 1과 6은 <b>XY</b>예요(남자는 X가 하나라 정상이면 XY).",lab:{1:"XY",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[2,3],t:"<b>3의 X′는 어디서?</b> 아들은 어머니에게서 X를 받으니 3의 X′는 <b>어머니 2</b>에게서 왔어요. 2는 정상이므로 <b>XX′(보인자)</b>예요.",lab:{1:"XY",2:"XX′",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[4,7],t:"<b>4는?</b> 딸 7(X′X′)은 어머니 4에게서도 X′를 받았어요. 4는 정상이므로 <b>XX′</b>예요.",lab:{1:"XY",2:"XX′",4:"XX′",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[8,5],t:"<b>8은?</b> 딸은 아버지의 X를 반드시 받아요. 아버지 5가 X′Y이므로 8은 X′를 받았고, 정상이므로 <b>XX′</b>예요.",lab:{1:"XY",2:"XX′",4:"XX′",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′",8:"XX′"}}];
 let k=0; const sv=$("#ped2",box);
 const draw=()=>{sv.innerHTML=drawPed(N,C,st[k].h,st[k].lab,[["m",0,"정상 남자"],["m",1,"색맹 남자"],["f",0,"정상 여자"],["f",1,"색맹 여자"]],310); $("#ped2t",box).innerHTML=st[k].t;};
 $("#ped2n",box).onclick=()=>{k=Math.min(st.length-1,k+1); draw();}; $("#ped2p",box).onclick=()=>{k=Math.max(0,k-1); draw();}; draw();},
quiz:[{q:"위 가계도에서 정상이지만 색맹 대립유전자를 가진 사람을 모두 고르면?",o:["2, 4, 8","1, 6","3, 5"],a:0,why:"2, 4, 8은 모두 XX′(보인자)예요. 1과 6은 XY라 X′가 없어요."},
      {q:"4와 5 사이에서 아이가 한 명 더 태어날 때 색맹일 확률은?",o:["25%","50%","100%"],a:1,why:"XX′ × X′Y → XX′, X′X′, XY, X′Y가 각각 1/4이고, 색맹(X′X′, X′Y)은 2/4 = 50%예요."}]});
