<div class="easy"><b class="lbl">쉽게 말하면</b>나무는 그대로 있어요. 그런데 내가 (가)에서 (나)로 자리를 옮기면, 나무가 먼 산을 기준으로 다른 곳에 있는 것처럼 보여요. 두 시선이 나무에서 만나 이루는 <b>각도</b>가 시차예요.</div>`,
init(box){const sv=$("#par1",box), t=$("#partxt",box); let m="none";
 const go=k=>{m=k; parScene(sv,150,k); t.innerHTML={a:"(가)에서 보면 나무가 먼 배경의 <b>오른쪽</b>에 있는 것처럼 보여요.",b:"(나)에서 보면 나무가 먼 배경의 <b>왼쪽</b>에 있는 것처럼 보여요.",both:"두 위치에서 본 시선이 나무에서 만나 이루는 각도(빨간 호)가 <b>시차</b>예요. 나무는 움직이지 않았어요!",none:""}[k];};
 parScene(sv,150,"none"); $("#pa",box).onclick=()=>go("a"); $("#pb",box).onclick=()=>go("b"); $("#pboth",box).onclick=()=>go("both");},
quiz:[{q:"관측자의 위치에 따라 물체의 위치가 배경에 대해 다르게 보이는 각도를 무엇이라고 할까요?",o:["시차","등급","광년"],a:0,why:"이 각도를 시차라고 해요."},
      {q:"엄지손가락 실험에서 엄지가 움직이는 것처럼 보이는 까닭은?",o:["엄지가 실제로 움직여서","보는 눈(관측 위치)이 바뀌어서"],a:1,why:"엄지는 그대로인데 보는 위치(왼쪽 눈, 오른쪽 눈)가 바뀌어서 달라 보여요."}]});

add({id:"s1-2",part:"1. 별까지의 거리",no:"1-2",title:"가까울수록 시차가 커요",html:`
<p class="mt0">밀대를 움직여 나무까지의 거리를 바꿔 보세요. 시차(빨간 각도)가 어떻게 달라질까요?</p>
<div class="vis"><svg id="par2" viewBox="0 0 520 345" role="img" aria-label="거리에 따른 시차 변화"></svg>
<div class="ctrl"><label>가까움 <input type="range" id="pdist" min="85" max="230" value="150" style="width:200px;vertical-align:middle"> 멂</label></div>
<div class="stepbox" id="par2t"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>시차는 관측자와 물체 사이의 거리가 가까워질수록 커지고, 멀어질수록 작아진다. 따라서 시차를 측정하면 물체까지의 거리를 구할 수 있다.</div>
<div class="easy"><b class="lbl">엄지로 확인</b>엄지를 얼굴 가까이 가져오면 왼쪽·오른쪽 눈을 번갈아 감을 때 엄지가 훨씬 크게 움직여 보여요. 팔을 쭉 뻗으면 조금만 움직여요.</div>`,
init(box){const sv=$("#par2",box), r=$("#pdist",box), t=$("#par2t",box);
 const draw=()=>{const d=+r.value; const a=parScene(sv,d,"both"); t.innerHTML=`나무까지의 거리: <b>${d<120?"가까워요":d<180?"보통이에요":"멀어요"}</b> → 시차: 약 <b>${Math.round(a)}°</b> (${d<120?"크다":d<180?"중간":"작다"})`;};
 r.oninput=draw; draw();},
quiz:[{q:"물체까지의 거리가 멀어지면 시차는?",o:["커진다","작아진다","변하지 않는다"],a:1,why:"시차는 거리가 멀수록 작아지고, 가까울수록 커져요."},
      {q:"엄지를 눈 가까이 가져온 뒤 두 눈을 번갈아 감으면, 팔을 뻗었을 때와 비교해 엄지가 움직이는 정도는?",o:["더 크다","더 작다","같다"],a:0,why:"가까울수록 시차가 커서 더 많이 움직이는 것처럼 보여요."}]});

add({id:"s1-3",part:"1. 별까지의 거리",no:"1-3",title:"연주 시차: 지구가 움직이며 별을 봐요",html:`
<p class="mt0">별까지의 거리도 시차로 구해요. 이때 관측 위치를 바꿔 주는 것은 <b>지구의 공전</b>이에요. 지구가 태양 주위를 돌면 가까운 별이 먼 별들을 배경으로 왔다 갔다 하는 것처럼 보여요.</p>
<div class="vis"><svg id="ann" viewBox="0 0 520 420" role="img" aria-label="지구 공전과 연주 시차 애니메이션"></svg>
<div class="ctrl"><button class="btn" id="annplay">▶ 지구 공전시키기</button><button class="btn ghost" id="annT">6개월 간격 비교 (별 T)</button><button class="btn ghost" id="annS">6개월 간격 비교 (별 S)</button></div>
<div class="stepbox" id="anntxt">공전 버튼을 누르고, 천구(위쪽 띠)에서 별 T′와 S′가 움직이는 폭을 비교해 보세요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>지구에서 <b>6 개월 간격</b>으로 관측한 별의 시차의 <b>1/2</b>을 그 별의 <b>연주 시차</b>라고 한다. 연주 시차는 별까지의 거리가 가까울수록 크고, 멀수록 작다.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>① 별이 왔다 갔다 하는 것은 별이 실제로 움직여서가 아니라 <b>지구가 공전</b>하기 때문이에요.<br>② 연주 시차는 6개월 간격 시차를 그대로 쓰는 게 아니라 그 <b>절반(1/2)</b>이에요.</div>`,
init(box){const sv=$("#ann",box), tx=$("#anntxt",box); const C=[260,330], R=62, BG=44, ST={T:[260,220],S:[260,140]};
 let th=Math.PI, playing=false, mode="live";
 const base=bgStars(40,12,14,496,56,3,1.1);
 const app=(E,P)=>E[0]+(P[0]-E[0])*(BG-E[1])/(P[1]-E[1]);
 const draw=()=>{let s=skyRect(520,420)+`<rect x="8" y="10" width="504" height="64" rx="8" fill="#1B2350"/>`+base+txt(20,90,"천구 (아주 먼 별들이 배경)",{a:"start",s:13,c:SKYM});
  s+=`<circle cx="${C[0]}" cy="${C[1]}" r="${R}" fill="none" stroke="${SKYM}" stroke-dasharray="4 5"/>`+starDot(C[0],C[1],13,"#FFC94A",.25)+txt(C[0],C[1]+36,"태양",{s:13});
  // 이동 폭
  ["T","S"].forEach(k=>{const P=ST[k]; const x1=app([C[0]-R,C[1]],P), x2=app([C[0]+R,C[1]],P); s+=`<line x1="${x1}" y1="${BG+22}" x2="${x2}" y2="${BG+22}" stroke="${k==="T"?"#FF9E7A":"#8FD3FF"}" stroke-width="3" opacity=".5"/>`;});
  if(mode==="live"){const E=[C[0]+R*Math.cos(th),C[1]+R*Math.sin(th)];
   ["T","S"].forEach(k=>{const P=ST[k], col=k==="T"?"#FF9E7A":"#8FD3FF", ax=app(E,P);
    s+=`<line x1="${E[0].toFixed(1)}" y1="${E[1].toFixed(1)}" x2="${ax.toFixed(1)}" y2="${BG}" stroke="${col}" stroke-width="1.6" stroke-dasharray="5 4"/>`+starDot(ax,BG,4,col,.3)+txt(ax,BG-10,k+"′",{s:13,c:col,w:700});});
   s+=`<circle cx="${E[0].toFixed(1)}" cy="${E[1].toFixed(1)}" r="8" fill="#4FA3FF" stroke="#fff" stroke-width="1.5"/>`+txt(E[0],E[1]+26,"지구",{s:13});}
  else{const P=ST[mode], col=mode==="T"?"#FF9E7A":"#8FD3FF", E1=[C[0]-R,C[1]], E2=[C[0]+R,C[1]];
   [E1,E2].forEach((E,i)=>{const ax=app(E,P); s+=`<line x1="${E[0]}" y1="${E[1]}" x2="${ax.toFixed(1)}" y2="${BG}" stroke="${col}" stroke-width="1.8"/>`+starDot(ax,BG,4,col,.3)+`<circle cx="${E[0]}" cy="${E[1]}" r="8" fill="#4FA3FF" stroke="#fff" stroke-width="1.5"/>`+txt(E[0]+(i?28:-28),E[1]+5,i?"E₂":"E₁",{s:14,w:700});});
   s+=`<line x1="${P[0]}" y1="${P[1]}" x2="${C[0]}" y2="${C[1]}" stroke="#FFC94A" stroke-width="1.5" stroke-dasharray="4 4"/>`;
   const a1=Math.atan2(E1[1]-P[1],E1[0]-P[0]), a0=Math.PI/2, rr=34; const q=(a)=>[P[0]+rr*Math.cos(a),P[1]+rr*Math.sin(a)];
   const p1=q(a1), p0=q(a0); s+=`<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A${rr} ${rr} 0 0 0 ${p0[0].toFixed(1)} ${p0[1].toFixed(1)}" fill="none" stroke="#FF6B6B" stroke-width="4"/>`+txt(P[0]-70,P[1]+30,"연주 시차",{s:14,c:"#FF8A8A",w:700});}
  ["T","S"].forEach(k=>{const P=ST[k]; s+=starDot(P[0],P[1],6,k==="T"?"#FF9E7A":"#8FD3FF",.3)+txt(P[0]+14,P[1]+5,k==="T"?"별 T (가까움)":"별 S (멂)",{a:"start",s:13});});
  sv.innerHTML=s;};
 draw();
 $("#annplay",box).onclick=()=>{mode="live"; if(playing){playing=false; $("#annplay",box).textContent="▶ 지구 공전시키기"; return;} playing=true; $("#annplay",box).textContent="❚❚ 멈추기";
  tx.innerHTML="지구가 공전하면 가까운 <b>별 T′</b>는 크게, 먼 <b>별 S′</b>는 조금만 왔다 갔다 해요(위쪽 굵은 선이 움직이는 폭).";
  let last=null; loop(sv,t=>{if(!playing||mode!=="live") return false; if(last!==null) th+= (t-last)*0.9; last=t; draw();});};
 const six=k=>{playing=false; $("#annplay",box).textContent="▶ 지구 공전시키기"; mode=k; draw();
  tx.innerHTML=`지구가 E₁에 있을 때와 6개월 뒤 E₂에 있을 때 본 별 ${k}의 시차(∠E₁${k}E₂)의 <b>절반</b>이 연주 시차(빨간 호)예요. 별 ${k==="T"?"T는 가까워서 연주 시차가 <b>커요</b>":"S는 멀어서 연주 시차가 <b>작아요</b>"}.`;};
 $("#annT",box).onclick=()=>six("T"); $("#annS",box).onclick=()=>six("S");},
quiz:[{q:"연주 시차가 생기는 까닭은?",o:["지구가 공전하기 때문","별이 실제로 움직이기 때문","지구가 자전하기 때문"],a:0,why:"별이 움직이는 것이 아니라 지구가 태양 주위를 공전하면서 관측 위치가 바뀌기 때문이에요."},
      {q:"6개월 간격으로 관측한 어떤 별의 시차가 0.2″였어요. 이 별의 연주 시차는?",o:["0.1″","0.2″","0.4″"],a:0,why:"연주 시차는 6개월 간격 시차의 1/2이므로 0.2″ × 1/2 = 0.1″예요."},
      {q:"별 S와 T 중 연주 시차가 더 큰 별은? (S가 T보다 멀다)",o:["S","T"],a:1,why:"연주 시차는 가까운 별일수록 커요. 더 가까운 T의 연주 시차가 더 커요."}]});

add({id:"s1-4",part:"1. 별까지의 거리",no:"1-4",title:"아주 작은 각도와 거리 단위",html:`
<p class="mt0">별은 너무 멀어서 연주 시차가 아주 작아요. 그래서 '도(°)'보다 훨씬 작은 단위인 <b>초(″)</b>를 써요.</p>
<div class="vis"><svg id="ang" viewBox="0 0 520 260" role="img" aria-label="1도를 쪼개는 그림"></svg>
<div class="stepbox" id="angt"></div><div class="ctrl"><button class="btn ghost" id="angp">◀ 이전</button><button class="btn" id="angn">다음 ▶</button></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>
• 각도의 단위: 1°(도) = 60′(분) = 3600″(초)<br>
• 연주 시차가 <b>1″</b>인 별까지의 거리를 <b>1 pc(파섹)</b>이라고 한다.<br>
• 1 광년은 빛이 진공에서 1 년 동안 나아가는 거리이다. 1 pc ≒ 3×10¹³ km ≒ <b>3.26 광년</b></div>`,
init(box){const wedge=(cx,cy,r,a0,a1,fill)=>{const p=a=>[cx+r*Math.cos(a),cy-r*Math.sin(a)]; const [x0,y0]=p(a0),[x1,y1]=p(a1); return `<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 0 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${fill}" stroke="var(--ink)" stroke-width="1"/>`;};
 const fan=(cx,cy,r,a0,a1,n)=>{let s=""; for(let i=1;i<n;i++){const a=a0+(a1-a0)*i/n; s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(a)).toFixed(1)}" y2="${(cy-r*Math.sin(a)).toFixed(1)}" stroke="var(--muted)" stroke-width=".5" stroke-opacity=".45"/>`;} return s;};
 const F=[()=>`<circle cx="150" cy="140" r="100" fill="var(--surface2)" stroke="var(--ink)" stroke-width="1.5"/>`+wedge(150,140,100,0,Math.PI/180*6,"var(--dom)")+`<text x="150" y="252" text-anchor="middle" class="svgtxt" font-size="19">한 바퀴 = 360°</text><text x="270" y="110" class="svgtxt" font-size="20">주황 조각 = 6°</text><text x="270" y="140" class="svgtxt" font-size="20">1°는 이것의 1/6이에요</text>`,
  ()=>wedge(80,230,330,0,Math.PI/180*30,"color-mix(in srgb,var(--dom) 30%,var(--surface))")+fan(80,230,330,0,Math.PI/180*30,60)+wedge(80,230,330,0,Math.PI/180*0.5,"var(--rec)")+`<text x="14" y="40" class="svgtxt" font-size="20">1°를 크게 확대: 60조각 중 하나 = 1′(분)</text><text x="300" y="232" class="svgtxt" font-size="19" fill="var(--rec)">← 1′</text>`,
  ()=>wedge(80,230,330,0,Math.PI/180*30,"color-mix(in srgb,var(--rec) 25%,var(--surface))")+fan(80,230,330,0,Math.PI/180*30,60)+wedge(80,230,330,0,Math.PI/180*0.5,"var(--bad)")+`<text x="14" y="40" class="svgtxt" font-size="20">1′를 크게 확대: 60조각 중 하나 = 1″(초)</text><text x="300" y="232" class="svgtxt" font-size="19" fill="var(--bad)">← 1″</text>`,
  ()=>skyRect(520,260)+starDot(60,130,12,"#FFC94A",.25)+txt(60,166,"태양",{s:13})+`<line x1="60" y1="130" x2="470" y2="130" stroke="${SKYM}" stroke-dasharray="5 5"/>`+starDot(470,130,6,"#fff",.3)+txt(470,160,"별",{s:13})+txt(265,118,"연주 시차가 1″인 별까지의 거리 = 1 pc",{s:15,w:700})+txt(265,200,"1 pc ≒ 3×10¹³ km ≒ 3.26 광년",{s:15,c:"#FFD98A"})];
 const T=["① 원 한 바퀴는 <b>360°</b>예요. 1°도 이미 꽤 작은 각도예요.","② 1°를 60개로 나눈 하나가 <b>1′(분)</b>이에요. 1° = 60′","③ 1′를 다시 60개로 나눈 하나가 <b>1″(초)</b>예요. 1° = 60′ = <b>3600″</b>. 연주 시차는 이렇게 작은 각도예요!","④ 연주 시차가 <b>1″</b>인 별까지의 거리를 <b>1 pc(파섹)</b>이라고 정했어요."];
 stepper(box,F,T,"#ang","#angt","#angn","#angp");},
quiz:[{q:"1°는 몇 ″(초)일까요?",o:["60″","360″","3600″"],a:2,why:"1° = 60′ = 3600″예요."},
      {q:"1 pc(파섹)의 뜻은?",o:["연주 시차가 1″인 별까지의 거리","빛이 1년 동안 가는 거리","지구에서 태양까지의 거리"],a:0,why:"연주 시차가 1″인 별까지의 거리가 1 pc이에요. 빛이 1년 동안 가는 거리는 1 광년이에요."},
      {q:"1 pc은 약 몇 광년일까요?",o:["약 1 광년","약 3.26 광년","약 100 광년"],a:1,why:"1 pc ≒ 3.26 광년이에요."}]});

add({id:"s1-5",part:"1. 별까지의 거리",no:"1-5",title:"연주 시차로 거리 구하기",html:`
<p class="mt0">연주 시차와 거리는 <b>반비례</b>해요. 연주 시차가 1″이면 1 pc, 0.5″이면 2 pc, 0.1″이면 10 pc이에요.</p>
<div class="easy"><b class="lbl">정리</b>별까지의 거리(pc) = 1 ÷ 연주 시차(″)</div>
<div class="vis"><div class="ctrl" style="margin-top:0"><label>연주 시차 <select id="psel"><option>1</option><option>0.5</option><option>0.25</option><option selected>0.2</option><option>0.1</option><option>0.05</option><option>0.02</option><option>0.01</option></select> ″</label></div>
<svg id="pbar" viewBox="0 0 520 150" role="img" aria-label="연주 시차에 따른 거리 막대"></svg><div class="stepbox" id="pout"></div></div>
<div class="easy"><b class="lbl">반비례 쉽게 보기</b>연주 시차가 <b>2배</b>가 되면 거리는 <b>1/2</b>, 연주 시차가 <b>1/2</b>이 되면 거리는 <b>2배</b>예요. 연주 시차가 0.1″인 별은 0.2″인 별보다 2배 멀어요.</div>
<div class="warn"><b class="lbl">이 방법의 한계</b>멀리 있는 별은 연주 시차가 너무 작아 재기 어려워요. 그래서 연주 시차로 거리를 구하는 방법은 <b>비교적 가까이 있는 별</b>에만 쓸 수 있어요. 최근에는 인공위성에서 시차를 더 정밀하게 측정해요.</div>`,
init(box){const s=$("#psel",box), sv=$("#pbar",box), o=$("#pout",box);
 const draw=()=>{const p=+s.value, d=1/p; const W=420*Math.log10(1+d)/Math.log10(101); const ly=d*3.26;
  sv.innerHTML=skyRect(520,150)+starDot(40,70,10,"#FFC94A",.25)+txt(40,104,"태양",{s:12})+`<line x1="40" y1="70" x2="${40+Math.max(W,6)}" y2="70" stroke="${SKYM}" stroke-width="2" stroke-dasharray="5 4"/>`+starDot(40+Math.max(W,6),70,5,"#fff",.3)+
   txt(Math.min(40+Math.max(W,6),440),46,`${+d.toFixed(2)} pc`,{s:15,w:700,c:"#FFD98A"})+txt(260,136,"(먼 거리는 줄여서 그렸어요)",{s:12,c:SKYM});
  o.innerHTML=`거리 = 1 ÷ ${p} = <b>${+d.toFixed(2)} pc</b> (약 ${ly<10?ly.toFixed(1):Math.round(ly)} 광년)`;};
 s.onchange=draw; draw();},
quiz:[{q:"연주 시차가 0.5″인 별까지의 거리는?",o:["0.5 pc","2 pc","5 pc"],a:1,why:"거리 = 1 ÷ 0.5 = 2 pc이에요."},
      {q:"별 A의 연주 시차는 0.2″, 별 B의 연주 시차는 0.1″예요. 어느 별이 몇 배 더 멀리 있을까요?",o:["A가 B보다 2배 멀다","B가 A보다 2배 멀다","두 별의 거리는 같다"],a:1,why:"연주 시차가 작을수록 멀어요. A는 5 pc, B는 10 pc이므로 B가 2배 멀어요."},
      {q:"연주 시차로 아주 먼 별까지의 거리를 구하기 어려운 까닭은?",o:["먼 별은 연주 시차가 너무 작아서","먼 별은 연주 시차가 너무 커서","먼 별은 움직이지 않아서"],a:0,why:"멀리 있는 별은 연주 시차가 매우 작아 측정하기 어려워요."}]});

/* =========== 2. 별의 밝기와 등급 =========== */
add({id:"s2-1",part:"2. 별의 밝기와 등급",no:"2-1",title:"거리가 멀면 왜 어두워질까?",html:`
<p class="mt0">멀리 있는 자동차 전조등은 더 어둡게 보여요. 손전등 실험으로 까닭을 알아봐요.</p>
<div class="vis"><svg id="fl" viewBox="0 0 540 260" role="img" aria-label="손전등 빛이 퍼지는 모습"></svg>
<div class="ctrl"><button class="btn ghost" data-n="1">거리 r</button><button class="btn ghost" data-n="2">거리 2r</button><button class="btn ghost" data-n="3">거리 3r</button></div>
<div id="flgrid" style="margin-top:10px"></div><div class="stepbox" id="flt"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>별에서 나온 빛은 사방으로 퍼지면서 더 넓은 영역을 비추므로 별까지의 거리가 멀어질수록 별의 밝기는 어두워진다. 거리가 2배, 3배 멀어지면 빛이 비치는 면적은 2²배, 3²배로 늘어나고, 단위 면적당 도달하는 빛의 양은 1/2²배, 1/3²배로 줄어든다. 따라서 <b>별의 밝기는 거리의 제곱에 반비례</b>한다.</div>
<div class="easy"><b class="lbl">비유</b>같은 양의 버터를 작은 빵 1개에 바르면 두껍게, 빵 4개에 나눠 바르면 한 개에는 얇게 발라지죠? 빛도 같아요. 빛의 양은 그대로인데 넓은 곳에 나눠지니까 한 칸은 어두워져요.</div>`,
init(box){const sv=$("#fl",box), gr=$("#flgrid",box), t=$("#flt",box); let cur=1;
 const draw=n=>{const x=60+150*n, h=30*n; sv.innerHTML=`<rect width="540" height="260" rx="12" fill="var(--surface)"/>
  <rect x="14" y="110" width="36" height="30" rx="5" fill="var(--muted)"/><rect x="50" y="105" width="10" height="40" rx="3" fill="var(--ink)"/>
  <path d="M60 125 L${x} ${125-h} L${x} ${125+h} Z" fill="#FFD54A" opacity=".35"/>
  ${[1,2,3].map(k=>`<line x1="${60+150*k}" y1="${125-30*k}" x2="${60+150*k}" y2="${125+30*k}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/><text x="${60+150*k}" y="${125+30*k+24}" text-anchor="middle" class="svgtxt" font-size="19">${k===1?"r":k+"r"}</text>`).join("")}
  <line x1="${x}" y1="${125-h}" x2="${x}" y2="${125+h}" stroke="var(--ink)" stroke-width="4"/><text x="34" y="92" text-anchor="middle" class="svgtxt" font-size="18">손전등</text>`;
  gr.innerHTML=`<div style="font-size:14px;margin-bottom:6px">종이에 비친 모습 (한 칸 크기는 같아요)</div><div style="display:inline-grid;grid-template-columns:repeat(${n},30px);gap:2px">${Array(n*n).fill(0).map(()=>`<div class="fade-in" style="width:30px;height:30px;border:1px solid var(--line);background:rgba(255,205,60,${(1/(n*n)).toFixed(3)})"></div>`).join("")}</div>`;
  t.innerHTML=`거리 ${n===1?"r":n+"r"} → 빛이 비치는 칸 수 <b>${n*n}칸</b> (${n}²) → 한 칸의 밝기 <b>${n===1?"1":"1/"+n*n}</b> (1/${n}²)`;
  sv.querySelectorAll("path").forEach(p=>p.classList.add("fade-in"));};
 box.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{cur=+b.dataset.n; draw(cur);}); draw(1);},
quiz:[{q:"손전등과 종이 사이의 거리가 2배가 되면 빛이 비치는 면적은?",o:["2배","4배","8배"],a:1,why:"면적은 거리의 제곱(2² = 4)배로 늘어나요."},
      {q:"별까지의 거리가 2배가 되면 별의 밝기는?",o:["1/2배","1/4배","2배"],a:1,why:"밝기는 거리의 제곱에 반비례하므로 1/2² = 1/4배예요."}]});

add({id:"s2-2",part:"2. 별의 밝기와 등급",no:"2-2",title:"밝기 계산 연습",html:`
<p class="mt0">실제 밝기가 같은 별을 점점 멀리 옮겨 볼게요. 거리 버튼을 눌러 보세요.</p>
<div class="vis"><svg id="bri" viewBox="0 0 520 170" role="img" aria-label="거리에 따른 별의 밝기"></svg>
<div class="ctrl">${[1,2,3,4,5].map(n=>`<button class="btn ghost" data-d="${n}">${n}배 거리</button>`).join("")}</div><div class="stepbox" id="brit"></div></div>
<div class="tablewrap"><table class="t"><tr><th>거리</th><td>1배</td><td>2배</td><td>3배</td><td>4배</td><td>5배</td></tr><tr><th>밝기</th><td>1</td><td>1/4</td><td>1/9</td><td>1/16</td><td>1/25</td></tr></table></div>
<div class="easy"><b class="lbl">거꾸로 생각하기</b>밝기가 1/16이 되었다면? 16 = 4² 이니까 거리는 <b>4배</b> 멀어진 거예요. 밝기가 4배 밝아졌다면 거리는 <b>1/2</b>로 가까워진 거예요.</div>`,
init(box){const sv=$("#bri",box), t=$("#brit",box);
 const draw=n=>{const b=1/(n*n); const x=60+(n-1)*95; sv.innerHTML=skyRect(520,170)+`<circle cx="30" cy="85" r="10" fill="#4FA3FF"/>`+txt(30,118,"지구",{s:12})+`<line x1="44" y1="85" x2="${x}" y2="85" stroke="${SKYM}" stroke-dasharray="4 5"/>`+
  `<g class="fade-in"><circle cx="${x+30}" cy="85" r="${(26*Math.sqrt(b)+4).toFixed(1)}" fill="#FFE9A8" opacity="${(0.15+0.25*b).toFixed(2)}"/><circle cx="${x+30}" cy="85" r="7" fill="#FFF2C6" opacity="${(0.25+0.75*b).toFixed(2)}"/></g>`+txt(x+30,140,`${n}배 거리`,{s:13});
  t.innerHTML=`거리 <b>${n}배</b> → 밝기 1/${n}² = <b>${n===1?"1":"1/"+n*n}</b>배`;};
 box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>draw(+b.dataset.d)); draw(1);},
quiz:[{q:"실제 밝기가 같은 별 A, B가 있어요. A가 B보다 3배 멀리 있으면, A의 밝기는 B의 몇 배로 보일까요?",o:["1/3배","1/9배","3배"],a:1,why:"밝기는 거리의 제곱에 반비례하므로 1/3² = 1/9배예요."},
      {q:"어떤 별이 지구에서 멀어져 밝기가 1/16로 어두워졌어요. 거리는 몇 배가 되었을까요?",o:["4배","8배","16배"],a:0,why:"1/16 = 1/4²이므로 거리는 4배가 되었어요."}]});

add({id:"s2-3",part:"2. 별의 밝기와 등급",no:"2-3",title:"별의 등급: 숫자가 작을수록 밝아요",html:`
<p class="mt0">고대 그리스의 과학자 <b>히파르코스</b>는 맨눈으로 본 별들을 밝기에 따라 나누었어요. <b>가장 밝게 보이는 별을 1 등급</b>, <b>가장 어둡게 보이는 별을 6 등급</b>으로 정했어요.</p>
<div class="vis"><svg id="lad" viewBox="0 0 520 170" role="img" aria-label="1등급에서 6등급까지 별의 밝기"></svg><div class="cap">별을 눌러 보세요.</div><div class="stepbox" id="ladt">1 등급 별이 가장 밝게, 6 등급 별이 가장 어둡게 보여요. (그림에서는 밝기를 점의 크기로 나타냈어요.)</div></div>
<div class="warn"><b class="lbl">자주 하는 실수</b>등급의 <b>숫자가 클수록 어두운 별</b>이에요. 1 등급 별이 6 등급 별보다 밝아요. '1등'이 가장 밝다고 기억하세요!</div>`,
init(box){const sv=$("#lad",box); let s=skyRect(520,170)+bgStars(20,0,0,520,170,11,0.7);
 for(let m=1;m<=6;m++){const x=50+(m-1)*84; s+=`<g data-m="${m}" style="cursor:pointer"><circle cx="${x}" cy="75" r="${(magR(m)*2.4).toFixed(1)}" fill="#FFF2C6" opacity=".18"><animate attributeName="opacity" values=".12;.3;.12" dur="${2+m*0.3}s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="75" r="${magR(m).toFixed(1)}" fill="#FFF2C6" opacity="${(1-0.12*(m-1)).toFixed(2)}"/><rect x="${x-34}" y="30" width="68" height="100" fill="transparent"/>`+txt(x,140,m+" 등급",{s:15,w:700})+`</g>`;}
 s+=`<line x1="60" y1="158" x2="460" y2="158" stroke="${SKYM}" stroke-width="1.5"/>`+txt(50,163,"밝다",{s:12,a:"end",c:SKYM})+txt(470,163,"어둡다",{s:12,a:"start",c:SKYM});
 sv.innerHTML=s; sv.querySelectorAll("[data-m]").forEach(g=>g.onclick=()=>{const m=+g.dataset.m; $("#ladt",box).innerHTML=`<b>${m} 등급</b>: ${m===1?"맨눈으로 볼 때 가장 밝게 보이는 별들":m===6?"맨눈으로 겨우 보이는 가장 어두운 별들":"숫자가 "+(m)+"이니 "+(m-1)+" 등급보다 어둡고 "+(m+1)+" 등급보다 밝아요"}.`;});},
quiz:[{q:"히파르코스가 맨눈으로 볼 때 가장 밝게 보이는 별들에게 붙인 등급은?",o:["1 등급","6 등급","0 등급"],a:0,why:"가장 밝게 보이는 별을 1 등급, 가장 어둡게 보이는 별을 6 등급으로 정했어요."},
      {q:"3 등급 별과 5 등급 별 중 더 밝게 보이는 별은?",o:["3 등급 별","5 등급 별"],a:0,why:"등급 숫자가 작을수록 밝아요."}]});

add({id:"s2-4",part:"2. 별의 밝기와 등급",no:"2-4",title:"1 등급 차이 = 약 2.5배",html:`
<p class="mt0">과학자들은 <b>1 등급 별이 6 등급 별보다 100배 밝다</b>는 것을 알아냈어요. 1 등급과 6 등급은 5 등급 차이이고, 등급 사이의 밝기 차이가 일정하므로 <b>1 등급 차이마다 약 2.5배</b>씩 밝기가 달라요.</p>
<div class="vis"><div style="font-size:14px">밝은 별 등급 고르기</div><div class="ctrl" id="ma" style="margin-top:4px"></div><div style="font-size:14px;margin-top:8px">어두운 별 등급 고르기</div><div class="ctrl" id="mb" style="margin-top:4px"></div>
<svg id="hop" viewBox="0 0 520 150" role="img" aria-label="등급 차와 밝기 차"></svg><div class="stepbox" id="hopt"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>1 등급은 6 등급보다 100 배 밝으며, 1 등급 차이마다 밝기는 약 2.5 배의 차이가 있다. 등급 값이 작을수록 밝은 별이다.</div>
<div class="easy"><b class="lbl">시험에 자주 나오는 것</b>• 1 등급 차이 → 약 2.5배<br>• 5 등급 차이 → <b>100배</b> (2 등급과 7 등급, 0 등급과 5 등급도 100배!)<br>• 10 등급 차이 → 100 × 100 = 10000배</div>`,
init(box){let A=1,B=6; const ma=$("#ma",box), mb=$("#mb",box), sv=$("#hop",box), t=$("#hopt",box);
 const R={0:"같아요",1:"약 2.5배",2:"약 6.3배 (2.5 × 2.5)",3:"약 16배 (2.5 × 2.5 × 2.5)",4:"약 40배",5:"100배"};
 const draw=()=>{ma.querySelectorAll("button").forEach(b=>b.className="btn "+(+b.dataset.v===A?"":"ghost")); mb.querySelectorAll("button").forEach(b=>b.className="btn "+(+b.dataset.v===B?"":"ghost"));
  let s=skyRect(520,150); for(let m=1;m<=6;m++){const x=50+(m-1)*84; const on=m===A||m===B; s+=`<circle cx="${x}" cy="100" r="${magR(m).toFixed(1)}" fill="#FFF2C6" opacity="${on?1:.3}"/>`+txt(x,138,m+"",{s:14,w:on?700:400,c:on?SKYI:SKYM});}
  const d=B-A; for(let k=0;k<d;k++){const x1=50+(A-1+k)*84, x2=x1+84; s+=`<path d="M${x1} 80 Q${(x1+x2)/2} 30 ${x2} 80" fill="none" stroke="#FFD98A" stroke-width="2" class="fade-in" style="animation-delay:${k*.25}s"/>`+`<g class="fade-in" style="animation-delay:${k*.25}s">${txt((x1+x2)/2,44,"×2.5",{s:13,c:"#FFD98A"})}</g>`;}
  sv.innerHTML=s; t.innerHTML=d<=0?"밝은 별 등급이 어두운 별 등급보다 작게 골라 보세요.":`${A} 등급과 ${B} 등급: <b>${d} 등급</b> 차이 → ${A} 등급 별이 <b>${R[d]}</b> 밝아요.`;};
 for(let m=1;m<=6;m++){const a=el(`<button data-v="${m}">${m}</button>`); a.onclick=()=>{A=m; draw();}; ma.appendChild(a); const b=el(`<button data-v="${m}">${m}</button>`); b.onclick=()=>{B=m; draw();}; mb.appendChild(b);} draw();},
quiz:[{q:"1 등급 별은 6 등급 별보다 몇 배 밝을까요?",o:["약 2.5배","5배","100배"],a:2,why:"1 등급과 6 등급은 5 등급 차이이고, 5 등급 차이는 100배예요."},
      {q:"등급이 1 차이 날 때 밝기 차이는?",o:["약 2.5배","2배","10배"],a:0,why:"1 등급 차이마다 약 2.5배의 밝기 차이가 있어요."},
      {q:"2 등급 별과 7 등급 별의 밝기 차이는?",o:["약 2.5배","100배","5배"],a:1,why:"7 − 2 = 5 등급 차이이므로 100배예요."}]});

add({id:"s2-5",part:"2. 별의 밝기와 등급",no:"2-5",title:"0 등급, 음수 등급도 있어요",html:`
<p class="mt0">관측 기술이 발달하면서 등급의 범위가 넓어졌어요. 1 등급보다 밝은 별은 <b>0, −1, −2, …</b> 등급으로, 6 등급보다 어두운 별은 <b>7, 8, 9, …</b> 등급으로 나타내요.</p>
<div class="vis"><svg id="nl" viewBox="0 0 520 196" role="img" aria-label="등급 수직선"></svg><div class="ctrl" id="nlb"></div><div class="stepbox" id="nlt">별 이름을 눌러 보세요.</div></div>
<div class="easy"><b class="lbl">수직선으로 기억하기</b>왼쪽(숫자가 작은 쪽, 음수)으로 갈수록 밝게 보이고, 오른쪽(숫자가 큰 쪽)으로 갈수록 어둡게 보여요. 태양은 −26.8 등급으로 엄청 밝게 보여요.</div>`,
init(box){const sv=$("#nl",box); const ST=[["태양",-26.8],["시리우스",-1.5],["베텔게우스",0.5],["데네브",1.3],["북극성",2.1]];
 const X=m=>m<-5?40:100+(m+2)*40;
 const draw=sel=>{let s=skyRect(520,196)+`<line x1="80" y1="120" x2="500" y2="120" stroke="${SKYM}" stroke-width="2"/><line x1="30" y1="120" x2="56" y2="120" stroke="${SKYM}" stroke-width="2"/>`+txt(68,126,"≈",{s:18,c:SKYM});
  for(let m=-2;m<=8;m++) s+=`<line x1="${X(m)}" y1="114" x2="${X(m)}" y2="126" stroke="${SKYM}"/>`+txt(X(m),144,m,{s:12,c:SKYM});
  s+=`<rect x="${X(6)+8}" y="100" width="${X(8)-X(6)}" height="40" fill="#fff" opacity=".06"/>`+txt((X(6)+X(8))/2+4,74,"6보다 어두우면",{s:12,c:SKYM})+txt((X(6)+X(8))/2+4,92,"맨눈으로 어려움",{s:12,c:SKYM})+txt(40,144,"−26.8",{s:12,c:SKYM});
  ST.forEach(([n,m],i)=>{const on=sel===i; const y=on?70:88; s+=`<g>${starDot(X(m),y,magR(m)*.7,on?"#FFD98A":"#FFF2C6",on?.35:.15)}${on?txt(Math.max(X(m),70),y-22,n+" "+m,{s:14,w:700,c:"#FFD98A",a:X(m)<70?"start":"middle"}).replace(`x="${Math.max(X(m),70)}"`,`x="${X(m)<70?14:X(m)}"`):""}<line x1="${X(m)}" y1="${y+8}" x2="${X(m)}" y2="114" stroke="${on?"#FFD98A":SKYM}" stroke-width="${on?2:1}" opacity="${on?1:.5}"/></g>`;});
  s+=txt(120,180,"← 밝게 보임",{s:13,c:"#FFD98A"})+txt(420,180,"어둡게 보임 →",{s:13,c:SKYM}); sv.innerHTML=s;};
 const nb=$("#nlb",box); ST.forEach(([n,m],i)=>{const b=el(`<button class="btn ghost">${n}</button>`); b.onclick=()=>{draw(i); $("#nlt",box).innerHTML=`<b>${n}</b>의 겉보기 등급은 <b>${m}</b>이에요.`+(i?` 태양(−26.8)보다 숫자가 크니 태양보다 어둡게 보여요.`:` 가장 작은 숫자라 우리 눈에 가장 밝게 보여요.`);}; nb.appendChild(b);}); draw(-1);},
quiz:[{q:"태양(−26.8 등급)과 북극성(2.1 등급) 중 우리 눈에 더 밝게 보이는 것은?",o:["태양","북극성"],a:0,why:"등급 숫자가 작을수록 밝아요. −26.8이 2.1보다 작아요."},
      {q:"1 등급보다 밝은 별의 등급은 어떻게 나타낼까요?",o:["0, −1, −2, … 등급","7, 8, 9, … 등급"],a:0,why:"1 등급보다 밝으면 0 등급, 음수 등급으로 나타내요."}]});

add({id:"s2-6",part:"2. 별의 밝기와 등급",no:"2-6",title:"겉보기 등급과 절대 등급",html:`
<p class="mt0">눈에 보이는 밝기만으로는 별의 <b>실제 밝기</b>를 비교할 수 없어요. 가까이 있으면 실제로 어두운 별도 밝게 보이니까요. 그래서 모든 별을 <b>같은 거리(10 pc)</b>에 놓고 비교해요.</p>
<div class="book"><b class="lbl">교과서 말로는</b>
<b>겉보기 등급</b>: 우리 눈에 보이는 별의 밝기를 기준으로 정한 등급<br>
<b>절대 등급</b>: 별이 <b>10 pc</b> 거리에 있다고 가정했을 때, 별의 밝기를 등급으로 나타낸 것</div>
<div class="vis"><svg id="abs" viewBox="0 0 520 230" role="img" aria-label="별을 10 pc로 옮기는 애니메이션"></svg><div class="ctrl" id="absb"></div><div class="stepbox" id="abst">별을 골라 10 pc 거리로 옮겨 보세요.</div></div>
<div class="easy"><b class="lbl">비유</b>키를 비교할 때는 모두 같은 바닥에 세워야 하죠? 별의 실제 밝기도 모두 <b>10 pc라는 같은 출발선</b>에 세우고 비교하는 거예요.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>별이 지구에서 멀어지거나 가까워지면 <b>겉보기 등급만 변하고, 절대 등급은 변하지 않아요.</b> 절대 등급은 별의 실제 밝기를 나타내는 등급이라서 거리에 따라 변하지 않아요.</div>`,
init(box){const sv=$("#abs",box); const ST=[["태양",-26.8,4.8,70],["시리우스",-1.5,1.4,160],["북극성",2.1,-3.7,420],["베텔게우스",0.5,-5.1,370],["데네브",1.3,-8.7,480]];
 const X10=270;
 const scene=(x,m,name,lab)=>{let s=skyRect(520,230)+bgStars(30,0,0,520,230,21,0.8)+`<circle cx="30" cy="120" r="10" fill="#4FA3FF"/>`+txt(30,150,"지구",{s:12})+`<line x1="${X10}" y1="30" x2="${X10}" y2="200" stroke="#7FE0A8" stroke-width="2" stroke-dasharray="6 5"/>`+txt(X10,222,"10 pc",{s:14,w:700,c:"#7FE0A8"});
  if(name){s+=starDot(x,120,Math.min(magR(m),14),"#FFF2C6",.2)+txt(x,92,name,{s:14,w:700})+txt(x,170,lab,{s:13,c:"#FFD98A"});} return s;};
 sv.innerHTML=scene(0,0,"","");
 const nb=$("#absb",box); ST.forEach(([n,m,M,x])=>{const b=el(`<button class="btn ghost">${n}</button>`); b.onclick=()=>{
   tween(sv,1.4,e=>{const xx=x+(X10-x)*e, mm=m+(M-m)*e; sv.innerHTML=scene(xx,mm,n,`${e<1?"겉보기 등급":"절대 등급"} ${mm.toFixed(1)}`);});
   const near=x<X10; $("#abst",box).innerHTML=`<b>${n}</b>: 겉보기 등급 <b>${m}</b> → 10 pc로 옮기면 <b>절대 등급 ${M}</b>. ${near?"10 pc보다 <b>가까이</b> 있던 별이라 멀리 옮기니 <b>어두워졌어요</b>(숫자가 커짐).":"10 pc보다 <b>멀리</b> 있던 별이라 가까이 옮기니 <b>밝아졌어요</b>(숫자가 작아짐)."}`+(n==="태양"?" 태양은 실제로는 비교적 어두운 별이에요!":"");}; nb.appendChild(b);});},
quiz:[{q:"절대 등급은 별이 몇 pc 거리에 있다고 가정한 밝기일까요?",o:["1 pc","10 pc","100 pc"],a:1,why:"절대 등급은 별이 10 pc 거리에 있다고 가정했을 때의 밝기예요."},
      {q:"태양(절대 등급 4.8)과 북극성(절대 등급 −3.7) 중 실제로 더 밝은 별은?",o:["태양","북극성"],a:1,why:"실제 밝기는 절대 등급으로 비교해요. −3.7이 4.8보다 작으므로 북극성이 실제로 더 밝아요."},
      {q:"어떤 별이 지구에서 점점 멀어지면?",o:["겉보기 등급은 커지고 절대 등급은 변하지 않는다","겉보기 등급과 절대 등급이 모두 커진다","겉보기 등급은 작아지고 절대 등급은 커진다"],a:0,why:"멀어지면 어둡게 보이니 겉보기 등급 숫자가 커지고, 실제 밝기인 절대 등급은 그대로예요."}]});

add({id:"s2-7",part:"2. 별의 밝기와 등급",no:"2-7",title:"두 등급으로 거리 알아내기",html:`
<p class="mt0">겉보기 등급과 절대 등급을 비교하면 별이 10 pc보다 가까운지 먼지 알 수 있어요. 아래에서 두 등급을 바꿔 보세요.</p>
<div class="vis"><div class="ctrl" style="margin-top:0"><span>겉보기 등급</span><button class="btn ghost" id="mminus">−</button><b id="mv" style="min-width:30px;font-family:var(--mono)"></b><button class="btn ghost" id="mplus">+</button>
<span style="margin-left:10px">절대 등급</span><button class="btn ghost" id="Mminus">−</button><b id="Mv" style="min-width:30px;font-family:var(--mono)"></b><button class="btn ghost" id="Mplus">+</button></div>
<svg id="cmp" viewBox="0 0 520 150" role="img" aria-label="별의 위치 판단"></svg><div class="stepbox" id="cmpt"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>겉보기 등급이 절대 등급보다 <b>작은</b> 별은 10 pc보다 <b>가까운</b> 거리에 있고, 겉보기 등급이 절대 등급보다 <b>큰</b> 별은 10 pc보다 <b>먼</b> 거리에 있다. 또, 겉보기 등급과 절대 등급이 <b>같은</b> 별은 <b>10 pc</b> 거리에 있다.</div>
<div class="easy"><b class="lbl">외우는 요령</b>'겉보기 − 절대'를 계산해요.<br>• 음수(−) → 10 pc보다 가까움 (10 pc에 있을 때보다 밝게 보이니까 10 pc보다 가까이 있는 것)<br>• 0 → 딱 10 pc<br>• 양수(+) → 10 pc보다 멂. 값이 클수록 더 멀어요.</div>`,
init(box){let m=1,M=3; const sv=$("#cmp",box), t=$("#cmpt",box);
 const draw=()=>{$("#mv",box).textContent=m; $("#Mv",box).textContent=M; const d=m-M; const x=d<0?Math.max(80,270+d*30):d===0?270:Math.min(480,270+d*30);
  sv.innerHTML=skyRect(520,150)+`<circle cx="30" cy="75" r="10" fill="#4FA3FF"/>`+txt(30,105,"지구",{s:12})+`<line x1="270" y1="20" x2="270" y2="130" stroke="#7FE0A8" stroke-width="2" stroke-dasharray="6 5"/>`+txt(270,146,"10 pc",{s:13,w:700,c:"#7FE0A8"})+
   `<g class="fade-in">${starDot(x,75,7,"#FFF2C6",.25)}</g>`+txt(150,26,"10 pc보다 가까움",{s:12,c:SKYM})+txt(400,26,"10 pc보다 멂",{s:12,c:SKYM});
  t.innerHTML=`겉보기 − 절대 = ${m} − (${M}) = <b>${d}</b> → ${d<0?"10 pc보다 <b>가까이</b> 있어요.":d===0?"<b>10 pc</b> 거리에 있어요.":"10 pc보다 <b>멀리</b> 있어요."}`;};
 $("#mminus",box).onclick=()=>{m=Math.max(-5,m-1); draw();}; $("#mplus",box).onclick=()=>{m=Math.min(10,m+1); draw();}; $("#Mminus",box).onclick=()=>{M=Math.max(-8,M-1); draw();}; $("#Mplus",box).onclick=()=>{M=Math.min(10,M+1); draw();}; draw();},
quiz:[{q:"겉보기 등급 1, 절대 등급 3인 별은 어디에 있을까요?",o:["10 pc보다 가까이","10 pc","10 pc보다 멀리"],a:0,why:"겉보기 등급(1)이 절대 등급(3)보다 작으므로 10 pc보다 가까이 있어요."},
      {q:"겉보기 등급과 절대 등급이 모두 4인 별까지의 거리는?",o:["1 pc","10 pc","알 수 없다"],a:1,why:"두 등급이 같으면 10 pc 거리에 있어요."},
      {q:"겉보기 등급 5, 절대 등급 −1인 별은?",o:["10 pc보다 가까이 있다","10 pc보다 멀리 있다"],a:1,why:"겉보기 등급이 절대 등급보다 크므로 10 pc보다 멀리 있어요."}]});

add({id:"s2-8",part:"2. 별의 밝기와 등급",no:"2-8",title:"등급 표 문제 풀기",html:`
<p class="mt0">교과서 대단원 마무리에 나오는 표로 연습해요. 버튼을 눌러 정답과 풀이를 확인하세요.</p>
<div class="tablewrap"><table class="t"><tr><th>구분</th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><th>겉보기 등급</th><td>2</td><td>5</td><td>3</td><td>1</td></tr><tr><th>절대 등급</th><td>−2</td><td>2</td><td>3</td><td>6</td></tr><tr id="diffrow" style="display:none"><th>겉보기 − 절대</th><td>4</td><td>3</td><td>0</td><td>−5</td></tr></table></div>
<div class="vis" style="text-align:left"><div id="tq"></div><div class="ctrl"><button class="btn ghost" id="showdiff">'겉보기 − 절대' 줄 보이기</button></div></div>
<div class="easy"><b class="lbl">무엇으로 비교할까?</b>
• 맨눈으로 볼 때 밝게 보이는 별 → <b>겉보기 등급</b>이 작은 별<br>
• 실제로 밝은 별 → <b>절대 등급</b>이 작은 별<br>
• 멀리 있는 별 → <b>겉보기 − 절대</b>가 큰 별</div>`,
init(box){const Q=[["맨눈으로 볼 때 가장 밝게 보이는 별은?","D","겉보기 등급이 가장 작은(1) 별 D예요."],["실제로 가장 밝은 별은?","A","절대 등급이 가장 작은(−2) 별 A예요."],["10 pc 거리에 있는 별은?","C","겉보기 등급과 절대 등급이 같은(3) 별 C예요."],["10 pc보다 가까이 있는 별은?","D","겉보기 등급(1)이 절대 등급(6)보다 작은 별 D예요."],["가장 멀리 있는 별은?","A","'겉보기 − 절대'가 가장 큰(4) 별 A예요."]];
 const w=$("#tq",box); Q.forEach(([q,a,why],i)=>{const d=el(`<div style="margin:8px 0"><b>${i+1}. ${q}</b> <button class="btn ghost" style="padding:4px 12px">정답 보기</button><div class="fb" style="display:none"></div></div>`);
  d.querySelector("button").onclick=()=>{const f=d.querySelector(".fb"); f.style.display="block"; f.classList.add("fade-in"); f.innerHTML=`정답: <b>${a}</b> — ${why}`;}; w.appendChild(d);});
 $("#showdiff",box).onclick=()=>{$("#diffrow",box).style.display="table-row";};},
quiz:[{q:"위 표에서 별 B는 어디에 있을까요?",o:["10 pc보다 가까이","10 pc","10 pc보다 멀리"],a:2,why:"겉보기 등급(5)이 절대 등급(2)보다 크므로 10 pc보다 멀리 있어요."},
      {q:"위 표에서 별 D에 대한 설명으로 옳은 것은?",o:["맨눈으로 가장 밝게 보이지만 실제 밝기는 가장 어둡다","실제로 가장 밝은 별이다","10 pc 거리에 있다"],a:0,why:"D는 겉보기 등급이 가장 작아 가장 밝게 보이지만, 절대 등급이 6으로 가장 커서 실제로는 가장 어두워요. 가까이 있어서 밝게 보이는 거예요."}]});

/* =========== 3. 색깔과 표면 온도 =========== */
add({id:"s3-1",part:"3. 별의 색깔과 표면 온도",no:"3-1",title:"뜨거울수록 색이 바뀌어요",html:`
<p class="mt0">제철소 용광로에서 갓 나온 쇳물은 흰색을 띠지만, 식어 갈수록 노란색, 붉은색, 검붉은색으로 변해요. 물체의 색깔은 <b>온도</b>에 따라 달라져요.</p>
<div class="vis"><svg id="iron" viewBox="0 0 520 170" role="img" aria-label="쇳물의 온도와 색깔"></svg>
<div class="ctrl"><label>식은 쇠 <input type="range" id="irt" min="0" max="3" value="3" style="width:200px;vertical-align:middle"> 뜨거운 쇳물</label></div><div class="stepbox" id="irtx"></div></div>
<div class="easy"><b class="lbl">핵심</b>온도가 <b>높을수록</b> 흰색·푸른색 쪽, 온도가 <b>낮을수록</b> 붉은색 쪽으로 보여요. 가스레인지의 푸른 불꽃이 양초의 노란 불꽃보다 온도가 높은 것처럼, 색깔로 온도를 짐작할 수 있어요.</div>`,
init(box){const sv=$("#iron",box), r=$("#irt",box); const C=[["#5A1A12","검붉은색","식어 가는 쇠예요. 온도가 가장 낮아요."],["#C0301E","붉은색","온도가 조금 높아졌어요."],["#F2B33D","노란색","더 뜨거워요."],["#FFF6E0","흰색","갓 나온 쇳물! 온도가 가장 높아요."]];
 const draw=()=>{const k=+r.value, c=C[k]; sv.innerHTML=`<rect width="520" height="170" rx="12" fill="#1C1C22"/><defs><filter id="glw" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${4+k*4}"/></filter></defs>
  <rect x="120" y="60" width="280" height="50" rx="12" fill="${c[0]}" filter="url(#glw)" opacity="${0.4+k*0.15}"/><rect x="130" y="65" width="260" height="40" rx="10" fill="${c[0]}"/>`+txt(260,145,c[1],{s:17,w:700,c:"#fff"});
  $("#irtx",box).innerHTML=`<b>${c[1]}</b>: ${c[2]}`;};
 r.oninput=draw; draw();},
quiz:[{q:"쇳물이 식어 갈 때 색깔 변화로 옳은 것은?",o:["흰색 → 노란색 → 붉은색","붉은색 → 노란색 → 흰색","색깔은 변하지 않는다"],a:0,why:"온도가 낮아질수록 흰색에서 노란색, 붉은색, 검붉은색으로 변해요."}]});

add({id:"s3-2",part:"3. 별의 색깔과 표면 온도",no:"3-2",title:"별의 색깔로 표면 온도 알기",html:`
<p class="mt0">별의 색깔이 다양한 까닭은 별의 <b>표면 온도</b>가 다르기 때문이에요. 밀대를 움직여 별의 표면 온도를 바꿔 보세요.</p>
<div class="vis"><svg id="sc" viewBox="0 0 520 240" role="img" aria-label="별의 색깔과 표면 온도"></svg>
<div class="ctrl"><label>낮다 <input type="range" id="sct" min="0" max="6" value="2" style="width:220px;vertical-align:middle"> 높다</label></div><div class="stepbox" id="sctx"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>별은 표면 온도에 따라 청색, 백색, 황색, 적색 등 다양한 색깔을 띤다. 온도가 매우 높은 별에서는 주로 청색의 빛이 방출되고, 온도가 매우 낮은 별에서는 주로 적색의 빛이 방출된다. 따라서 <b>별의 색깔을 관측하면 별의 표면 온도를 알 수 있다.</b></div>
<div class="easy"><b class="lbl">순서 외우기 (온도 높은 순)</b><b>청색 → 청백색 → 백색 → 황백색 → 황색 → 주황색 → 적색</b><br>예: 태양(황색)은 베텔게우스(적색)보다 표면 온도가 높고, 리겔(청백색)보다 표면 온도가 낮아요.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>생활에서는 '빨간색 = 뜨거움, 파란색 = 차가움'이라고 표시하지만, 별은 <b>반대</b>예요. <b>청색 별의 표면 온도가 가장 높고, 적색 별의 표면 온도가 가장 낮아요.</b></div>`,
init(box){const sv=$("#sc",box), r=$("#sct",box);
 const C=[["#FF6B4A","적색","베텔게우스, 안타레스"],["#FFA04A","주황색","아르크투루스, 알데바란"],["#FFD84A","황색","태양, 카펠라"],["#FFF0B0","황백색","프로키온, 북극성"],["#FFFFFF","백색","견우성(알타이르), 직녀성(베가)"],["#CFE0FF","청백색","스피카, 리겔"],["#8FB4FF","청색","나오스"]];
 const draw=()=>{const k=+r.value, c=C[k]; let s=skyRect(520,240)+bgStars(30,0,0,520,240,31,0.8)+`<g><circle cx="150" cy="105" r="70" fill="${c[0]}" opacity=".15"><animate attributeName="r" values="62;74;62" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="150" cy="105" r="44" fill="${c[0]}"/></g>`;
  s+=`<rect x="300" y="40" width="22" height="160" rx="11" fill="#2A3366"/>`; C.forEach((x,i)=>{s+=`<rect x="303" y="${183-i*22}" width="16" height="18" rx="4" fill="${x[0]}" opacity="${i===k?1:.45}"/>`;});
  s+=`<polygon points="330,${192-k*22} 342,${186-k*22} 342,${198-k*22}" fill="#fff"/>`+txt(352,196-k*22,c[1],{a:"start",s:16,w:700})+txt(311,30,"높다",{s:12,c:SKYM})+txt(311,222,"낮다",{s:12,c:SKYM})+txt(150,200,"예: "+c[2],{s:13,c:SKYI});
  sv.innerHTML=s; $("#sctx",box).innerHTML=`<b>${c[1]}</b> 별 — 표면 온도가 ${k===0?"가장 낮아요":k===6?"가장 높아요":"7가지 중 "+(7-k)+"번째로 높아요"}. 예: ${c[2]}`;};
 r.oninput=draw; draw();},
quiz:[{q:"적색 별과 청색 별 중 표면 온도가 더 높은 별은?",o:["적색 별","청색 별"],a:1,why:"온도가 매우 높은 별은 주로 청색 빛을, 매우 낮은 별은 주로 적색 빛을 내요."},
      {q:"태양(황색)과 리겔(청백색), 베텔게우스(적색)를 표면 온도가 높은 순서로 바르게 나열한 것은?",o:["리겔 > 태양 > 베텔게우스","베텔게우스 > 태양 > 리겔","태양 > 리겔 > 베텔게우스"],a:0,why:"청백색 > 황색 > 적색 순으로 표면 온도가 높아요."},
      {q:"별의 표면 온도를 알기 위해 관측해야 하는 것은?",o:["별의 색깔","별의 연주 시차","별의 겉보기 등급"],a:0,why:"별의 색깔을 관측하면 표면 온도를 알 수 있어요."}]});

add({id:"s3-3",part:"3. 별의 색깔과 표면 온도",no:"3-3",title:"두 별 비교 무한 연습",html:`
<p class="mt0">지금까지 배운 것을 모두 써서 두 별을 비교해요. <b>새 문제</b>를 누르면 문제가 계속 새로 나와요.</p>
<div class="easy"><b class="lbl">무엇으로 비교할까?</b>
• 표면 온도 → <b>색깔</b> (청색 쪽일수록 높음)<br>
• 맨눈으로 밝게 보이는 별 → <b>겉보기 등급</b>이 작은 별<br>
• 실제로 밝은 별 → <b>절대 등급</b>이 작은 별<br>
• 멀리 있는 별 → <b>겉보기 − 절대</b>가 큰 별 (또는 연주 시차가 작은 별)</div>
<div class="vis" style="text-align:left"><div class="tablewrap" id="gen"></div><div id="genq"></div><div class="ctrl"><button class="btn" id="gennew">새 문제</button></div><div id="gens" style="font-size:14px;color:var(--muted);text-align:center"></div></div>`,
init(box){const COL=["적색","주황색","황색","황백색","백색","청백색","청색"]; let score=0, tried=0;
 const R=Math.random;
 const make=()=>{let A,B; do{A={c:Math.floor(R()*7),m:Math.floor(R()*9)-2,M:Math.floor(R()*11)-4}; B={c:Math.floor(R()*7),m:Math.floor(R()*9)-2,M:Math.floor(R()*11)-4};}while(A.c===B.c||A.m===B.m||A.M===B.M||(A.m-A.M)===(B.m-B.M));
  $("#gen",box).innerHTML=`<table class="t"><tr><th>구분</th><th>별 A</th><th>별 B</th></tr><tr><th>색깔</th><td>${COL[A.c]}</td><td>${COL[B.c]}</td></tr><tr><th>겉보기 등급</th><td>${A.m}</td><td>${B.m}</td></tr><tr><th>절대 등급</th><td>${A.M}</td><td>${B.M}</td></tr></table>`;
  const Q=[["표면 온도가 더 높은 별은?",A.c>B.c?"A":"B",`색깔이 청색 쪽에 더 가까운 ${A.c>B.c?"A("+COL[A.c]+")":"B("+COL[B.c]+")"}가 더 높아요.`],
   ["맨눈으로 볼 때 더 밝게 보이는 별은?",A.m<B.m?"A":"B",`겉보기 등급이 더 작은 ${A.m<B.m?"A("+A.m+")":"B("+B.m+")"}예요.`],
   ["실제로 더 밝은 별은?",A.M<B.M?"A":"B",`절대 등급이 더 작은 ${A.M<B.M?"A("+A.M+")":"B("+B.M+")"}예요.`],
   ["지구에서 더 멀리 있는 별은?",(A.m-A.M)>(B.m-B.M)?"A":"B",`겉보기 − 절대: A는 ${A.m-A.M}, B는 ${B.m-B.M}. 값이 더 큰 ${(A.m-A.M)>(B.m-B.M)?"A":"B"}가 더 멀어요.`]];
  const w=$("#genq",box); w.innerHTML=""; Q.forEach(([q,a,why],i)=>{const d=el(`<div class="qitem"><div class="qq">${i+1}. ${q}</div><div class="opts"><button class="opt">A</button><button class="opt">B</button></div><div class="fb"></div></div>`);
   d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(d.dataset.done) return; d.dataset.done=1; const ok=b.textContent===a; tried++; if(ok) score++; b.classList.add(ok?"right":"wrong"); if(!ok) [...d.querySelectorAll(".opt")].find(x=>x.textContent===a).classList.add("right");
    const f=d.querySelector(".fb"); f.classList.add("show"); f.innerHTML=(ok?`<span class="r">정답!</span> `:`<span class="w">정답은 ${a}예요.</span> `)+why; $("#gens",box).textContent=`지금까지 ${tried}문제 중 ${score}문제 맞혔어요.`;}); w.appendChild(d);});};
 $("#gennew",box).onclick=make; make();},
quiz:[{q:"두 별까지의 거리를 비교하려면 무엇을 비교하면 될까요?",o:["연주 시차 또는 겉보기 등급과 절대 등급","색깔만","겉보기 등급만"],a:0,why:"연주 시차를 비교하거나, 겉보기 등급과 절대 등급의 차이를 비교하면 거리를 비교할 수 있어요."}]});

/* =========== 4. 성운과 성단 =========== */
add({id:"s4-1",part:"4. 성운과 성단",no:"4-1",title:"성간 물질과 성운",html:`
<p class="mt0">별과 별 사이는 완전히 비어 있지 않아요. 가스와 먼지가 퍼져 있는데, 이것을 <b>성간 물질</b>이라고 해요. 성간 물질은 고르게 퍼져 있지 않고 구름처럼 군데군데 뭉쳐 있어요.</p>
<div class="vis"><svg id="ism" viewBox="0 0 520 220" role="img" aria-label="성간 물질이 모인 성운"></svg><div class="ctrl"><button class="btn" id="ismgo">성간 물질 모으기</button></div><div class="stepbox" id="ismt">버튼을 눌러 보세요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b><b>성간 물질</b>: 별과 별 사이에 분포하는 가스와 먼지<br><b>성운</b>: 성간 물질이 모여 있어 구름처럼 보이는 천체</div>`,
init(box){const sv=$("#ism",box); const R=rng(5); const P=[...Array(70)].map(()=>[R()*520,R()*220,R()]);
 const draw=k=>{let s=skyRect(520,220)+bgStars(30,0,0,520,220,41,1)+`<defs><filter id="ismb"><feGaussianBlur stdDeviation="${2+k*8}"/></filter></defs><g filter="url(#ismb)">`;
  P.forEach(([x,y,r])=>{const cx=260+(x-260)*(1-0.75*k), cy=110+(y-110)*(1-0.7*k); s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(2+r*3+k*10).toFixed(1)}" fill="#B9A6E8" opacity="${(0.25+0.2*k).toFixed(2)}"/>`;}); sv.innerHTML=s+"</g>";};
 draw(0); $("#ismgo",box).onclick=()=>{tween(sv,1.8,e=>draw(e),()=>{$("#ismt",box).innerHTML="흩어져 있던 가스와 먼지(성간 물질)가 모여 <b>구름처럼 보이는 천체</b>가 되었어요. 이것이 <b>성운</b>이에요.";});};},
quiz:[{q:"별과 별 사이에 분포하는 가스와 먼지를 무엇이라고 할까요?",o:["성간 물질","성단","은하"],a:0,why:"별과 별 사이의 가스와 먼지는 성간 물질이에요."},
      {q:"성간 물질이 모여 구름처럼 보이는 천체는?",o:["성운","성단","은하수"],a:0,why:"성간 물질이 모여 구름처럼 보이는 천체를 성운이라고 해요."}]});

add({id:"s4-2",part:"4. 성운과 성단",no:"4-2",title:"성운의 종류 3가지",html:`
<p class="mt0">성운은 빛을 어떻게 내는지(또는 막는지)에 따라 세 가지로 나눠요. 버튼을 눌러 각각 어떻게 보이는지 보세요.</p>
<div class="vis"><svg id="neb" viewBox="0 0 520 250" role="img" aria-label="성운의 종류 애니메이션"></svg>
<div class="ctrl"><button class="btn ghost" data-k="dark">암흑 성운</button><button class="btn ghost" data-k="emit">방출 성운</button><button class="btn ghost" data-k="refl">반사 성운</button></div><div class="stepbox" id="nebt">버튼을 눌러 보세요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>
<b>암흑 성운</b>: 뒤쪽에서 오는 별빛을 차단하여 어둡게 보이는 성운<br>
<b>방출 성운</b>: 주변의 별빛을 흡수하여 가열되면서 스스로 빛을 내는 성운<br>
<b>반사 성운</b>: 성간 물질이 주변의 별빛을 반사하여 밝게 보이는 성운</div>
<div class="easy"><b class="lbl">비유</b>• 암흑 성운 = 창문을 가린 <b>커튼</b> (뒤의 빛을 막아요)<br>• 방출 성운 = 스스로 빛나는 <b>전구</b> (가열되어 직접 빛을 내요)<br>• 반사 성운 = 빛을 비추면 밝아지는 <b>거울·흰 벽</b> (빛을 반사해요)</div>`,
init(box){const sv=$("#neb",box); const st=bgStars(90,0,0,520,250,51,1.2);
 const eye=`<g><ellipse cx="470" cy="215" rx="22" ry="12" fill="#fff"/><circle cx="470" cy="215" r="6" fill="#1B2350"/></g>`+txt(470,244,"관측자",{s:12});
 const M={dark:()=>skyRect(520,250)+st+`<defs><filter id="nb1"><feGaussianBlur stdDeviation="9"/></filter></defs><g filter="url(#nb1)"><path d="M150 40 C220 20 330 50 340 110 C350 170 290 200 230 190 C180 182 210 140 170 120 C130 100 110 60 150 40Z" fill="#05070F"><animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="8s" repeatCount="indefinite"/></path></g>`+txt(250,232,"뒤쪽 별빛이 가려져 별이 없는 것처럼 어둡게 보여요",{s:13,c:"#FFD98A"}),
  emit:()=>skyRect(520,250)+st+`<defs><filter id="nb2"><feGaussianBlur stdDeviation="12"/></filter></defs><g filter="url(#nb2)"><ellipse cx="260" cy="115" rx="130" ry="70" fill="#FF5E7E"><animate attributeName="opacity" values=".45;.85;.45" dur="2.2s" repeatCount="indefinite"/></ellipse></g>`+starDot(260,115,8,"#CFE0FF",.4)+
   [0,60,120,180,240,300].map(a=>{const r=a*Math.PI/180; return `<line x1="${260+14*Math.cos(r)}" y1="${115+14*Math.sin(r)}" x2="${260+60*Math.cos(r)}" y2="${115+60*Math.sin(r)}" stroke="#CFE0FF" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/></line>`;}).join("")+txt(260,225,"별빛 흡수 → 가열 → 성운이 스스로 빛을 내요",{s:13,c:"#FFD98A"}),
  refl:()=>skyRect(520,250)+st+`<defs><filter id="nb3"><feGaussianBlur stdDeviation="10"/></filter></defs><g filter="url(#nb3)"><ellipse cx="280" cy="100" rx="110" ry="55" fill="#7FA8FF" opacity=".55"/></g>`+starDot(90,60,9,"#FFF2C6",.35)+
   `<path d="M100 66 L270 100" stroke="#FFF2C6" stroke-width="2.5" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" values="30;0" dur="1s" repeatCount="indefinite"/></path><path d="M280 110 L455 205" stroke="#9FC0FF" stroke-width="2.5" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" values="30;0" dur="1s" repeatCount="indefinite"/></path>`+eye+txt(90,36,"주변 별",{s:12})+txt(200,232,"주변 별빛이 성간 물질에 반사되어 밝게 보여요",{s:13,c:"#FFD98A"})};
 const T={dark:"<b>암흑 성운</b>: 성간 물질이 <b>뒤쪽에서 오는 별빛을 차단</b>해서 어둡게 보여요. 말머리 성운이 대표적이에요.",emit:"<b>방출 성운</b>: 주변의 별빛을 <b>흡수</b>하여 <b>가열</b>되면서 <b>스스로 빛</b>을 내요.",refl:"<b>반사 성운</b>: 성간 물질이 주변의 별빛을 <b>반사</b>해서 밝게 보여요. 스스로 빛을 내는 것이 아니에요."};
 sv.innerHTML=skyRect(520,250)+st;
 box.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k; sv.innerHTML=`<g class="fade-in">${M[k]()}</g>`; $("#nebt",box).innerHTML=T[k]; box.querySelectorAll("[data-k]").forEach(x=>x.className="btn "+(x===b?"":"ghost"));});},
quiz:[{q:"뒤쪽에서 오는 별빛을 차단하여 어둡게 보이는 성운은?",o:["암흑 성운","방출 성운","반사 성운"],a:0,why:"뒤쪽 별빛을 막아 어둡게 보이는 것은 암흑 성운이에요."},
      {q:"주변의 별빛을 흡수하여 가열되면서 스스로 빛을 내는 성운은?",o:["암흑 성운","방출 성운","반사 성운"],a:1,why:"스스로 빛을 내는 것은 방출 성운이에요."},
      {q:"반사 성운이 밝게 보이는 까닭은?",o:["스스로 빛을 내서","주변의 별빛을 반사해서","뒤쪽 별빛을 막아서"],a:1,why:"반사 성운은 성간 물질이 주변 별빛을 반사하여 밝게 보여요."}]});

add({id:"s4-3",part:"4. 성운과 성단",no:"4-3",title:"성단: 산개 성단과 구상 성단",html:`
<p class="mt0">많은 수의 별들이 모여 있는 집단을 <b>성단</b>이라고 해요. 별들이 모여 있는 모습에 따라 두 가지로 나눠요.</p>
<div class="vis"><svg id="clu" viewBox="0 0 520 250" role="img" aria-label="산개 성단과 구상 성단"></svg><div class="ctrl"><button class="btn" id="clugo">별 다시 뿌리기</button></div></div>
<div class="tablewrap"><table class="t"><tr><th></th><th>산개 성단</th><th>구상 성단</th></tr>
<tr><th>별의 수</th><td>수십~수만 개</td><td>수만~수십만 개</td></tr><tr><th>모인 모습</th><td>비교적 <b>듬성듬성</b></td><td><b>공 모양</b>으로 빽빽하게</td></tr>
<tr><th>별의 색깔</th><td>주로 <b>청색</b></td><td>주로 <b>적색</b></td></tr><tr><th>별의 표면 온도</th><td>주로 <b>높다</b></td><td>주로 <b>낮다</b></td></tr><tr><th>예</th><td>좀생이 성단</td><td>M80</td></tr></table></div>
<div class="easy"><b class="lbl">구별 요령</b>'구상'의 '구'는 공 구(球)! 공 모양으로 빽빽하게 모인 것이 구상 성단, 흩어진 듯 듬성듬성한 것이 산개 성단이에요.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>성운은 가스와 먼지(성간 물질)의 구름이고, 성단은 <b>별</b>들의 집단이에요. 둘을 헷갈리지 마세요.</div>`,
init(box){const sv=$("#clu",box); let seed=3;
 const draw=()=>{const R=rng(seed++); let s=skyRect(520,250)+bgStars(25,0,0,520,250,seed*7,0.6)+`<rect x="260" y="14" width="1" height="200" fill="${SKYM}" opacity=".4"/>`;
  for(let i=0;i<45;i++){const x=130+(R()-.5)*190, y=110+(R()-.5)*160; s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.4+R()*2.4).toFixed(1)}" fill="${R()<.8?"#9FC0FF":"#E8F0FF"}" class="fade-in" style="animation-delay:${(R()*.6).toFixed(2)}s"/>`;}
  for(let i=0;i<650;i++){const a=R()*2*Math.PI, rr=Math.pow(R(),1.8)*80; const x=390+rr*Math.cos(a), y=110+rr*Math.sin(a); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.6+R()*1.1).toFixed(1)}" fill="${R()<.8?"#FFB07A":"#FFE2B0"}" opacity=".9" class="fade-in" style="animation-delay:${(R()*.6).toFixed(2)}s"/>`;}
  s+=txt(130,232,"산개 성단 (듬성듬성, 청색 별)",{s:14,w:700})+txt(390,232,"구상 성단 (공 모양, 적색 별)",{s:14,w:700}); sv.innerHTML=s;};
 $("#clugo",box).onclick=draw; draw();},
quiz:[{q:"수만~수십만 개의 별들이 공 모양으로 빽빽하게 모여 있는 성단은?",o:["산개 성단","구상 성단"],a:1,why:"공 모양으로 빽빽하게 모인 것은 구상 성단이에요."},
      {q:"산개 성단을 이루는 별들의 특징은?",o:["주로 청색이고 표면 온도가 높다","주로 적색이고 표면 온도가 낮다"],a:0,why:"산개 성단은 주로 온도가 높아 청색을 띠는 별들로 이루어져 있어요."}]});

/* =========== 5. 우리은하 =========== */
add({id:"s5-1",part:"5. 우리은하",no:"5-1",title:"은하수와 우리은하",html:`
<p class="mt0">여름철 맑은 밤하늘에는 뿌연 띠 모양으로 하늘을 가로지르는 <b>은하수</b>가 보여요. 17세기에 <b>갈릴레이</b>는 망원경으로 은하수를 보고 그것이 수많은 별들로 이루어져 있다는 것을 알아냈어요.</p>
<div class="vis"><svg id="mw" viewBox="0 0 520 250" role="img" aria-label="은하수를 망원경으로 보기"></svg><div class="ctrl"><button class="btn" id="mwgo">갈릴레이처럼 망원경으로 보기</button></div><div class="stepbox" id="mwt">맨눈으로 보면 뿌연 구름 띠처럼 보여요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b><b>은하</b>: 은하수와 같은 수많은 별들의 집단<br><b>우리은하</b>: 태양계가 속해 있는 은하</div>`,
init(box){const sv=$("#mw",box); const base=skyRect(520,250)+bgStars(50,0,0,520,250,61,1)+`<defs><filter id="mwb"><feGaussianBlur stdDeviation="16"/></filter><clipPath id="lens"><circle cx="300" cy="120" r="70"/></clipPath></defs><g filter="url(#mwb)"><path d="M-20 210 C150 150 330 110 540 30 L540 90 C330 160 150 210 -20 260Z" fill="#DCD6F7" opacity=".45"/></g>`;
 sv.innerHTML=base;
 $("#mwgo",box).onclick=()=>{const R=rng(9); let dots=""; for(let i=0;i<500;i++){const t=R(); const x=-20+t*560, y=235-t*190+(R()-.5)*60; dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.5+R()*1.1).toFixed(1)}" fill="#fff"/>`;}
  sv.innerHTML=base+`<g clip-path="url(#lens)"><rect width="520" height="250" fill="${SKY}"/>${dots}</g><circle cx="300" cy="120" r="70" fill="none" stroke="#C9D2F5" stroke-width="5" class="fade-in"/>`+txt(300,214,"망원경으로 본 모습",{s:13});
  $("#mwt",box).innerHTML="망원경으로 보니 뿌연 띠가 <b>수많은 별들</b>로 이루어져 있어요!";};},
quiz:[{q:"은하수가 수많은 별들로 이루어져 있다는 것을 망원경으로 처음 알아낸 사람은?",o:["갈릴레이","허블","히파르코스"],a:0,why:"17세기에 갈릴레이가 망원경으로 알아냈어요."},
      {q:"태양계가 속해 있는 은하를 무엇이라고 할까요?",o:["우리은하","외부 은하","안드로메다은하"],a:0,why:"태양계가 속해 있는 은하는 우리은하예요."}]});

function milkyTop(sunOn){return galaxy("bar",130,13,{arms:2,col:"#E9E2FF"})+(sunOn?`<g><circle cx="${(130*8.5/15*Math.cos(2.4)).toFixed(1)}" cy="${(130*8.5/15*Math.sin(2.4)).toFixed(1)}" r="6" fill="#FFC94A" stroke="#fff" stroke-width="1.5"/></g>`:"");}
add({id:"s5-2",part:"5. 우리은하",no:"5-2",title:"우리은하의 모양과 크기",html:`
<p class="mt0">우리은하는 위에서 볼 때와 옆에서 볼 때 모양이 달라요. 버튼을 눌러 우리은하를 돌려 보세요.</p>
<div class="vis"><svg id="mw2" viewBox="0 0 520 380" role="img" aria-label="우리은하 위에서 본 모습과 옆에서 본 모습"></svg>
<div class="ctrl"><button class="btn" id="mwtop">위에서 보기</button><button class="btn ghost" id="mwside">옆에서 보기</button></div><div class="stepbox" id="mw2t"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>
• 위에서 보면 중심부에는 별들이 <b>막대 모양</b>을 이루며 모여 있고, 소용돌이치는 모양으로 여러 개의 <b>나선팔</b>이 있다.<br>
• 옆에서 보면 <b>납작한 원반 모양</b>이다.<br>
• 지름은 약 <b>30 kpc(10만 광년)</b>이고, 태양계는 우리은하의 중심에서 약 <b>8.5 kpc(3만 광년)</b> 떨어진 <b>나선팔</b>에 있다.<br>
• 우리은하에는 수천억 개의 별들이 있다.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>태양계는 우리은하의 <b>중심이 아니라</b> 중심에서 약 8.5 kpc 떨어진 <b>나선팔</b>에 있어요.</div>`,
init(box){const sv=$("#mw2",box); let sy=1, target=1, ang=0;
 const draw=()=>{let s=skyRect(520,380)+bgStars(40,0,0,520,380,71,0.8);
  s+=`<g transform="translate(260 180) scale(1 ${sy.toFixed(3)}) rotate(${ang.toFixed(1)})">${milkyTop(true)}</g>`;
  if(sy<0.5){const o=(0.5-sy)*2; s+=`<g opacity="${o.toFixed(2)}"><ellipse cx="260" cy="180" rx="48" ry="26" fill="#E9E2FF" opacity=".75"/>`+txt(260,250,"납작한 원반 모양 (가운데가 볼록)",{s:15,w:700,c:"#FFD98A"})+`</g>`;}
  else{const o=(sy-0.5)*2; s+=`<g opacity="${o.toFixed(2)}">`+txt(260,30,"위에서 본 모습: 막대 모양 중심부 + 나선팔",{s:15,w:700,c:"#FFD98A"})+`</g>`;}
  s+=`<line x1="130" y1="345" x2="390" y2="345" stroke="#7FE0A8" stroke-width="2"/><line x1="130" y1="338" x2="130" y2="352" stroke="#7FE0A8" stroke-width="2"/><line x1="390" y1="338" x2="390" y2="352" stroke="#7FE0A8" stroke-width="2"/>`+txt(260,370,"지름 약 30 kpc (10만 광년)",{s:14,c:"#7FE0A8"});
  if(sy>0.5) s+=txt(80,320,"● 노란 점 = 태양계",{a:"start",s:13,c:"#FFC94A"});
  sv.innerHTML=s;};
 loop(sv,t=>{if(!REDUCE) ang=(ang+0.12)%360; sy+=(target-sy)*0.07; draw();});
 const T=["<b>위에서 본 모습</b>: 중심부에 막대 모양, 바깥으로 소용돌이치는 나선팔이 있어요. 노란 점(태양계)은 중심에서 약 8.5 kpc 떨어진 나선팔에 있어요.","<b>옆에서 본 모습</b>: 가운데가 볼록한 <b>납작한 원반 모양</b>이에요."];
 $("#mw2t",box).innerHTML=T[0];
 $("#mwtop",box).onclick=()=>{target=1; $("#mw2t",box).innerHTML=T[0]; $("#mwtop",box).className="btn"; $("#mwside",box).className="btn ghost";};
 $("#mwside",box).onclick=()=>{target=0.14; $("#mw2t",box).innerHTML=T[1]; $("#mwside",box).className="btn"; $("#mwtop",box).className="btn ghost";};},
quiz:[{q:"우리은하의 지름은 약 얼마일까요?",o:["약 8.5 kpc","약 30 kpc","약 260 kpc"],a:1,why:"우리은하의 지름은 약 30 kpc(10만 광년)이에요."},
      {q:"태양계의 위치로 옳은 것은?",o:["우리은하의 중심","중심에서 약 8.5 kpc 떨어진 나선팔","우리은하 밖"],a:1,why:"태양계는 우리은하 중심에서 약 8.5 kpc(3만 광년) 떨어진 나선팔에 있어요."},
      {q:"우리은하를 옆에서 본 모양은?",o:["공 모양","납작한 원반 모양","막대 모양"],a:1,why:"옆에서 보면 납작한 원반 모양이에요. 막대 모양은 위에서 본 중심부의 모습이에요."}]});

add({id:"s5-3",part:"5. 우리은하",no:"5-3",title:"은하수가 띠로 보이는 까닭",html:`
<p class="mt0">우리는 우리은하 <b>안에</b> 살고 있어요. 그래서 우리은하를 밖에서 보듯 전체 모습을 볼 수 없고, 원반 방향으로 별들이 겹쳐 보이는 <b>띠(은하수)</b>로 보여요.</p>
<div class="vis"><svg id="mw3" viewBox="0 0 520 330" role="img" aria-label="계절에 따라 다른 은하수"></svg>
<div class="ctrl"><button class="btn ghost" id="sumr">여름철 밤하늘</button><button class="btn ghost" id="wint">겨울철 밤하늘</button></div><div class="stepbox" id="mw3t">버튼을 눌러 보세요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>태양계는 우리은하의 중심부에서 벗어나 있고 은하면 안에 있기 때문에 지구에서 본 우리은하는 띠 모양의 은하수로 관측된다.</div>
<div class="easy"><b class="lbl">여름과 겨울의 차이</b>여름철 밤에는 <b>우리은하 중심 방향</b>을 보게 돼요. 중심 쪽에는 별이 많아서 은하수가 <b>더 밝고 두껍게</b> 보여요. 겨울철 밤에는 중심의 <b>반대 방향</b>을 보게 되어 은하수가 상대적으로 어둡고 가늘게 보여요.</div>`,
init(box){const sv=$("#mw3",box); const R=rng(17); let disk=""; for(let i=0;i<420;i++){const x=(R()-.5)*2, y=(R()-.5)*2*(1-Math.abs(x))*0.35; disk+=`<circle cx="${(260+x*200).toFixed(1)}" cy="${(110+y*60).toFixed(1)}" r="${(0.6+R()*1).toFixed(1)}" fill="#E9E2FF" opacity=".75"/>`;}
 const SUN=[260+200*8.5/15,110];
 const side=(mode)=>{let s=skyRect(520,330)+`<ellipse cx="260" cy="110" rx="205" ry="18" fill="#E9E2FF" opacity=".18"/><ellipse cx="260" cy="110" rx="46" ry="28" fill="#E9E2FF" opacity=".55"/>`+disk+`<circle cx="${SUN[0]}" cy="${SUN[1]}" r="6" fill="#FFC94A" stroke="#fff"/>`+txt(SUN[0],SUN[1]-16,"태양계",{s:13,c:"#FFC94A"})+txt(260,160,"은하 중심",{s:12,c:SKYM});
  if(mode==="s") s+=`<line x1="${SUN[0]-10}" y1="110" x2="150" y2="110" stroke="#FFD98A" stroke-width="3" marker-end="url(#ar)" class="fade-in"/>`+txt(160,138,"여름철 밤에 보는 방향",{s:13,c:"#FFD98A",a:"start"});
  if(mode==="w") s+=`<line x1="${SUN[0]+10}" y1="110" x2="500" y2="110" stroke="#9FC0FF" stroke-width="3" marker-end="url(#ar2)" class="fade-in"/>`+txt(500,138,"겨울철 밤에 보는 방향",{s:13,c:"#9FC0FF",a:"end"});
  s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFD98A"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9FC0FF"/></marker></defs>`;
  s+=`<rect x="20" y="190" width="480" height="125" rx="10" fill="#0A0E24" stroke="#2A3366"/>`+txt(260,210,mode?"지구에서 본 밤하늘":"",{s:12,c:SKYM});
  if(mode){const n=mode==="s"?700:180, th=mode==="s"?44:16, R2=rng(mode==="s"?3:4); let b=""; for(let i=0;i<n;i++){const x=24+R2()*472, y=262+(R2()+R2()-1)*th; b+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.5+R2()*0.9).toFixed(1)}" fill="#fff" opacity="${(0.4+R2()*0.6).toFixed(2)}"/>`;}
   s+=`<g class="fade-in"><defs><filter id="mwbl"><feGaussianBlur stdDeviation="8"/></filter></defs><rect x="24" y="${262-th}" width="472" height="${th*2}" fill="#DCD6F7" opacity="${mode==="s"?.35:.12}" filter="url(#mwbl)"/>${b}</g>`;}
  sv.innerHTML=s;};
 side(""); $("#sumr",box).onclick=()=>{side("s"); $("#mw3t",box).innerHTML="여름철: <b>은하 중심 방향</b>을 봐요. 별이 많아 은하수가 <b>밝고 두껍게</b> 보여요.";};
 $("#wint",box).onclick=()=>{side("w"); $("#mw3t",box).innerHTML="겨울철: 은하 중심의 <b>반대 방향</b>을 봐요. 은하수가 <b>어둡고 가늘게</b> 보여요.";};},
quiz:[{q:"지구에서 우리은하가 띠 모양의 은하수로 보이는 까닭은?",o:["태양계가 우리은하의 은하면 안에 있고 중심부에서 벗어나 있어서","태양계가 우리은하 밖에 있어서","우리은하가 공 모양이어서"],a:0,why:"태양계가 은하 원반 안, 중심에서 벗어난 곳에 있어서 원반 방향의 별들이 띠처럼 보여요."},
      {q:"은하수가 더 밝고 두껍게 보이는 계절은?",o:["여름철","겨울철"],a:0,why:"여름철 밤에는 별이 많은 우리은하 중심 방향을 보기 때문이에요."}]});

add({id:"s5-4",part:"5. 우리은하",no:"5-4",title:"우리은하를 이루는 천체",html:`
<p class="mt0">우리은하에는 수천억 개의 별과 성간 물질, 성운, 성단이 있어요. 이들은 우리은하에서 주로 분포하는 곳이 서로 달라요. 버튼을 눌러 어디에 많은지 보세요.</p>
<div class="vis"><svg id="mw4" viewBox="0 0 520 300" role="img" aria-label="우리은하 천체 분포"></svg>
<div class="ctrl"><button class="btn ghost" id="d1">성간 물질·성운·산개 성단</button><button class="btn ghost" id="d2">구상 성단</button></div><div class="stepbox" id="mw4t">버튼을 눌러 보세요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>성간 물질, 성운, 산개 성단은 주로 우리은하의 <b>나선팔</b>에 분포하고, 구상 성단은 주로 은하의 <b>중심부</b> 및 은하 원반을 둘러싼 <b>구형의 공간</b>에 분포한다.</div>`,
init(box){const sv=$("#mw4",box);
 const draw=k=>{let s=skyRect(520,300)+`<g transform="translate(260 150) scale(1 .3)">${galaxy("bar",150,13,{arms:2,col:"#E9E2FF"})}</g>`;
  s+=`<circle cx="260" cy="150" r="140" fill="none" stroke="${SKYM}" stroke-dasharray="4 6" opacity=".6"/>`+txt(400,40,"원반을 둘러싼 구형의 공간",{s:12,c:SKYM,a:"end"});
  if(k===1){const R=rng(21); for(let i=0;i<34;i++){const t=R()*5.5, ph=Math.floor(R()*2)*Math.PI, rr=150*0.34*Math.exp(0.33*t); if(rr>150) continue; const x=260+rr*Math.cos(t+ph)+(R()-.5)*8, y=150+(rr*Math.sin(t+ph))*0.3; s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#7FA8FF" stroke="#fff" class="fade-in" style="animation-delay:${(i*.03).toFixed(2)}s"/>`;}}
  if(k===2){const R=rng(23); for(let i=0;i<40;i++){const a=R()*2*Math.PI, rr=(i<12?R()*40:40+R()*95); const x=260+rr*Math.cos(a), y=150+rr*Math.sin(a); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#FF9E7A" stroke="#fff" class="fade-in" style="animation-delay:${(i*.03).toFixed(2)}s"/>`;}}
  s+=txt(260,290,k===1?"● 파란 점: 성간 물질·성운·산개 성단 → 나선팔(원반)에 많아요":k===2?"● 주황 점: 구상 성단 → 중심부와 둘러싼 구형 공간에 많아요":"우리은하를 비스듬히 본 모습",{s:13,c:"#FFD98A"}); sv.innerHTML=s;};
 draw(0); $("#d1",box).onclick=()=>{draw(1); $("#mw4t",box).innerHTML="성간 물질, 성운, 산개 성단은 주로 <b>나선팔</b>에 있어요.";}; $("#d2",box).onclick=()=>{draw(2); $("#mw4t",box).innerHTML="구상 성단은 주로 <b>은하 중심부</b>와 원반을 둘러싼 <b>구형의 공간</b>에 있어요.";};},
quiz:[{q:"구상 성단이 주로 분포하는 곳은?",o:["나선팔","은하 중심부와 원반을 둘러싼 구형의 공간","우리은하 밖"],a:1,why:"구상 성단은 주로 은하 중심부와 원반을 둘러싼 구형의 공간에 있어요."},
      {q:"성간 물질, 성운, 산개 성단이 주로 분포하는 곳은?",o:["나선팔","은하 중심부"],a:0,why:"이들은 주로 우리은하의 나선팔에 분포해요."}]});

/* =========== 6. 외부 은하 =========== */
add({id:"s6-1",part:"6. 외부 은하",no:"6-1",title:"우리은하 밖의 은하",html:`
<p class="mt0">20세기 초까지 사람들은 <b>우리은하가 우주 전체</b>라고 생각했어요. 그런데 1920년대 중반 <b>허블</b>이 대형 망원경으로 '안드로메다 성운'까지의 거리를 재 보니 약 <b>260 kpc</b>이었어요.</p>
<div class="vis"><svg id="and" viewBox="0 0 520 200" role="img" aria-label="우리은하와 안드로메다까지의 거리 비교"></svg><div class="ctrl"><button class="btn" id="andgo">▶ 거리 재기</button></div><div class="stepbox" id="andt">버튼을 눌러 보세요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>허블이 측정한 안드로메다까지의 거리(약 260 kpc)는 우리은하의 크기인 약 30 kpc보다 매우 큰 값이므로, 허블은 안드로메다가 우리은하 밖에 있는 외부 은하라고 결론지었다.<br><b>외부 은하</b>: 우리은하 밖에 분포하는 은하. 외부 은하도 우리은하처럼 수많은 별들이 모여 있는 천체이다.</div>
<div class="easy"><b class="lbl">260 kpc라는 값</b>이 값은 현재 정밀하게 측정한 값과는 차이가 있지만, 우리은하 크기(약 30 kpc)보다 <b>매우 크다</b>는 점이 중요해요.</div>
<div class="easy"><b class="lbl">무엇이 바뀌었을까?</b>외부 은하가 발견되면서 사람들이 알게 된 <b>우주의 크기가 훨씬 커졌어요</b>. 우리은하는 우주에 있는 수많은 은하 중 하나일 뿐이었어요.</div>`,
init(box){const sv=$("#and",box); const k=1.6, x0=40;
 const scene=d=>{let s=skyRect(520,200)+bgStars(30,0,0,520,200,81,0.8)+`<g transform="translate(${x0+15*k} 100) scale(1 .45)">${galaxy("bar",15*k,13,{col:"#E9E2FF"})}</g>`+txt(x0+15*k,140,"우리은하",{s:12})+
  `<line x1="${x0}" y1="160" x2="${x0+30*k}" y2="160" stroke="#7FE0A8" stroke-width="3"/>`+txt(x0+15*k,182,"30 kpc",{s:12,c:"#7FE0A8"});
  const xa=x0+15*k+d*k; s+=`<line x1="${x0+15*k}" y1="100" x2="${xa.toFixed(1)}" y2="100" stroke="#FFD98A" stroke-width="1.5" stroke-dasharray="5 5"/><g transform="translate(${xa.toFixed(1)} 100) rotate(-30) scale(1 .45)">${galaxy("spiral",22,5,{col:"#FFE2B0"})}</g>`+txt(Math.min(xa+30,510),56,d>=259.5?"안드로메다 약 260 kpc":"안드로메다",{s:14,w:700,c:"#FFD98A",a:"end"});
  return s;};
 sv.innerHTML=scene(40);
 $("#andgo",box).onclick=()=>{tween(sv,2.2,e=>{sv.innerHTML=scene(40+220*e);},()=>{$("#andt",box).innerHTML="안드로메다까지의 거리(약 <b>260 kpc</b>)가 우리은하 지름(약 <b>30 kpc</b>)보다 <b>매우 커요</b>. 그러니 안드로메다는 우리은하 안에 있을 수 없어요 → <b>외부 은하</b>!";});};},
quiz:[{q:"허블이 안드로메다를 외부 은하라고 결론지은 까닭은?",o:["안드로메다까지의 거리가 우리은하의 크기보다 매우 커서","안드로메다가 매우 밝아서","안드로메다가 성운처럼 보여서"],a:0,why:"측정한 거리(약 260 kpc)가 우리은하 크기(약 30 kpc)보다 매우 컸기 때문이에요."},
      {q:"외부 은하에 대한 설명으로 옳은 것은?",o:["우리은하 밖에 있는 은하이다","우리은하 안에 있는 성운이다","별이 없는 가스 덩어리이다"],a:0,why:"외부 은하는 우리은하 밖에 있는 은하이고, 수많은 별들이 모여 있어요."}]});

add({id:"s6-2",part:"6. 외부 은하",no:"6-2",title:"은하의 모양 4가지",html:`
<p class="mt0">허블은 외부 은하들을 <b>모양</b>에 따라 크게 4가지로 분류했어요.</p>
<div class="cards" id="gcards"></div>
<div class="vis" style="text-align:left"><b>질문을 따라가며 분류하기</b><div id="flow" class="stepbox" style="min-height:5em"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>
<b>타원 은하</b>: 나선팔이 없고, 구형이나 타원체 모양으로 보이는 은하<br>
<b>정상 나선 은하</b>: 둥근 형태의 은하 중심부와 휘어진 나선팔이 있는 은하<br>
<b>막대 나선 은하</b>: 은하의 중심을 가로지르는 막대 모양이 있고 그 끝에서 나선팔이 휘어져 나온 은하<br>
<b>불규칙 은하</b>: 규칙적인 모양이 없는 은하</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>정상 나선 은하와 막대 나선 은하를 가르는 기준은 <b>중심부에 막대 구조가 있는지</b>예요. 둘 다 나선팔은 있어요.</div>`,
init(box){const w=$("#gcards",box); Object.entries(GTYPE).forEach(([k,n],i)=>{w.appendChild(el(`<div class="card fade-in" style="animation-delay:${i*.15}s"><svg viewBox="-60 -50 120 100" width="120" height="100" aria-hidden="true"><rect x="-60" y="-50" width="120" height="100" rx="10" fill="${SKY}"/><g transform="rotate(${k==="ellip"?20:0})">${galaxy(k,42,i+3,{col:"#F2E6C9"})}</g></svg><b>${n}</b></div>`));});
 const F=$("#flow",box);
 const Q={s:["나선팔이 있나요?",{예:"b",아니요:"r"}],b:["중심을 가로지르는 막대 모양이 있나요?",{예:"=bar",아니요:"=spiral"}],r:["구형이나 타원체처럼 규칙적인 모양인가요?",{예:"=ellip",아니요:"=irr"}]};
 const go=k=>{if(k[0]==="="){const t=k.slice(1); F.innerHTML=`<div class="fade-in"><svg viewBox="-60 -50 120 100" width="110" height="92" style="vertical-align:middle" aria-hidden="true"><rect x="-60" y="-50" width="120" height="100" rx="10" fill="${SKY}"/>${galaxy(t,42,4,{})}</svg> → <b style="font-size:18px">${GTYPE[t]}</b> <button class="btn ghost" style="margin-left:8px">처음부터</button></div>`; F.querySelector("button").onclick=()=>go("s"); return;}
  const [q,o]=Q[k]; F.innerHTML=`<div class="fade-in"><b>${q}</b> <div class="ctrl" style="justify-content:flex-start">${Object.keys(o).map(x=>`<button class="btn ghost" data-g="${o[x]}">${x}</button>`).join("")}</div></div>`; F.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go(b.dataset.g));};
 go("s");},
quiz:[{q:"은하의 중심을 가로지르는 막대 모양이 있고 그 끝에서 나선팔이 휘어져 나온 은하는?",o:["정상 나선 은하","막대 나선 은하","타원 은하"],a:1,why:"막대 끝에서 나선팔이 나오면 막대 나선 은하예요."},
      {q:"나선팔이 없고 구형이나 타원체 모양인 은하는?",o:["타원 은하","불규칙 은하","정상 나선 은하"],a:0,why:"타원 은하는 나선팔이 없고 구형이나 타원체 모양이에요."},
      {q:"정상 나선 은하와 막대 나선 은하를 분류하는 기준은?",o:["나선팔이 있는지","중심부에 막대 구조가 있는지","은하의 크기"],a:1,why:"둘 다 나선팔이 있고, 중심부에 막대 구조가 있는지로 구분해요."}]});

add({id:"s6-3",part:"6. 외부 은하",no:"6-3",title:"은하 분류 게임",html:`
<p class="mt0">은하 사진(그림)이 하나씩 나와요. 어떤 은하인지 맞혀 보세요. 은하는 여러 방향으로 돌아가 있어요!</p>
<div class="vis"><svg id="gg" viewBox="-130 -90 260 180" role="img" aria-label="분류할 은하 그림" style="max-width:360px"></svg><div class="ctrl" id="ggb"></div><div class="stepbox" id="ggt"></div></div>
<div class="easy"><b class="lbl">우리은하와 안드로메다는?</b>우리은하는 중심부에 막대 모양이 있고 나선팔이 있으니 <b>막대 나선 은하</b>예요. 안드로메다은하는 둥근 형태의 중심부와 휘어진 나선팔이 있어 우리은하와 많이 닮았어요.</div>`,
init(box){const sv=$("#gg",box), t=$("#ggt",box), bb=$("#ggb",box); let ans="", sc=0, n=0, locked=false;
 const keys=Object.keys(GTYPE);
 const next=()=>{locked=false; ans=keys[Math.floor(Math.random()*4)]; const rot=Math.round(Math.random()*360), tilt=(0.55+Math.random()*0.45).toFixed(2);
  sv.innerHTML=`<rect x="-130" y="-90" width="260" height="180" rx="12" fill="${SKY}"/>${bgStars(25,-130,-90,260,180,Math.floor(Math.random()*999)+1,0.7)}<g class="fade-in" transform="scale(1 ${ans==="ellip"?1:tilt}) rotate(${rot})">${galaxy(ans,72,Math.floor(Math.random()*999)+1,{})}</g>`; t.innerHTML=`${n}문제 중 ${sc}문제 맞혔어요.`;};
 keys.forEach(k=>{const b=el(`<button class="btn ghost">${GTYPE[k]}</button>`); b.onclick=()=>{if(locked) return; locked=true; n++; const ok=k===ans; if(ok) sc++;
  t.innerHTML=(ok?`<span style="color:var(--ok);font-weight:700">정답!</span> `:`<span style="color:var(--bad);font-weight:700">아쉬워요. ${GTYPE[ans]}예요.</span> `)+({ellip:"나선팔이 없고 타원체 모양이에요.",spiral:"둥근 중심부에서 바로 나선팔이 휘어져 나와요.",bar:"중심을 가로지르는 막대 끝에서 나선팔이 나와요.",irr:"규칙적인 모양이 없어요."})[ans]+` (${n}문제 중 ${sc}문제) <button class="btn" style="padding:4px 14px;margin-left:6px">다음 은하</button>`; t.querySelector("button").onclick=next;}; bb.appendChild(b);});
 next();},
quiz:[{q:"은하를 모양에 따라 분류할 때 우리은하는 어디에 속할까요?",o:["타원 은하","정상 나선 은하","막대 나선 은하","불규칙 은하"],a:2,why:"우리은하는 중심부에 막대 모양이 있고 나선팔이 있으므로 막대 나선 은하예요."}]});

/* =========== 7. 우주의 팽창 =========== */
add({id:"s7-1",part:"7. 우주의 팽창",no:"7-1",title:"풍선으로 보는 우주 팽창",html:`
<p class="mt0">허블은 외부 은하들을 꾸준히 관측해서 <b>대부분의 은하들이 우리은하로부터 멀어진다</b>는 것을 알아냈어요. 그리고 이것은 <b>우주가 팽창</b>하기 때문이라고 설명했어요. 풍선 모형으로 확인해 봐요.</p>
<div class="vis"><svg id="bal" viewBox="0 0 520 330" role="img" aria-label="풍선 우주 팽창 모형"></svg>
<div class="ctrl"><button class="btn" id="balgo">바람 불어 넣기</button><button class="btn ghost" id="balrs">처음으로</button></div>
<div class="tablewrap" id="baltab"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b>우리은하를 비롯하여 외부 은하 전체가 차지하는 거대한 공간을 <b>우주</b>라고 한다. 우주에는 천억 개 정도의 은하들이 분포한다.</div>
<div class="easy"><b class="lbl">모형과 실제 짝 짓기</b>풍선 표면 = <b>우주</b>, 붙임딱지 = <b>은하</b>, 풍선이 부푸는 것 = <b>우주의 팽창</b></div>
<div class="easy"><b class="lbl">실험으로 알게 된 것</b>① 모든 붙임딱지 사이의 거리가 멀어져요 → 모든 은하 사이의 거리가 멀어져요.<br>② 처음에 <b>멀리 떨어져 있던 것일수록 더 많이</b> 멀어져요.<br>③ 어느 붙임딱지에서 봐도 다른 붙임딱지가 멀어져요 → 우주 팽창의 <b>중심은 따로 없어요</b>. 풍선 표면(우주) 위에는 중심이 없고, 풍선 속 가운데는 우주에 해당하지 않아요.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>붙임딱지(은하) 자체의 크기는 커지지 않아요. 커지는 것은 <b>은하 사이의 공간(거리)</b>이에요.</div>`,
init(box){const sv=$("#bal",box), tb=$("#baltab",box); const C=[260,170]; const TH={A:3.49,B:3.99,C:4.24,D:4.74}; const R0=60; let R=R0;
 const d=(a,b)=>(R*Math.abs(TH[a]-TH[b])/15);
 const D0={AB:2,AC:3,AD:5};
 const draw=()=>{let s=`<rect width="520" height="330" rx="12" fill="var(--surface)"/><circle cx="${C[0]}" cy="${C[1]}" r="${R.toFixed(1)}" fill="color-mix(in srgb,var(--rec) 22%,var(--surface))" stroke="var(--rec)" stroke-width="2"/><path d="M${C[0]-8} ${C[1]+R} L${C[0]+8} ${C[1]+R} L${C[0]} ${C[1]+R+14}Z" fill="var(--rec)"/>`;
  Object.entries(TH).forEach(([k,a])=>{const x=C[0]+R*Math.cos(a), y=C[1]+R*Math.sin(a); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="var(--dom)" stroke="#fff" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(y+6).toFixed(1)}" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="var(--body)">${k}</text>`;});
  sv.innerHTML=s;
  const now={AB:d("A","B"),AC:d("A","C"),AD:d("A","D")};
  tb.innerHTML=`<table class="t"><tr><th>붙임딱지</th><th>A와 B</th><th>A와 C</th><th>A와 D</th></tr><tr><th>처음 거리</th><td>2 cm</td><td>3 cm</td><td>5 cm</td></tr><tr><th>지금 거리</th>${["AB","AC","AD"].map(k=>`<td>${now[k].toFixed(1)} cm</td>`).join("")}</tr><tr><th>늘어난 거리</th>${["AB","AC","AD"].map(k=>`<td><b>${(now[k]-D0[k]).toFixed(1)} cm</b></td>`).join("")}</tr></table>`;};
 draw(); $("#balgo",box).onclick=()=>{const r0=R; tween(sv,1.8,e=>{R=r0+(120-r0)*e; draw();});}; $("#balrs",box).onclick=()=>{R=R0; draw();};},
quiz:[{q:"풍선 모형에서 붙임딱지가 나타내는 것은?",o:["은하","별","우주"],a:0,why:"붙임딱지는 은하, 풍선 표면은 우주를 나타내요."},
      {q:"풍선을 부풀렸을 때 처음 거리가 먼 붙임딱지 사이일수록 늘어난 거리는?",o:["더 크다","더 작다","모두 같다"],a:0,why:"처음에 멀리 떨어져 있던 것일수록 더 많이 멀어져요. 표에서 A–D가 가장 많이 늘어났어요."},
      {q:"대부분의 외부 은하가 우리은하로부터 멀어지는 까닭은?",o:["우주가 팽창하기 때문","우리은하가 우주의 중심이기 때문","은하가 점점 커지기 때문"],a:0,why:"우주가 팽창하여 은하 사이의 거리가 멀어지기 때문이에요. 우리은하가 중심인 것은 아니에요."}]});

add({id:"s7-2",part:"7. 우주의 팽창",no:"7-2",title:"빅뱅(대폭발) 이론",html:`
<p class="mt0">우주가 지금 팽창하고 있다면, 시간을 거꾸로 돌리면 어떻게 될까요? 밀대를 움직이거나 버튼을 눌러 보세요.</p>
<div class="vis"><svg id="bb" viewBox="0 0 520 290" role="img" aria-label="빅뱅부터 현재까지 우주의 변화"></svg>
<div class="ctrl"><label>약 138억 년 전 <input type="range" id="bbt" min="0" max="100" value="100" style="width:200px;vertical-align:middle"> 현재</label></div>
<div class="ctrl"><button class="btn ghost" id="bbrew">◀ 과거로 되감기</button><button class="btn" id="bbplay">▶ 빅뱅부터 재생</button></div><div class="cap">그림의 가운데가 우주의 중심이라는 뜻은 아니에요. 우주 전체가 함께 팽창해요.</div><div class="stepbox" id="bbtx"></div></div>
<div class="book"><b class="lbl">교과서 말로는</b><b>빅뱅(대폭발) 이론</b>: 우주가 매우 뜨겁고 밀도가 큰 한 점에서 대폭발이 일어나 만들어졌으며, 점차 팽창하여 현재와 같은 모습으로 되었다는 이론. 대폭발은 약 <b>138억 년 전</b>에 일어났으며, 대폭발 이후 우주는 점차 식어서 별과 은하가 만들어졌다.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>• 과거의 우주는 지금보다 <b>작고, 뜨겁고, 밀도가 컸어요</b>.<br>• 외부 은하들은 우리은하에 <b>접근하는 것이 아니라</b> 대부분 멀어지고 있어요.<br>• 우리은하가 팽창의 중심인 것이 아니에요.</div>`,
init(box){const sv=$("#bb",box), r=$("#bbt",box); const R=rng(91); const G=[...Array(26)].map(()=>[(R()-.5)*2,(R()-.5)*2,Math.floor(R()*4),R()]);
 const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
 const draw=()=>{const t=+r.value/100, a=0.03+0.97*t; const hot=Math.max(0,1-t*2.2);
  const bg=`rgb(${lerp(15,255,hot)},${lerp(21,190,hot)},${lerp(48,90,hot)})`;
  let s=`<rect width="520" height="290" rx="12" fill="${bg}"/>`;
  if(t<0.06) s+=`<circle cx="260" cy="140" r="${(10+t*200).toFixed(1)}" fill="#FFF8E0"/><circle cx="260" cy="140" r="${(30+t*300).toFixed(1)}" fill="#FFF8E0" opacity=".35"/>`;
  G.forEach(([x,y,k,q])=>{const X=260+x*230*a, Y=140+y*120*a; if(t<0.35) s+=`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="2.5" fill="#FFF3C4" opacity="${(0.4+q*0.6).toFixed(2)}"/>`;
   else s+=`<g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)}) rotate(${Math.round(q*180)}) scale(1 .6)" opacity="${Math.min(1,(t-0.35)*4).toFixed(2)}">${galaxy(["ellip","spiral","bar","irr"][k],9,Math.round(q*100)+1,{})}</g>`;});
  s+=txt(260,278,t<0.06?"매우 뜨겁고 밀도가 큰 한 점 → 대폭발":t<0.35?"팽창하면서 점점 식어요":"별과 은하가 만들어지고 계속 팽창해요",{s:15,w:700,c:t<0.2?"#3A1A00":"#FFD98A"});
  sv.innerHTML=s;
  $("#bbtx",box).innerHTML=t<0.06?"약 <b>138억 년 전</b>: 우주의 모든 물질이 <b>매우 뜨겁고 밀도가 큰 한 점</b>에 모여 있다가 대폭발이 일어났어요.":t<0.35?"우주가 <b>팽창</b>하면서 크기는 커지고 온도는 <b>낮아졌어요</b>.":"우주가 식으면서 <b>별과 은하</b>가 만들어졌고, 지금도 우주는 <b>팽창</b>하고 있어요.";};
 r.oninput=draw; draw();
 const anim=(from,to)=>tween(sv,3,e=>{r.value=from+(to-from)*e; draw();});
 $("#bbrew",box).onclick=()=>anim(+r.value,0); $("#bbplay",box).onclick=()=>anim(0,100);},
quiz:[{q:"빅뱅 이론에 따르면 대폭발이 일어난 시기는?",o:["약 46억 년 전","약 138억 년 전","약 1만 년 전"],a:1,why:"대폭발은 약 138억 년 전에 일어났어요. 46억 년은 지구가 만들어진 무렵이에요."},
      {q:"빅뱅 이론에 대한 설명으로 옳지 않은 것은?",o:["현재 우주는 팽창하고 있다","현재 외부 은하들은 모두 우리은하에 접근하고 있다","대폭발 당시 우주의 온도는 현재보다 높았다"],a:1,why:"대부분의 외부 은하는 우리은하로부터 멀어지고 있어요."},
      {q:"과거로 갈수록 우주의 모습은?",o:["크기는 작고 온도는 높다","크기는 크고 온도는 낮다","지금과 같다"],a:0,why:"과거로 거슬러 가면 우주는 크기가 점차 작아지면서 뜨거워져요."}]});

/* =========== 8. 우주 탐사 =========== */
add({id:"s8-1",part:"8. 우주 탐사",no:"8-1",title:"우주를 탐사하는 까닭",html:`
<p class="mt0">인간은 오래전부터 태양, 달, 별, 행성의 움직임을 관측했고, 오늘날에는 인공위성과 탐사선을 보내 우주를 탐사해요. 1969년에는 <b>아폴로 11호</b>가 달에 착륙하여 탐사했어요. 왜 우주를 탐사할까요? 카드를 눌러 보세요.</p>
<div class="cards" id="pur"></div>
<div class="book"><b class="lbl">교과서 말로는</b>우주를 탐사함으로써 지구의 과거와 미래, 우주 환경에 관해 더 깊이 이해하게 되었다. 또, 지구가 아닌 다른 천체에도 생명체가 살고 있는지 알아보고, 지구에서 얻기 어렵거나 고갈되어 가는 지하자원을 채취하기 위해서 우주를 탐사하고 있다.</div>`,
init(box){const P=[["지구와 우주 이해","지구의 과거와 미래, 우주 환경을 더 깊이 이해할 수 있어요.",`<circle cx="40" cy="30" r="20" fill="#4FA3FF"/><path d="M26 24 q8 -6 14 2 q6 8 14 0" stroke="#7FD18B" stroke-width="5" fill="none"/>`],["생명체 찾기","지구가 아닌 다른 천체에도 생명체가 살고 있는지 알아봐요.",`<circle cx="40" cy="30" r="20" fill="#D9744A"/><circle cx="34" cy="26" r="4" fill="#9B4A2C"/><circle cx="48" cy="36" r="3" fill="#9B4A2C"/>`],["자원 채취","지구에서 얻기 어렵거나 고갈되어 가는 지하자원을 얻으려고 해요.",`<polygon points="40,10 58,40 22,40" fill="#9FA8C8"/><polygon points="40,18 50,36 30,36" fill="#FFD98A"/>`]];
 const w=$("#pur",box); P.forEach(([n,d,ic],i)=>{let s=0; const c=el(`<div class="card fade-in" style="animation-delay:${i*.15}s"><svg viewBox="0 0 80 60" width="80" height="60" aria-hidden="true">${ic}</svg><b>${n}</b><div class="body" style="font-size:14px;min-height:3em"></div><button class="btn ghost">자세히</button></div>`);
  c.querySelector("button").onclick=()=>{s=1-s; c.querySelector(".body").innerHTML=s?`<span class="fade-in" style="display:block">${d}</span>`:""; c.querySelector("button").textContent=s?"접기":"자세히";}; w.appendChild(c);});},
quiz:[{q:"우주를 탐사하는 목적이 아닌 것은?",o:["다른 천체에 생명체가 사는지 알아보기","지구에서 고갈되어 가는 자원 채취하기","지구의 자전을 멈추게 하기","지구의 과거와 미래 이해하기"],a:2,why:"우주 탐사는 지구와 우주 이해, 생명체 탐사, 자원 채취 등을 위해 해요."}]});

add({id:"s8-2",part:"8. 우주 탐사",no:"8-2",title:"우주를 탐사하는 방법",html:`
<p class="mt0">맨눈 → 천체 망원경 → 우주 망원경과 탐사선으로 우주를 점점 더 자세히 알게 되었어요. 애니메이션을 보며 각 방법이 어디에서 우주를 보는지 확인하세요.</p>
<div class="vis"><svg id="exp" viewBox="0 0 520 290" role="img" aria-label="전파 망원경, 우주 망원경, 탐사선"></svg><div class="ctrl"><button class="btn ghost" data-m="0">전파 망원경</button><button class="btn ghost" data-m="1">우주 망원경</button><button class="btn ghost" data-m="2">우주 탐사선</button></div><div class="stepbox" id="expt">버튼을 눌러 보세요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>지구 대기권 밖의 우주 공간에서 천체를 관측하는 <b>우주 망원경</b>과 태양계 공간으로 발사한 <b>탐사선</b>을 이용하여 인간은 우주를 보다 자세하게 탐사하고 있다. 1960년대에 최초의 우주 망원경이 발사된 이후 허블 우주 망원경, 스피처 우주 망원경, 케플러 우주 망원경 등이 탐사 활동을 하고 있다.<br><span style="font-size:14px;color:var(--muted)">(덧붙임: 스피처·케플러 우주 망원경은 지금은 임무를 마쳤고, 2021년에 발사된 제임스 웹 우주 망원경이 관측하고 있어요.)</span></div>
<div class="easy"><b class="lbl">뉴호라이즌스호</b>2006년에 지구를 출발해 9년 뒤인 <b>2015년 명왕성에 가까이 접근</b>하여 명왕성 표면을 자세하게 촬영한 사진을 지구로 보냈어요. 지금은 명왕성을 지나 태양계의 끝을 향해 가고 있어요.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>뉴호라이즌스호는 명왕성에 <b>착륙한 것이 아니라</b> 가까이 지나가면서(접근하여) 촬영했어요.</div>`,
init(box){const sv=$("#exp",box); const D=[["전파 망원경","지상에서 천체가 내는 <b>전파</b>를 관측해요. 땅 위에 있어서 크게 만들 수 있어요."],["우주 망원경","지구 <b>대기권 밖</b>에서 관측해요. <b>대기의 영향을 받지 않아</b> 천체를 더 선명하게 볼 수 있어요. 예: 허블·스피처·케플러 우주 망원경"],["우주 탐사선","천체 가까이 <b>직접 가서</b> 관측하거나 물질을 채취해요. 예: 뉴호라이즌스호(명왕성 접근)"]];
 let mode=-1;
 const draw=t=>{let s=skyRect(520,290)+bgStars(40,0,0,520,170,101,0.9)+`<path d="M0 290 L0 230 Q260 170 520 230 L520 290Z" fill="#2E5FA8"/><path d="M-20 240 Q260 140 540 240" stroke="#9FD3FF" stroke-width="22" fill="none" opacity=".18"/>`+txt(470,196,"대기",{s:12,c:"#9FD3FF"})+txt(260,272,"지구",{s:14,c:"#E8EBF7"});
  s+=`<g opacity="${mode===0?1:.45}"><path d="M110 222 q20 -26 40 0z" fill="#E8EBF7"/><line x1="130" y1="214" x2="130" y2="232" stroke="#E8EBF7" stroke-width="3"/></g>`;
  const u=(Math.sin(t*0.6)+1)/2, ox=40+440*u, oy=(1-u)*(1-u)*196+2*(1-u)*u*96+u*u*196; s+=`<path d="M40 196 Q260 96 480 196" fill="none" stroke="${SKYM}" stroke-dasharray="3 6" opacity=".6"/><g opacity="${mode===1?1:.45}" transform="translate(${ox.toFixed(1)} ${oy.toFixed(1)})"><rect x="-10" y="-5" width="20" height="10" rx="2" fill="#E8EBF7"/><rect x="-26" y="-3" width="13" height="6" fill="#7FA8FF"/><rect x="13" y="-3" width="13" height="6" fill="#7FA8FF"/></g>`;
  const px=330+((t*40)%160), py=90-((t*40)%160)*0.45; s+=`<circle cx="490" cy="30" r="12" fill="#C9A98A"/>`+txt(490,58,"명왕성",{s:11,c:SKYM})+`<g opacity="${mode===2?1:.45}" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(-25)"><polygon points="0,-6 14,0 0,6" fill="#FFD98A"/><rect x="-8" y="-4" width="8" height="8" fill="#E8EBF7"/></g>`;
  if(mode===0) s+=`<path d="M130 210 L200 60" stroke="#FFD98A" stroke-dasharray="4 6" stroke-width="2"/>`;
  sv.innerHTML=s;};
 loop(sv,t=>{draw(REDUCE?0:t);});
 box.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=+b.dataset.m; $("#expt",box).innerHTML=`<b>${D[mode][0]}</b>: ${D[mode][1]}`; box.querySelectorAll("[data-m]").forEach(x=>x.className="btn "+(x===b?"":"ghost"));});},
quiz:[{q:"지구 대기의 영향을 받지 않고 천체를 관측할 수 있는 방법은?",o:["우주 망원경","지상의 천체 망원경","맨눈 관측"],a:0,why:"우주 망원경은 대기권 밖에 있어서 대기의 영향을 받지 않아요."},
      {q:"뉴호라이즌스호에 대한 설명으로 옳은 것은?",o:["2015년 명왕성에 가까이 접근하여 표면을 촬영했다","명왕성에 착륙하여 물질을 채취했다","지구 궤도를 도는 우주 망원경이다"],a:0,why:"뉴호라이즌스호는 2015년 명왕성에 가까이 접근해 표면 사진을 보낸 탐사선이에요. 착륙하지 않았어요."}]});

add({id:"s8-3",part:"8. 우주 탐사",no:"8-3",title:"우주 탐사가 주는 영향",html:`
<p class="mt0">우주 탐사는 우리 생활과 과학에 여러 영향을 줘요. 아래 사례를 <b>긍정적 영향</b>과 <b>부정적 영향</b>으로 분류해 보세요.</p>
<div class="vis" style="text-align:left"><div id="sortq"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div style="border:2px solid var(--ok);border-radius:10px;padding:8px;min-height:80px"><b style="color:var(--ok)">긍정적 영향</b><div id="posb" style="font-size:14px"></div></div><div style="border:2px solid var(--bad);border-radius:10px;padding:8px;min-height:80px"><b style="color:var(--bad)">부정적 영향</b><div id="negb" style="font-size:14px"></div></div></div></div>
<div class="vis"><svg id="deb" viewBox="0 0 520 240" role="img" aria-label="지구 주위를 도는 우주 쓰레기"></svg><div class="cap">우주 쓰레기는 지구 주위를 매우 빠른 속도로 돌면서 인공위성이나 탐사선에 피해를 줄 수 있어요.</div></div>
<div class="book"><b class="lbl">교과서 말로는</b>
• 우주 정거장은 <b>무중력 상태</b>이므로 지상에서 하기 어려운 과학 실험, 신약 개발, 신소재 개발, 우주 환경 연구 등을 한다.<br>
• 탐사선이 관측하거나 채취한 물질은 태양계의 형성 과정과 구성 천체를 이해하는 데 도움을 준다.<br>
• 우주 탐사 과정에서 얻은 첨단 기술은 생활을 편리하게 해 준다. (예: 정수기, 전자레인지, 형상 기억 합금, 헤드셋)<br>
• 부정적 영향: 우주 탐사 과정에서 생긴 <b>우주 쓰레기</b>는 운행 중인 인공위성이나 탐사선에 치명적인 피해를 입힐 수 있다.</div>`,
init(box){const items=[["인공위성으로 지구 반대편에서 하는 경기를 실시간으로 시청한다",1],["내비게이션을 이용해 편리하게 목적지를 찾아간다",1],["버려진 로켓 부품이 빠르게 돌며 인공위성에 부딪힐 수 있다",0],["우주 정거장의 무중력 상태에서 신약과 신소재를 연구한다",1],["탐사선이 채취한 물질로 태양계의 형성 과정을 이해한다",1],["인공위성에서 떨어져 나온 페인트 조각, 나사가 지구 궤도를 돈다",0],["우주 기술을 활용한 정수기, 형상 기억 합금을 생활에서 쓴다",1]];
 let i=0; const q=$("#sortq",box);
 const show=()=>{if(i>=items.length){q.innerHTML=`<div class="stepbox fade-in"><b>모두 분류했어요!</b> 우주 탐사는 부정적인 영향도 있지만, 생활에 주는 혜택과 과학·우주 산업의 발전 등 긍정적인 영향이 커요. <button class="btn ghost" style="padding:4px 12px">다시 하기</button></div>`; q.querySelector("button").onclick=()=>{i=0; $("#posb",box).innerHTML=""; $("#negb",box).innerHTML=""; show();}; return;}
  const [t,p]=items[i]; q.innerHTML=`<div class="stepbox fade-in"><b>${i+1}/${items.length}.</b> ${t}<div class="ctrl" style="justify-content:flex-start"><button class="btn ghost" data-v="1">긍정적 영향</button><button class="btn ghost" data-v="0">부정적 영향</button></div><div class="fbm" style="font-size:14px"></div></div>`;
  q.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.v===p; const f=q.querySelector(".fbm"); if(!ok){f.innerHTML=`<span style="color:var(--bad);font-weight:700">다시 생각해 보세요.</span> ${p?"우리 생활이나 과학에 도움이 되는 일이에요.":"인공위성이나 탐사선에 피해를 줄 수 있는 우주 쓰레기예요."}`; return;}
   $(p?"#posb":"#negb",box).appendChild(el(`<div class="fade-in">• ${t}</div>`)); i++; show();});};
 show();
 const sv=$("#deb",box); const R=rng(111); const D=[...Array(40)].map(()=>[60+R()*70,R()*6.28,0.6+R()*1.4,0.2+R()*0.5]);
 loop(sv,t=>{let s=skyRect(520,240)+bgStars(25,0,0,520,240,113,0.7)+`<circle cx="260" cy="120" r="44" fill="#2E5FA8"/><path d="M232 104 q12 -10 24 2 q10 10 24 0" stroke="#7FD18B" stroke-width="7" fill="none"/>`;
  D.forEach(([r,p,sp,tl])=>{const a=p+(REDUCE?0:t)*sp; s+=`<rect x="${(260+r*1.6*Math.cos(a)).toFixed(1)}" y="${(120+r*tl*1.2*Math.sin(a)).toFixed(1)}" width="3" height="3" fill="#C9B79C"/>`;});
  const a=(REDUCE?0:t)*0.5; s+=`<g transform="translate(${(260+150*Math.cos(a)).toFixed(1)} ${(120+40*Math.sin(a)).toFixed(1)})"><rect x="-6" y="-4" width="12" height="8" fill="#E8EBF7"/><rect x="-18" y="-2" width="10" height="4" fill="#7FA8FF"/><rect x="8" y="-2" width="10" height="4" fill="#7FA8FF"/></g>`+txt(70,30,"■ 우주 쓰레기",{s:12,c:"#C9B79C",a:"start"})+txt(70,50,"▭ 인공위성",{s:12,c:"#E8EBF7",a:"start"}); sv.innerHTML=s;});},
quiz:[{q:"우주 탐사의 부정적인 영향으로 알맞은 것은?",o:["우주 쓰레기가 인공위성에 피해를 줄 수 있다","내비게이션을 쓸 수 있다","신소재를 개발할 수 있다"],a:0,why:"우주 쓰레기는 지구 주위를 매우 빠르게 돌며 인공위성이나 탐사선에 피해를 줄 수 있어요."},

add({id:"send-3",part:"마무리",no:"★3",title:"나의 학습 현황",html:`

<div class="tablewrap"><table class="t" id="rep" style="margin-left:0"></table></div>
<div class="ctrl" style="justify-content:flex-start"><button class="btn ghost" id="resetall">기록 모두 지우기</button><span id="resetmsg" style="font-size:14px;color:var(--muted);align-self:center"></span></div>`,
init(box){const t=$("#rep",box); t.innerHTML="<tr><th>레슨</th><th>제목</th><th>확인 문제</th></tr>"+L.filter(x=>x.quiz).map(x=>{const r=S.quiz[x.id]; const n=x.quiz.length; const c=r?Object.values(r).filter(v=>v).length:0; const tried=r?Object.keys(r).length:0;
  const col=!tried?"var(--muted)":c===n?"var(--ok)":"var(--bad)"; return `<tr><td>${x.no}</td><td style="text-align:left"><a href="#${x.id}">${x.title}</a></td><td style="color:${col};font-weight:700">${tried?c+" / "+n:"아직 안 풀었어요"}</td></tr>`;}).join("");
 let armed=false; $("#resetall",box).onclick=()=>{if(!armed){armed=true; $("#resetmsg",box).textContent="한 번 더 누르면 모든 기록이 지워져요."; return;} S={done:{},quiz:{},can:{}}; save(); $("#resetmsg",box).textContent="기록을 지웠어요."; armed=false; updateProg(); renderToc();};}});

const CAN={"1. 별까지의 거리":["시차가 생기는 원리를 설명할 수 있다","물체까지의 거리와 시차의 관계(가까울수록 크다)를 말할 수 있다","연주 시차의 뜻(6개월 간격 시차의 1/2)과 생기는 까닭(지구의 공전)을 설명할 수 있다","연주 시차로 별까지의 거리(pc)를 구할 수 있다"],
 "2. 별의 밝기와 등급":["별의 밝기가 거리의 제곱에 반비례함을 설명할 수 있다","등급이 작을수록 밝고, 1 등급 차이가 약 2.5배, 5 등급 차이가 100배임을 안다","겉보기 등급과 절대 등급의 뜻을 구별할 수 있다","두 등급을 비교해 별이 10 pc보다 가까운지 먼지 판단할 수 있다"],

/* ================= 화면 그리기 ================= */
function shuf(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1)); const x=a[i]; a[i]=a[k]; a[k]=x;} return a;}
function lessonIndex(id){return Math.max(0,L.findIndex(x=>x.id===id));}
function renderToc(){const toc=$("#toc"); let h=`<button class="tocbtn closer" id="tocclose">닫기 ✕</button>`; let part="";
 L.forEach(x=>{if(x.part!==part){part=x.part; h+=`<h3>${part}</h3>`;} const q=S.quiz[x.id]; const ok=x.quiz&&q&&Object.keys(q).length===x.quiz.length&&Object.values(q).every(v=>v);
  const st=S.done[x.id]?(ok?"✔":x.quiz?"●":"✔"):""; h+=`<a href="#${x.id}" data-id="${x.id}"><span class="n">${x.no}</span><span>${x.title}</span><span class="st">${st}</span></a>`;});
 toc.innerHTML=h; const cl=$("#tocclose"); if(cl) cl.onclick=()=>toc.classList.remove("open");
 toc.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>toc.classList.remove("open")));
 markCur();}
function markCur(){const id=cur().id; document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("cur",a.dataset.id===id));}
function cur(){const id=(location.hash||"").slice(1); return L[lessonIndex(id||"sstart")]||L[0];}
function updateProg(){const n=L.length, d=L.filter(x=>S.done[x.id]).length; $("#progbar").style.width=(d/n*100)+"%"; $("#progtxt").textContent=d+" / "+n;}
function renderLesson(){const x=cur(), i=L.indexOf(x), box=$("#lesson");
 let h=`<div class="crumb">${x.part} · ${x.no}</div><h2>${x.title}</h2>${x.html}`;
 if(x.quiz){h+=`<section class="quiz"><h3>확인 문제</h3>${x.quiz.map((q,k)=>`<div class="qitem" data-k="${k}"><div class="qq">${k+1}. ${q.q}</div><div class="opts">${shuf(q.o.map((o,j)=>[o,j])).map(([o,j])=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div><div class="fb"></div></div>`).join("")}</section>`;}
 const last=i===L.length-1||L[i+1].part!==x.part;
 if(last&&CAN[x.part]){h+=`<section class="can"><h3>할 수 있어요 체크 · ${x.part}</h3><p style="margin:4px 0 6px;font-size:14px;color:var(--muted)">자신 있게 할 수 있는 것에 체크하세요. 체크하지 못한 것은 해당 레슨을 다시 보세요.</p>${CAN[x.part].map((c,j)=>{const id=`can-${x.part.slice(0,2)}-${j}`; return `<label for="${id}"><input type="checkbox" id="${id}" data-key="${id}" ${S.can[id]?"checked":""}><span>${c}</span></label>`;}).join("")}</section>`;}
 h+=`<nav class="pager">${i>0?`<a class="btn ghost" href="#${L[i-1].id}" style="text-decoration:none">◀ 이전: ${L[i-1].title}</a>`:"<span></span>"}${i<L.length-1?`<a class="btn" href="#${L[i+1].id}" style="text-decoration:none">다음: ${L[i+1].title} ▶</a>`:""}</nav>`;
 h+=`<footer class="srcfoot">${SRC_FULL}</footer>`;
 box.innerHTML='<div class="lesson-inner">'+h+'</div>'; const inner=box.firstElementChild;
 if(x.init) try{x.init(inner);}catch(e){console.error(e);}
 box.querySelectorAll(".qitem").forEach(qi=>{const k=+qi.dataset.k, q=x.quiz[k];
