add({id:"l7-1",part:"7. 반성유전",no:"7-1",title:"성염색체와 성별",html:`
<p class="mt0">사람의 염색체 중 성별을 정하는 한 쌍을 <b>성염색체</b>라고 해요. 여자는 <b>XX</b>, 남자는 <b>XY</b>예요.</p>
<div class="vis" id="sexbox"></div>
<div class="easy"><b class="lbl">꼭 기억할 것</b>• <b>아들</b>: 엄마에게서 <b>X</b>, 아빠에게서 <b>Y</b>를 받아요.<br>• <b>딸</b>: 엄마에게서 X, 아빠에게서 <b>X</b>를 받아요.<br>→ 아빠의 X는 <b>딸에게만</b>, 아빠의 Y는 <b>아들에게만</b> 가요.</div>`,
init(box){punnett($("#sexbox",box),{left:["X","X"],top:["X","Y"],leftName:"어머니(XX)의 난자",topName:"아버지(XY)의 정자",fmt:x=>`<span class="g">${x}</span>`,
 cell:(a,b)=>{const t=a+b; return {t:`<span class="g">${t}</span>`,sub:b==="Y"?"아들":"딸",key:t,ph:b==="Y"?"아들":"딸"};},
 summary:c=>{const p=countBy(c,x=>x.ph); return "아들 : 딸 = "+(p.get("아들")||0)+" : "+(p.get("딸")||0)+" = <b>1 : 1</b>. 아들의 Y는 아버지에게서, 딸의 X 하나는 아버지에게서 왔어요.";}});},
quiz:[{q:"아들은 X 염색체를 누구에게서 받을까요?",o:["아버지","어머니"],a:1,why:"아들은 아버지에게서 Y, 어머니에게서 X를 받아요."}]});

add({id:"l7-2",part:"7. 반성유전",no:"7-2",title:"적록 색맹과 보인자",html:`
<p class="mt0"><b>적록 색맹</b>은 붉은색과 초록색을 잘 구별하지 못하는 유전 형질이에요. 색맹 유전자는 <b>X 염색체</b>에 있고, 색맹 대립유전자(<span class="rec g">X′</span>)는 정상 대립유전자(<span class="g">X</span>)에 대해 <b>열성</b>이에요.</p>
<div class="vis"><svg viewBox="0 0 540 230" role="img" aria-label="색맹 유전자형과 표현형">
${[["XY",40,"정상 남자",0],["X′Y",150,"색맹 남자",1],["XX",290,"정상 여자",0],["XX′",390,"정상 여자 (보인자)",0],["X′X′",490,"색맹 여자",1]].map(([gt,x,t,f],i)=>{
 const ch=gt.match(/X′|X|Y/g); return `<g class="fade-in" style="animation-delay:${i*.2}s">${ch.map((c,j)=>`<rect x="${x-24+j*26}" y="${c==="Y"?44:30}" width="20" height="${c==="Y"?46:60}" rx="10" fill="${c==="X′"?"color-mix(in srgb,var(--rec) 30%,var(--surface))":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x-14+j*26}" y="${c==="Y"?75:66}" text-anchor="middle" class="svgmono" font-size="13" fill="${c==="X′"?"var(--rec)":"var(--ink)"}">${c}</text>`).join("")}<text x="${x}" y="120" text-anchor="middle" class="svgmono" font-size="15" fill="var(--ink)">${gt}</text><text x="${x}" y="142" text-anchor="middle" class="svgtxt" font-size="12" fill="${f?"var(--bad)":"var(--ink)"}">${t}</text></g>`;}).join("")}
<text x="270" y="190" text-anchor="middle" class="svgtxt" font-size="14">남자는 X가 1개 → X′ 하나만 있어도 색맹</text>
<text x="270" y="214" text-anchor="middle" class="svgtxt" font-size="14">여자는 X가 2개 → 둘 다 X′여야 색맹</text>
</svg></div>
<div class="book"><b class="lbl">교과서 말로는</b><b>반성유전</b>: 유전자가 성염색체에 있어 유전 형질이 나타나는 빈도가 남녀에 따라 차이가 나는 유전 현상. 예: 적록 색맹, 혈우병<br><b>보인자</b>: X 염색체 하나에만 색맹 대립유전자가 있는 여자(XX′). 정상인처럼 색을 구별할 수 있다.</div>
<div class="warn"><b class="lbl">자주 하는 실수</b>보인자(XX′)의 표현형은 <b>정상</b>이에요. '보인자'는 표현형이 아니라 색맹 대립유전자를 숨기고 있다는 뜻이에요.</div>
<div class="easy"><b class="lbl">왜 남자에게 더 많을까?</b>남자는 X가 하나뿐이라 X′를 하나만 받아도 색맹이 되지만, 여자는 X′를 두 개 받아야 색맹이 되기 때문이에요.</div>`,
quiz:[{q:"XX′인 여자의 표현형은?",o:["색맹","정상(보인자)"],a:1,why:"X′는 열성이라 X가 하나라도 있으면 정상이에요. 이런 여자를 보인자라고 해요."},
      {q:"적록 색맹이 여자보다 남자에게 많이 나타나는 까닭은?",o:["남자는 X 염색체가 1개라서","남자는 X 염색체가 2개라서","색맹 유전자가 Y에 있어서"],a:0,why:"남자는 X가 1개라서 X′ 하나만 있어도 색맹이 돼요. 색맹 유전자는 X 염색체에 있어요."}]});

add({id:"l7-3",part:"7. 반성유전",no:"7-3",title:"색맹 자녀 예측기",html:`
<p class="mt0">부모의 유전자형을 골라 아들과 딸이 색맹일지 예측해 보세요.</p>
<div class="vis"><div class="ctrl" style="margin-top:0"><label>어머니 <select id="cbm"><option value="XX">XX (정상)</option><option value="XX′">XX′ (보인자)</option><option value="X′X′">X′X′ (색맹)</option></select></label>
<label>아버지 <select id="cbf"><option value="XY">XY (정상)</option><option value="X′Y">X′Y (색맹)</option></select></label></div><div id="cbbox" style="margin-top:10px"></div></div>
<div class="easy"><b class="lbl">규칙 찾기</b>• 어머니가 X′X′(색맹)이면 <b>아들은 모두 색맹</b>이에요(아들의 X는 어머니에게서 오니까).<br>• 아버지가 X′Y(색맹)이면 <b>딸은 모두 X′를 가져요</b>(아버지의 X는 딸에게 가니까).<br>• 아버지가 색맹이어도 <b>아들은 아버지에게서 색맹 대립유전자를 받지 않아요</b>.</div>`,
init(box){const split=s=>s.match(/X′|X|Y/g); const ph=t=>{if(t.includes("Y")) return t.startsWith("X′")?"색맹 아들":"정상 아들"; const n=(t.match(/X′/g)||[]).length; return n===2?"색맹 딸":n===1?"보인자 딸":"정상 딸";};
 const go=()=>{const m=$("#cbm",box).value, f=$("#cbf",box).value;
  punnett($("#cbbox",box),{left:split(m),top:split(f),leftName:"어머니("+m+")의 난자",topName:"아버지("+f+")의 정자",fmt:x=>x==="X′"?`<span class="g rec">X′</span>`:`<span class="g">${x}</span>`,
   cell:(a,b)=>{let t; if(b==="Y") t=a+"Y"; else t=(a==="X"||b==="X′")?a+b:b+a; t=t.replace("X′X","XX′"); return {t:`<span class="g">${t.replace(/X′/g,"<span class='rec'>X′</span>")}</span>`,sub:ph(t),key:t,ph:ph(t)};},
   summary:c=>{const p=countBy(c,x=>x.ph); return [...p].map(([k,v])=>`<span class="chip">${k} ${v}칸</span>`).join(" ");}});};
 $("#cbm",box).onchange=go; $("#cbf",box).onchange=go; $("#cbm",box).value="XX′"; go();},
quiz:[{q:"보인자 어머니(XX′)와 정상 아버지(XY)의 아들이 색맹일 확률은?",o:["0%","25%","50%"],a:2,why:"아들은 어머니에게서 X 또는 X′를 1/2씩 받으므로, 아들 중 색맹일 확률은 50%예요. (전체 자녀 중 색맹 아들일 확률은 25%예요. 무엇을 묻는지 잘 보세요!)"},
      {q:"색맹 아버지(X′Y)와 정상 어머니(XX)의 딸은?",o:["모두 색맹","모두 보인자","모두 정상이고 X′가 없다"],a:1,why:"딸은 아버지에게서 반드시 X′를 받고 어머니에게서 X를 받아 XX′(보인자)가 돼요."}]});

add({id:"l7-4",part:"7. 반성유전",no:"7-4",title:"혈우병과 빅토리아 여왕",html:`
<p class="mt0"><b>혈우병</b>은 혈액이 잘 응고되지 않아 상처가 나면 출혈이 잘 멈추지 않는 병이에요. 적록 색맹과 마찬가지로 유전자가 <b>X 염색체</b>에 있고, 혈우병 대립유전자는 <b>열성</b>이에요.</p>
<div class="vis"><svg id="vic" viewBox="0 0 540 335" role="img" aria-label="혈우병 대립유전자 전달 경로"></svg>
<div class="ctrl"><button class="btn" id="vicgo">전달 경로 따라가기</button></div><div class="stepbox" id="victxt">영국의 빅토리아 여왕은 혈우병 대립유전자를 가진 보인자였어요.</div></div>
<div class="easy"><b class="lbl">핵심</b>보인자인 엄마 → 딸(보인자)에게 전달 → 그 딸의 아들에게서 혈우병이 나타날 수 있어요. 혈우병 대립유전자는 <b>여자(보인자)를 통해</b> 다음 세대 남자에게 전달되는 경우가 많아요.</div>`,
init(box){const sv=$("#vic",box);
 const N={1:{s:"f",x:130,y:40,f:0,u:"빅토리아 여왕 (보인자)"},2:{s:"m",x:260,y:40,f:0},3:{s:"f",x:195,y:125,f:0,u:"딸 (보인자)"},4:{s:"m",x:330,y:125,f:0},5:{s:"f",x:262,y:210,f:0,u:"손녀 (보인자)"},7:{s:"m",x:420,y:210,f:0},6:{s:"m",x:341,y:295,f:1,u:"증손자 (혈우병)"}};
 const base=()=>drawPed(N,[[1,2,[3]],[3,4,[5]],[5,7,[6]]],[],{},null,260);
 sv.innerHTML=base();
 $("#vicgo",box).onclick=()=>{const seq=[[1],[1,3],[1,3,5],[1,3,5,6]]; const msg=["① 빅토리아 여왕(XX′)이 X′를 가지고 있었어요.","② 딸에게 X′가 전해졌어요. 딸은 보인자(XX′)예요.","③ 손녀에게도 X′가 전해졌어요. 손녀도 보인자예요.","④ 보인자 어머니에게서 X′를 받은 아들에게 혈우병이 나타났어요(실제 역사: 러시아의 알렉세이 왕자)."];
  let i=0; const step=()=>{sv.innerHTML=drawPed(N,[[1,2,[3]],[3,4,[5]],[5,7,[6]]],seq[i],{},null,260); $("#victxt",box).innerHTML=msg[i]; i++; if(i<seq.length) setTimeout(step,1500);}; step();};},
quiz:[{q:"혈우병 유전자가 있는 염색체는?",o:["상염색체","X 염색체","Y 염색체"],a:1,why:"혈우병도 적록 색맹처럼 X 염색체에 유전자가 있는 반성유전이에요."}]});

/* ---------- 8. 가계도 분석 비법 ---------- */
add({id:"l8-1",part:"8. 가계도 분석 비법",no:"8-1",title:"3단계 비법",html:`
<p class="mt0">어떤 가계도 문제든 이 3단계로 풀 수 있어요.</p>
<div class="cards">
<div class="card fade-in" style="text-align:left"><b>1단계 우열 찾기</b><span style="font-size:14px">부모에게 없던 형질이 자녀에게 나타나면 그 형질은 <b>열성</b>이에요.</span></div>
<div class="card fade-in" style="animation-delay:.2s;text-align:left"><b>2단계 상염색체? X?</b><span style="font-size:14px">X 염색체 유전이라고 가정하고 모순이 있는지 찾아요.<br>• 열성인 <b>딸</b>의 아버지가 우성(정상)이면 → X가 아님<br>• 열성인 <b>어머니</b>의 아들이 우성(정상)이면 → X가 아님</span></div>
<div class="card fade-in" style="animation-delay:.4s;text-align:left"><b>3단계 유전자형 쓰기</b><span style="font-size:14px">• 열성 형질인 사람은 순종(aa)<br>• 열성인 부모나 자녀가 있는 우성인 사람은 잡종(Aa)<br>• 그래도 모르면 '확실히 알 수 없음'</span></div></div>
<div class="easy"><b class="lbl">2단계가 왜 그럴까?</b>X 염색체 유전이라면 딸은 아버지의 X를 <b>반드시</b> 받아요. 딸이 열성(X′X′)이려면 아버지도 X′Y(열성)여야 해요. 그런데 아버지가 정상이면 말이 안 되니까 X 염색체 유전이 아니에요.</div>`,
quiz:[{q:"열성 형질인 딸의 아버지가 정상(우성)이라면, 이 형질의 유전자는?",o:["X 염색체에 있다","상염색체에 있다"],a:1,why:"X 염색체 유전이라면 열성 딸(X′X′)의 아버지는 반드시 X′Y여야 해요. 아버지가 정상이니 상염색체 유전이에요."}]});

add({id:"l8-2",part:"8. 가계도 분석 비법",no:"8-2",title:"연습: 색맹 가계도 풀기",html:`

init(box){const N={1:{s:"m",x:140,y:40,f:0},2:{s:"f",x:260,y:40,f:0},3:{s:"m",x:90,y:150,f:1},4:{s:"f",x:290,y:150,f:0},5:{s:"m",x:400,y:150,f:1},6:{s:"m",x:270,y:255,f:0},7:{s:"f",x:345,y:255,f:1},8:{s:"f",x:420,y:255,f:0}};
 const C=[[1,2,[3,4]],[4,5,[6,7,8]]];
 const st=[{h:[],t:"칠한 기호는 <b>적록 색맹</b>이에요. 색맹 유전자는 X 염색체에 있다고 알려져 있어요. 정상 X, 색맹 X′로 쓸게요.",lab:{}},
  {h:[3,5,7],t:"<b>색맹인 사람부터</b>: 남자 3과 5는 <b>X′Y</b>, 여자 7은 <b>X′X′</b>예요.",lab:{3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[1,6],t:"<b>정상 남자</b>: 1과 6은 <b>XY</b>예요(남자는 X가 하나라 정상이면 XY).",lab:{1:"XY",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[2,3],t:"<b>3의 X′는 어디서?</b> 아들은 어머니에게서 X를 받으니 3의 X′는 <b>어머니 2</b>에게서 왔어요. 2는 정상이므로 <b>XX′(보인자)</b>예요.",lab:{1:"XY",2:"XX′",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[4,7],t:"<b>4는?</b> 딸 7(X′X′)은 어머니 4에게서도 X′를 받았어요. 4는 정상이므로 <b>XX′</b>예요.",lab:{1:"XY",2:"XX′",4:"XX′",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′"}},
  {h:[8,5],t:"<b>8은?</b> 딸은 아버지의 X를 반드시 받아요. 아버지 5가 X′Y이므로 8은 X′를 받았고, 정상이므로 <b>XX′</b>예요.",lab:{1:"XY",2:"XX′",4:"XX′",6:"XY",3:"X′Y",5:"X′Y",7:"X′X′",8:"XX′"}}];
 let k=0; const sv=$("#ped2",box);
 const draw=()=>{sv.innerHTML=drawPed(N,C,st[k].h,st[k].lab,[["m",0,"정상 남자"],["m",1,"색맹 남자"],["f",0,"정상 여자"],["f",1,"색맹 여자"]],310); $("#ped2t",box).innerHTML=st[k].t;};
 $("#ped2n",box).onclick=()=>{k=Math.min(st.length-1,k+1); draw();}; $("#ped2p",box).onclick=()=>{k=Math.max(0,k-1); draw();}; draw();},
quiz:[{q:"위 가계도에서 정상이지만 색맹 대립유전자를 가진 사람을 모두 고르면?",o:["2, 4, 8","1, 6","3, 5"],a:0,why:"2, 4, 8은 모두 XX′(보인자)예요. 1과 6은 XY라 X′가 없어요."},
      {q:"4와 5 사이에서 아이가 한 명 더 태어날 때 색맹일 확률은?",o:["25%","50%","100%"],a:1,why:"XX′ × X′Y → XX′, X′X′, XY, X′Y가 각각 1/4이고, 색맹(X′X′, X′Y)은 2/4 = 50%예요."}]});

add({id:"end-1",part:"마무리",no:"★1",title:"종합 점검 문제",html:`
<p class="mt0">지금까지 배운 내용을 한꺼번에 점검해요. 틀린 문제는 해설을 읽고 해당 레슨으로 돌아가 다시 보세요.</p>`,
quiz:[
 {q:"형질을 자손에게 물려주는 현상은?",o:["형질","유전","수정"],a:1,why:"유전이에요. (레슨 1-1)"},
 {q:"대립유전자에 대한 설명으로 옳은 것은?",o:["상동 염색체의 같은 위치에 있다","생식세포에 한 쌍이 모두 들어간다","우성은 소문자로 쓴다"],a:0,why:"대립유전자는 상동 염색체의 같은 위치에 있어요. 생식세포에는 하나만 들어가고, 우성은 대문자예요. (레슨 1-4, 1-5)"},
 {q:"여러 세대를 자가 수분해도 같은 형질의 자손만 나오는 개체는?",o:["잡종","순종"],a:1,why:"순종이에요. (레슨 2-2)"},
 {q:"잡종 1대에서 표현되는 형질은?",o:["우성","열성"],a:0,why:"잡종 1대에서 표현되는 형질이 우성, 표현되지 않는 형질이 열성이에요. (레슨 2-3)"},
 {q:"Yy를 자가 수분하여 자손 200개를 얻었어요. 초록색 완두(yy)는 이론상 몇 개?",o:["25개","50개","100개"],a:1,why:"yy는 1/4이므로 200 × 1/4 = 50개예요. (레슨 3-5)"},
 {q:"Rr를 자가 수분한 자손 중 순종의 비율은?",o:["1/4","1/2","3/4"],a:1,why:"순종은 RR(1/4) + rr(1/4) = 1/2이에요. (레슨 3-5)"},
 {q:"RrYy가 만드는 생식세포의 종류는 몇 가지?",o:["2가지","4가지","16가지"],a:1,why:"RY, Ry, rY, ry 4가지예요. (레슨 4-2)"},
 {q:"RrYy를 자가 수분한 자손 1600개 중 주름지고 초록색인 완두는 이론상 몇 개?",o:["100개","300개","900개"],a:0,why:"주름지고 초록색은 1/16이므로 1600 × 1/16 = 100개예요. (레슨 4-4)"},
 {q:"사람의 유전 연구에서 유전과 환경의 영향을 비교하는 방법은?",o:["가계도 조사","쌍둥이 조사","집단 조사"],a:1,why:"쌍둥이 조사예요. (레슨 5-2)"},
 {q:"분리형 귓불인 부모 사이에서 부착형 귓불인 자녀가 태어났다면?",o:["부착형이 우성","부착형이 열성"],a:1,why:"부모에게 없던 형질이 나타났으니 부착형이 열성이에요. (레슨 5-5)"},
 {q:"O형인 아버지와 AB형인 어머니 사이에서 태어날 수 없는 자녀의 혈액형은?",o:["A형","B형","O형"],a:2,why:"OO × AB → AO(A형), BO(B형)만 나와요. O형과 AB형 자녀는 태어날 수 없어요. (레슨 6-2)"},
 {q:"색맹 대립유전자를 가진 아버지(X′Y)의 아들에게 그 대립유전자가 전달될까요?",o:["전달된다","전달되지 않는다"],a:1,why:"아들은 아버지에게서 Y를 받으므로 아버지의 X′를 받지 않아요. (레슨 7-1, 7-3)"},
 {q:"보인자 어머니(XX′)와 색맹 아버지(X′Y) 사이에서 태어난 딸이 색맹일 확률은?",o:["0%","50%","100%"],a:1,why:"딸은 아버지에게서 X′를 반드시 받고, 어머니에게서 X 또는 X′를 1/2씩 받아요. 그래서 딸이 색맹(X′X′)일 확률은 50%예요. (레슨 7-3)"},
 {q:"열성 형질인 딸의 아버지가 우성(정상)인 가계도에서 이 형질의 유전자는?",o:["X 염색체","상염색체"],a:1,why:"X 염색체 유전이면 열성 딸의 아버지도 열성이어야 해요. 아버지가 정상이므로 상염색체 유전이에요. (레슨 8-1)"}]});

add({id:"end-2",part:"마무리",no:"★2",title:"용어 사전",html:`
<p class="mt0">헷갈리는 용어를 빠르게 찾아보세요.</p>
<input id="dq" type="search" placeholder="용어 검색 (예: 잡종)" style="width:100%;max-width:360px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">
<div class="tablewrap"><table class="t" id="dict" style="margin-left:0;text-align:left"></table></div>`,
init(box){const D=[["형질","생물이 가지고 있는 고유한 특징","1-1"],["유전","형질을 자손에게 물려주는 현상","1-1"],["대립 형질","하나의 형질에 대해 서로 뚜렷하게 구별되는 형질 (둥근 – 주름진)","1-2"],
 ["유전자","형질을 결정하는 정보. 염색체에 있다","1-3"],["상동 염색체","모양과 크기가 같은 염색체 쌍. 하나는 엄마, 하나는 아빠에게서 받음","1-3"],["대립유전자","대립 형질을 결정하는 서로 다른 유전자. 상동 염색체의 같은 위치에 있음","1-4"],
 ["생식세포","자손을 만드는 세포(난세포, 정자, 꽃가루). 대립유전자 쌍 중 하나만 들어 있음","1-5"],["수정","난세포와 정자(꽃가루)가 만나는 것","1-5"],["자가 수분","꽃가루가 같은 그루의 꽃 암술머리에 붙는 현상","2-1"],["타가 수분","꽃가루가 다른 그루의 꽃 암술머리에 붙는 현상","2-1"],
 ["순종","여러 세대 자가 수분해도 같은 형질만 나오는 개체 (RR, rr)","2-2"],["잡종","대립 형질이 다른 두 순종을 타가 수분해 얻은 자손 (Rr)","2-2"],["우성","잡종 1대에서 표현되는 형질","2-3"],["열성","잡종 1대에서 표현되지 않는 형질","2-3"],
 ["표현형","겉으로 드러나는 형질 (둥근 완두)","2-4"],["유전자형","대립유전자 구성을 알파벳으로 나타낸 것 (Rr)","2-4"],["분리의 법칙","생식세포가 만들어질 때 대립유전자 쌍이 분리되어 서로 다른 생식세포로 하나씩 들어가는 현상","3-2"],
 ["독립의 법칙","한 형질의 대립유전자 쌍이 다른 형질의 대립유전자 쌍에 영향을 받지 않고 독립적으로 분리되어 유전되는 현상","4-2"],["가계도","한 집안의 특정 형질 유전을 기호로 나타낸 그림","5-5"],["상염색체","성염색체를 제외한 염색체","5-4"],["성염색체","성별을 결정하는 염색체 (여자 XX, 남자 XY)","7-1"],
 ["반성유전","유전자가 성염색체에 있어 남녀에 따라 형질이 나타나는 빈도가 다른 유전 현상","7-2"],["보인자","색맹 대립유전자를 하나 가졌지만 정상인 여자 (XX′)","7-2"]];
 const t=$("#dict",box); const draw=q=>{t.innerHTML="<tr><th>용어</th><th>뜻</th><th>레슨</th></tr>"+D.filter(d=>!q||d[0].includes(q)||d[1].includes(q)).map(d=>`<tr><td><b>${d[0]}</b></td><td style="text-align:left">${d[1]}</td><td><a href="#${"l"+d[2]}">${d[2]}</a></td></tr>`).join("");};
 draw(""); $("#dq",box).oninput=e=>draw(e.target.value.trim());}});

add({id:"end-3",part:"마무리",no:"★3",title:"나의 학습 현황",html:`
<p class="mt0">레슨별 확인 문제 결과와 할 수 있어요 체크를 모아 보여 줘요. 빨간색 레슨은 다시 공부해 보세요.</p>
<div class="tablewrap"><table class="t" id="rep" style="margin-left:0"></table></div>
<div class="ctrl" style="justify-content:flex-start"><button class="btn ghost" id="resetall">기록 모두 지우기</button><span id="resetmsg" style="font-size:14px;color:var(--muted);align-self:center"></span></div>`,
init(box){const t=$("#rep",box); t.innerHTML="<tr><th>레슨</th><th>제목</th><th>확인 문제</th></tr>"+L.filter(x=>x.quiz).map(x=>{const r=S.quiz[x.id]; const n=x.quiz.length; const c=r?Object.values(r).filter(v=>v).length:0; const tried=r?Object.keys(r).length:0;
  const col=!tried?"var(--muted)":c===n?"var(--ok)":"var(--bad)"; return `<tr><td>${x.no}</td><td style="text-align:left"><a href="#${x.id}">${x.title}</a></td><td style="color:${col};font-weight:700">${tried?c+" / "+n:"아직 안 풀었어요"}</td></tr>`;}).join("");
 let armed=false; $("#resetall",box).onclick=()=>{if(!armed){armed=true; $("#resetmsg",box).textContent="한 번 더 누르면 모든 기록이 지워져요."; return;} S={done:{},quiz:{},can:{}}; save(); $("#resetmsg",box).textContent="기록을 지웠어요."; armed=false; updateProg(); renderToc();};}});

/* ---------- 파트별 할 수 있어요 체크 ---------- */
const CAN={"1. 유전의 기초":["형질, 유전, 대립 형질의 뜻을 말할 수 있다","유전자가 염색체에 있고, 대립유전자는 상동 염색체의 같은 위치에 있다는 것을 설명할 수 있다","생식세포에는 대립유전자가 하나씩만 들어간다는 것을 설명할 수 있다"],
 "2. 멘델의 실험":["자가 수분과 타가 수분을 구별할 수 있다","순종과 잡종을 유전자형으로 구별할 수 있다","우성과 열성의 뜻을 말하고, '우성 = 좋은 것'이 아님을 안다","표현형과 유전자형을 구별하고, RR와 Rr가 같은 표현형임을 안다"],
 "3. 분리의 법칙":["분리의 법칙을 한 문장으로 말할 수 있다","Rr × Rr의 결합 표를 그려 1 : 2 : 1과 3 : 1을 구할 수 있다","전체 개수와 비율로 특정 완두의 수를 구할 수 있다"],
 "4. 독립의 법칙":["RrYy가 만드는 생식세포 4가지를 쓸 수 있다","잡종 2대의 표현형 분리비 9 : 3 : 3 : 1을 설명할 수 있다","두 형질의 확률을 곱해서 개수를 구할 수 있다"],
 "5. 사람의 유전":["사람의 유전 연구가 어려운 까닭 3가지를 말할 수 있다","가계도 조사, 쌍둥이 조사, 집단 조사로 알 수 있는 것을 구별할 수 있다","가계도에서 우열을 판단하고 유전자형을 쓸 수 있다"],
 "6. ABO식 혈액형":["ABO식 혈액형의 표현형과 유전자형을 짝 지을 수 있다","부모의 유전자형으로 자녀의 혈액형과 확률을 구할 수 있다"],
 "7. 반성유전":["아들과 딸이 부모에게서 각각 어떤 성염색체를 받는지 설명할 수 있다","색맹의 유전자형과 표현형, 보인자를 설명할 수 있다","적록 색맹이 남자에게 더 많이 나타나는 까닭을 설명할 수 있다"],
 "8. 가계도 분석 비법":["가계도 분석 3단계를 순서대로 말할 수 있다","가계도에서 상염색체 유전인지 X 염색체 유전인지 판단할 수 있다"]};

/* ================= 화면 그리기 ================= */
function shuf(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1)); const x=a[i]; a[i]=a[k]; a[k]=x;} return a;}
function lessonIndex(id){return Math.max(0,L.findIndex(x=>x.id===id));}
function renderToc(){const toc=$("#toc"); let h=`<button class="tocbtn closer" id="tocclose">닫기 ✕</button>`; let part="";
 L.forEach(x=>{if(x.part!==part){part=x.part; h+=`<h3>${part}</h3>`;} const q=S.quiz[x.id]; const ok=x.quiz&&q&&Object.keys(q).length===x.quiz.length&&Object.values(q).every(v=>v);
  const st=S.done[x.id]?(ok?"✔":x.quiz?"●":"✔"):""; h+=`<a href="#${x.id}" data-id="${x.id}"><span class="n">${x.no}</span><span>${x.title}</span><span class="st">${st}</span></a>`;});
 toc.innerHTML=h; const cl=$("#tocclose"); if(cl) cl.onclick=()=>toc.classList.remove("open");
 toc.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>toc.classList.remove("open")));
 markCur();}
function markCur(){const id=cur().id; document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("cur",a.dataset.id===id));}
function cur(){const id=(location.hash||"").slice(1); return L[lessonIndex(id||"start")]||L[0];}
function updateProg(){const n=L.length, d=L.filter(x=>S.done[x.id]).length; $("#progbar").style.width=(d/n*100)+"%"; $("#progtxt").textContent=d+" / "+n;}
function renderLesson(){const x=cur(), i=L.indexOf(x), box=$("#lesson");
 let h=`<div class="crumb">${x.part} · ${x.no}</div><h2>${x.title}</h2>${x.html}`;
 if(x.quiz){h+=`<section class="quiz"><h3>확인 문제</h3>${x.quiz.map((q,k)=>`<div class="qitem" data-k="${k}"><div class="qq">${k+1}. ${q.q}</div><div class="opts">${shuf(q.o.map((o,j)=>[o,j])).map(([o,j])=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div><div class="fb"></div></div>`).join("")}</section>`;}
 const last=i===L.length-1||L[i+1].part!==x.part;
 if(last&&CAN[x.part]){h+=`<section class="can"><h3>할 수 있어요 체크 · ${x.part}</h3><p style="margin:4px 0 6px;font-size:14px;color:var(--muted)">자신 있게 할 수 있는 것에 체크하세요. 체크하지 못한 것은 해당 레슨을 다시 보세요.</p>${CAN[x.part].map((c,j)=>{const id=`can-${x.part.slice(0,2)}-${j}`; return `<label for="${id}"><input type="checkbox" id="${id}" data-key="${id}" ${S.can[id]?"checked":""}><span>${c}</span></label>`;}).join("")}</section>`;}
 h+=`<nav class="pager">${i>0?`<a class="btn ghost" href="#${L[i-1].id}" style="text-decoration:none">◀ 이전: ${L[i-1].title}</a>`:"<span></span>"}${i<L.length-1?`<a class="btn" href="#${L[i+1].id}" style="text-decoration:none">다음: ${L[i+1].title} ▶</a>`:""}</nav>`;
 h+=`<footer class="srcfoot">${SRC_FULL}</footer>`;
 box.innerHTML='<div class="lesson-inner">'+h+'</div>'; const inner=box.firstElementChild;
 if(x.init) try{x.init(inner);}catch(e){console.error(e);}
 box.querySelectorAll(".qitem").forEach(qi=>{const k=+qi.dataset.k, q=x.quiz[k];
  qi.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j; qi.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));
   b.classList.add(j===q.a?"right":"wrong"); if(j!==q.a) qi.querySelector('.opt[data-j="'+q.a+'"]').classList.add("right");
   const fb=qi.querySelector(".fb"); fb.innerHTML=(j===q.a?`<span class="r">정답이에요!</span> `:`<span class="w">아쉬워요. 정답은 "${q.o[q.a]}"예요.</span> `)+q.why; fb.classList.add("show");
   S.quiz[x.id]=S.quiz[x.id]||{}; if(!(k in S.quiz[x.id])||!S.quiz[x.id][k]) S.quiz[x.id][k]=(j===q.a); save(); renderToc();});});
 box.querySelectorAll(".can input").forEach(c=>c.onchange=()=>{S.can[c.dataset.key]=c.checked; save();});
 S.done[x.id]=1; save(); updateProg(); markCur(); renderToc();
 window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});}
$("#srcline").textContent=SRC_SHORT; document.title="완두에서 사람까지 유전 공부 · "+SRC.school;
$("#tocbtn").onclick=()=>$("#toc").classList.add("open");
window.addEventListener("hashchange",renderLesson);
renderToc(); renderLesson();
})();
</script>
</body></html>
